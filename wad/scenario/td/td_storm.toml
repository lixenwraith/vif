# Finale: early storm on ST pylon death; forced breach when all side pylons cleared
# Victory latches only after storm dead AND all side pylons dead (early-storm path may leave pylons)

[states.StWait]
parent = "Root"
transitions = [
    # Early breach: player killed the ST pylon (counter region sets st_dead)
    { trigger = "Tick", target = "StIncoming", guard = "VarEquals", guard_args = { var = "st_dead", value = 1 } },
    # Forced breach: every non-ST pylon dead → PylonCancelRequest hits only ST
    { macro = "SidesCleared", target = "StForceBreach" },
]

[states.StForceBreach]
parent = "Root"
on_enter = [
    # Precondition (gate above) guarantees ST is the only surviving pylon
    { action = "EmitEvent", event = "EventPylonCancelRequest" },
]
transitions = [
    { trigger = "Tick", target = "StIncoming", guard = "StateTimeExceeds", guard_args = { ms = 250 } },
]

[states.StIncoming]
parent = "Root"
on_enter = [
    { macro = "Announce", color = { r = 180, g = 0, b = 255 }, duration_ms = 400, message = "STORM BREACH - KILL IT BEFORE IT REACHES THE TOWERS" },
]
transitions = [
    { trigger = "Tick", target = "StSpawn" },
]

# Same shape as main's StormSetup: a refused spawn asks again rather than falling
# through StLive's defensive timeout, which would clear a storm never fought.
[states.StSpawn]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventStormSpawnRequest" },
]
transitions = [
    { trigger = "EventSpeciesCreated", target = "StLive", guard = "PayloadIntCompare", guard_args = { field = "species", op = "eq", value = 4 } },
    { trigger = "Tick", target = "StLive", guard = "And", guard_args = { guards = [
        { name = "StateTimeExceeds", args = { ms = 500 } },
        { name = "StatusBoolEquals", args = { key = "storm.active", value = true } },
    ] } },
    { trigger = "Tick", target = "StSpawnRetry", guard = "StateTimeExceeds", guard_args = { ms = 500 } },
]

[states.StSpawnRetry]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "StSpawn", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

[states.StLive]
parent = "Root"
transitions = [
    { macro = "Slain", species = 4, active = "storm.active", target = "StCleared" },
]

[states.StCleared]
parent = "Root"
transitions = [
    # Early-storm path: remaining side pylons must still fall
    { macro = "SidesCleared", target = "StVictory" },
]

[states.StVictory]
parent = "Root"
on_enter = [
    { action = "SetVar", payload = { name = "game_won", value = 1 } },
]
# Idle; monitor handles end sequence
