# The bat: its wings beating, its feet dangling on the downstroke. One of the moss
# cave's third-tier raiders: RaiderTier3 in ../../macros.toml gives its stats and
# cycle and the cave its colours.
macro = "RaiderTier3"
theme = "Moss"
width = 5
height = 3
header = { x = 2, y = 1 }
pattern_ms = 180

# Wings 2, ears 3, face 0, eyes 1
[[frames]]
glyphs = ["\\^ ^/", "(o.o)", "     "]
fg     = ["23 32", "01010", "     "]
attr   = ["     ", " B B ", "     "]

[[frames]]
glyphs = ["_^ ^_", "(o.o)", "     "]
fg     = ["23 32", "01010", "     "]
attr   = ["     ", " B B ", "     "]

[[frames]]
glyphs = [" ^ ^ ", "(o.o)", "/   \\"]
fg     = [" 3 3 ", "01010", "2   2"]
attr   = ["     ", " B B ", "     "]

[[frames]]
glyphs = ["_^ ^_", "(o.o)", "     "]
fg     = ["23 32", "01010", "     "]
attr   = ["     ", " B B ", "     "]
