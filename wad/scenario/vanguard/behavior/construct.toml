# The construct: a slow armoured hull that winds up long and hits hard. It flies the
# raiders" one cycle (RaiderStates in ../macros.toml) at the drain"s crawl, its
# core flaring amber between its plates. doc/fsm-reference.md lists every key and
# verb.
initial = "Chase"
suspend = { guard = "Stunned" }

# Heavy: hit points times chase speed is the raid's 96
[prototype]
width = 4
height = 2
header = { x = 1, y = 0 }
hp = 48
combat = "swarm"
homing = "drain"
mass = 4.0
contact = { energy = 1500, heat = 15 }
pattern_ms = 700
fg = [{ r = 180, g = 180, b = 200 }, { r = 255, g = 140, b = 40 }]
bg = [{ r = 70, g = 30, b = 10 }]
fg256 = 11                          # bright yellow, over red where the core glows
bg256 = 1

# Plates 0, core 1 over its ember glow
[[prototype.frames]]
glyphs = ["╓──╖", "╙──╜"]
fg     = ["0110", "0000"]

[[prototype.frames]]
glyphs = ["╒══╕", "╘══╛"]
fg     = ["0110", "0000"]
bg     = [" 00 ", "    "]
attr   = [" BB ", "    "]

[states]
macro = "RaiderStates"
chase_ms = 6000
lock_ms = 2500
charge_ms = 1000
beam_ms = 600

[[global]]
macro = "RaiderStun"
