# The shard: a living crystal, its facets shimmering, a glint running round it. One
# of the crystal cave's first-tier raiders: RaiderTier1 in ../../macros.toml gives
# its stats and cycle and the cave its colours.
macro = "RaiderTier1"
theme = "Crystal"
width = 4
height = 2
header = { x = 1, y = 0 }
pattern_ms = 250

# Facets 0 and 2 trading shades, eyes 1, glint 3
[[frames]]
glyphs = ["<oo>", " \\/ "]
fg     = ["0110", " 22 "]
attr   = [" BB ", "    "]

[[frames]]
glyphs = ["<oo>", " \\/ "]
fg     = ["2112", " 00 "]
attr   = [" BB ", "    "]

[[frames]]
glyphs = ["*oo*", " \\/ "]
fg     = ["3113", " 22 "]
attr   = [" BB ", "    "]
