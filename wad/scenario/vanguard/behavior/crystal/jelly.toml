# The jelly: a bell trailing tendrils that sway. One of the crystal cave's
# third-tier raiders: RaiderTier3 in ../../macros.toml gives its stats and cycle and
# the cave its colours.
macro = "RaiderTier3"
theme = "Crystal"
width = 5
height = 3
header = { x = 2, y = 1 }
pattern_ms = 400

# Bell 0, eyes 1, tendrils 2
[[frames]]
glyphs = [".---.", "(o o)", " ))) "]
fg     = ["00000", "01010", " 222 "]
attr   = ["     ", " B B ", "     "]

[[frames]]
glyphs = [".---.", "(o o)", " ((( "]
fg     = ["00000", "01010", " 222 "]
attr   = ["     ", " B B ", "     "]
