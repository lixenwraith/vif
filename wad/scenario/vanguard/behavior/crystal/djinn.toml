# The djinn: a spirit on a swirling tail. One of the crystal cave's fourth-rank
# raiders: RaiderRank4 in ../../macros.toml gives its stats and cycle and the cave
# its colours.
macro = "RaiderRank4"
theme = "Crystal"
width = 5
height = 3
header = { x = 2, y = 1 }
pattern_ms = 350

# Crown 3, face 0, eyes 1, tail 2
[[frames]]
glyphs = [" ~~~ ", "(o o)", " ))) "]
fg     = [" 333 ", "01010", " 222 "]
attr   = ["     ", " B B ", "     "]

[[frames]]
glyphs = [" ~~~ ", "(o o)", " ((( "]
fg     = [" 333 ", "01010", " 222 "]
attr   = ["     ", " B B ", "     "]

[[frames]]
glyphs = [" ~~~ ", "(o o)", " ||| "]
fg     = [" 333 ", "01010", " 222 "]
attr   = ["     ", " B B ", "     "]
