# The scarab: a fast, fragile beetle that darts in on a short warning. It flies the
# raiders" one cycle (RaiderStates in ../macros.toml) at the snake"s chase, its red
# eyes blinking in a violet shell. doc/fsm-reference.md lists every key and verb.
initial = "Chase"
suspend = { guard = "Stunned" }

# Light: hit points times chase speed is the raid's 96
[prototype]
width = 4
height = 2
header = { x = 1, y = 0 }
hp = 8
combat = "swarm"
homing = "snake"
mass = 1.0
contact = { energy = 600, heat = 6 }
pattern_ms = 350
fg = [{ r = 170, g = 90, b = 230 }, { r = 255, g = 60, b = 60 }, { r = 110, g = 60, b = 160 }]
fg256 = 13                          # bright magenta, its hit a reversed block
bg256 = 5

# Shell 0, eyes 1, legs 2
[[prototype.frames]]
glyphs = ["┌oo┐", "└──┘"]
fg     = ["0110", "0220"]
attr   = [" BB ", "    "]

[[prototype.frames]]
glyphs = ["┌--┐", "└~~┘"]
fg     = ["0000", "0220"]

[states]
macro = "RaiderStates"
chase_ms = 3000
lock_ms = 1200
charge_ms = 500
beam_ms = 300

[[global]]
macro = "RaiderStun"
