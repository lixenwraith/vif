# The demon: horned, its jaw working. One of the cracked cave's fourth-tier raiders:
# RaiderTier4 in ../../macros.toml gives its stats and cycle and the cave its
# colours.
macro = "RaiderTier4"
theme = "Cracked"
width = 5
height = 3
header = { x = 2, y = 1 }
