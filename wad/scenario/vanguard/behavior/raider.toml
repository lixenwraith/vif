# The raider: the cave's swarm, after the swarm's own machine. It chases its
# target for five seconds, then locks onto the cell it saw for two under a
# telegraph. Along a clear line it charges that cell; behind rock it beams to the
# nearest place by its target and lands as the beam ends, beside any rock that
# came over the landing meanwhile; with no room anywhere it brakes where it
# stands. Rock pushes it as it pushes the cursor, enraged or not. It lives until
# killed: a positive lifetime_ms gives it a time to die. doc/fsm-reference.md
# lists every key and verb.
initial = "Chase"
suspend = { guard = "Stunned" }

# The swarm's body and contact; the frames are the swarm's console ones, which
# every console font carries
[prototype]
width = 4
height = 2
header = { x = 1, y = 0 }
hp = 20
combat = "swarm"
homing = "swarm"
mass = 2.0
contact = { energy = 1000, heat = 10 }
lifetime_ms = 0
glyphs = [["╔══╗", "╚══╝"], ["═╗╔═", "═╝╚═"]]
pattern_ms = 500
color = { r = 0, g = 200, b = 200 }

# With no target the lock waits, the chase moving meanwhile
[states.Chase]
duration_ms = 5000
on_update = [{ action = "Home" }]
transitions = [{ trigger = "Timeout", target = "Lock", fallback = { retry_ms = 200 } }]

[states.Lock]
duration_ms = 2000
flags = ["Enraged"]
probe = "ResolveTarget"
on_enter = [{ action = "StoreTarget" }, { action = "Telegraph", payload = { color = "cyan" } }]
on_update = [{ action = "Freeze" }]
on_exit = [{ action = "CancelTelegraph" }]
transitions = [{ trigger = "Timeout", target = [{ state = "Charge", guard = "LineOfSight" }, "Beam", "Brake"] }]

# Arrives on the stored cell as the entry ends; a wall ends it in the step that
# meets it, so the bounce stands
[states.Charge]
duration_ms = 800
flags = ["Enraged"]
on_update = [{ action = "ChargeToStored" }]
transitions = [
    { trigger = "Timeout", target = "Brake" },
    { trigger = "AfterTick", guard = "HitWall", target = "Brake" },
]

# The line runs from wherever the raider stands, so rock carrying it bends the
# beam. The landing is the timeout's, so a stun that ends the beam moves nothing,
# and Teleport looks for room again as it lands.
[states.Beam]
duration_ms = 400
flags = ["Enraged", "Beam"]
probe = "FindLanding"
on_enter = [{ action = "StoreTarget" }]
on_update = [{ action = "Freeze" }]
transitions = [{ trigger = "Timeout", target = "Brake", actions = [{ action = "Teleport" }] }]

# The swarm's stop: a tenth of the speed left each tick
[states.Brake]
duration_ms = 100
flags = ["Enraged"]
on_update = [{ action = "Drag", payload = { rate = 18.0 } }]
transitions = [{ trigger = "Timeout", target = "Chase" }]

# A stun cancels the attack and restarts the whole chase
[[global]]
from = ["Lock", "Charge", "Beam", "Brake"]
guard = "Stunned"
target = "Chase"
