# The storm eye: the eye species' storm type flown as a raider, the raid's largest
# body. It flies the raiders' one cycle (RaiderStates in ../macros.toml) with the
# quasar's slow arrival, its pupil flickering under a rotating highlight.
# doc/fsm-reference.md lists every key and verb.
initial = "Chase"
suspend = { guard = "Stunned" }

# Heavy: hit points times chase speed is the raid's 96; the eye's 5×3, the largest a
# composite navigates
[prototype]
width = 5
height = 3
header = { x = 2, y = 1 }
hp = 48
combat = "swarm"
homing = "quasar"
mass = 3.0
contact = { energy = 1200, heat = 12 }
pattern_ms = 600
fg = [
    { r = 0, g = 220, b = 220 },    # 0 bright cyan
    { r = 80, g = 140, b = 220 },   # 1 cerulean
    { r = 255, g = 255, b = 255 },  # 2 white
    { r = 255, g = 240, b = 60 },   # 3 lemon
    { r = 60, g = 100, b = 180 },   # 4 steel blue
    { r = 40, g = 180, b = 255 },   # 5 dodger blue
    { r = 80, g = 200, b = 220 },   # 6 sky teal
    { r = 135, g = 206, b = 250 },  # 7 light sky blue
]
bg = [{ r = 15, g = 25, b = 50 }, { r = 50, g = 80, b = 200 }]
fg256 = 14                          # bright cyan over blue, the eye's console pair
bg256 = 4

[[prototype.frames]]
glyphs = ["+~~~+", "|(O)|", "+~~~+"]
fg     = ["40004", "41214", "40004"]
bg     = ["00000", "01110", "00000"]
attr   = ["BBBBB", " BBB ", "BBBBB"]

[[prototype.frames]]
glyphs = ["+~~~+", "|(=)|", "+~~~+"]
fg     = ["40004", "41614", "40004"]
bg     = ["00000", "01110", "00000"]
attr   = ["BBBBB", " B B ", "BBBBB"]

[[prototype.frames]]
glyphs = ["+~~~+", "|{O}|", "+~~~+"]
fg     = ["43034", "43234", "43034"]
bg     = ["00100", "01110", "00100"]
attr   = ["BBBBB", "BBBBB", "BBBBB"]

[states]
macro = "RaiderStates"
chase_ms = 4000
lock_ms = 1600
charge_ms = 700
beam_ms = 500

[[global]]
macro = "RaiderStun"
