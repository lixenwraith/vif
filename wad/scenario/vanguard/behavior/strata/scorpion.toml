# The scorpion: its tail swinging over its back. One of the strata's fourth-tier
# raiders: RaiderTier4 in ../../macros.toml gives its stats and cycle and the cave
# its colours.
macro = "RaiderTier4"
theme = "Strata"
width = 5
height = 3
header = { x = 2, y = 1 }
pattern_ms = 300

# Tail 3, head 0, eyes 1, legs 2
[[frames]]
glyphs = ["  /| ", "(oo) ", "/||\\\\"]
fg     = ["  33 ", "0110 ", "22222"]
attr   = ["     ", " BB  ", "     "]

[[frames]]
glyphs = [" /|  ", " (oo)", "/||\\\\"]
fg     = [" 33  ", " 0110", "22222"]
attr   = ["     ", "  BB ", "     "]

[[frames]]
glyphs = ["/|   ", "(oo) ", "/||\\\\"]
fg     = ["33   ", "0110 ", "22222"]
attr   = ["     ", " BB  ", "     "]
