# The crawler: a mite scuttling on its legs. One of the strata's first-tier raiders:
# RaiderTier1 in ../../macros.toml gives its stats and cycle and the cave its
# colours.
macro = "RaiderTier1"
theme = "Strata"
width = 4
height = 2
header = { x = 1, y = 0 }
pattern_ms = 300

# Head 0, eyes 1, legs 2
[[frames]]
glyphs = ["{oo}", "/\\/\\"]
fg     = ["0110", "2222"]
attr   = [" BB ", "    "]

[[frames]]
glyphs = ["[oo]", "\\/\\/"]
fg     = ["0110", "2222"]
attr   = [" BB ", "    "]
