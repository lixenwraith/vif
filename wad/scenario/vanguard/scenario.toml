description = "Fly a cave that scrolls past you: its rock pushes you back, and the left edge crushes you."
min_players = 1
max_players = 16
macro_files = ["macros.toml"]

# A side-scroller after Vanguard (1981): the cursor is a ship and the cave scrolls
# left past it. Rock pushes the cursor a column back and toward the channel; rock
# pressing it against the left edge crushes it and the game starts over. Glyphs drift
# left behind the rock at three depths as scenery no key types, raiders of the cave's
# own eight types arrive at the right edge on a timer, and those shot down drop U's
# that raise the gun a level, from one shot forward to three each way, energy and
# heat. Four ranks shot down end the cave: it opens to no rock, the scroll halts and
# the Kraken rises, and once it is shot down species damage doubles and the next
# cave comes in, faster and of another stone.

# Twice the cave's narrowest gap, so even the smallest map opens past its narrowest
[map]
min_width = 80
min_height = 18

# The raider types, one program each over the one cycle in macros.toml, so each
# keeps its own kill counter and behavior.<type>.* rows: eight to a stone art, its
# tier, two of each of four ranks, smallest first. RaidSpawn picks among the cave's
# two of the rank the ramp has reached.
[behaviors]
# Strata: violet vermin
scarab = { file = "behavior/strata/scarab.toml" }
crawler = { file = "behavior/strata/crawler.toml" }
crab = { file = "behavior/strata/crab.toml" }
hornet = { file = "behavior/strata/hornet.toml" }
spider = { file = "behavior/strata/spider.toml" }
mantis = { file = "behavior/strata/mantis.toml" }
beetle = { file = "behavior/strata/beetle.toml" }
scorpion = { file = "behavior/strata/scorpion.toml" }
# Cracked: white haunts
gremlin = { file = "behavior/cracked/gremlin.toml" }
chomper = { file = "behavior/cracked/chomper.toml" }
imp = { file = "behavior/cracked/imp.toml" }
slime = { file = "behavior/cracked/slime.toml" }
ghost = { file = "behavior/cracked/ghost.toml" }
skull = { file = "behavior/cracked/skull.toml" }
wraith = { file = "behavior/cracked/wraith.toml" }
demon = { file = "behavior/cracked/demon.toml" }
# Moss: orange animals
hedgehog = { file = "behavior/moss/hedgehog.toml" }
mouse = { file = "behavior/moss/mouse.toml" }
frog = { file = "behavior/moss/frog.toml" }
hopper = { file = "behavior/moss/hopper.toml" }
bat = { file = "behavior/moss/bat.toml" }
puffer = { file = "behavior/moss/puffer.toml" }
owl = { file = "behavior/moss/owl.toml" }
lynx = { file = "behavior/moss/lynx.toml" }
# Crystal: orchid constructs
drone = { file = "behavior/crystal/drone.toml" }
shard = { file = "behavior/crystal/shard.toml" }
saucer = { file = "behavior/crystal/saucer.toml" }
trooper = { file = "behavior/crystal/trooper.toml" }
jelly = { file = "behavior/crystal/jelly.toml" }
squid = { file = "behavior/crystal/squid.toml" }
djinn = { file = "behavior/crystal/djinn.toml" }
robot = { file = "behavior/crystal/robot.toml" }

# The U: the gun's next level of the path the ship flies. Every raider type names
# the raider table, so a raider a player shoots down rolls it for every player where
# it fell; one that dies by no player's hand drops nothing.
[loot.upgrade]
rune = "U"
color = { r = 255, g = 255, b = 0 }
glow = { r = 100, g = 220, b = 100 }
reward = "weapon"
weapon = "gun"

# Each tier rolls on its own, its chance growing by as much again for each kill in a
# row it misses, on streaks every raider type shares from cave to cave: heat at 5%,
# the U at 50% until the gun holds its last level, when its fallback makes each
# energy drop two, and energy at 20%. Heat rolls first, so the fallback passes it by.
[drops.raider]
killer = "player"
tiers = [
    { entries = [{ loot = "heat", rate = 0.05 }] },
    { unique = true, entries = [{ loot = "upgrade", rate = 0.5, fallback = 1 }] },
    { entries = [{ loot = "energy", rate = 0.2 }] },
]

# The Kraken a player shoots down drops a missile charge, heat and two energy for
# every player, in place of its code drops
[drops.kraken]
killer = "player"
tiers = [
    { entries = [{ loot = "launcher", rate = 1.0 }] },
    { entries = [{ loot = "heat", rate = 1.0 }] },
    { entries = [{ loot = "energy", rate = 1.0, count = 2 }] },
]

# No drains, and so nothing to fuse: the raid spawns its raiders directly
[regions.main]
initial = "CaveStart"
disabled_systems = ["nugget", "gold", "drain", "fuse"]

[regions.raid]
initial = "RaidWait"
background = true

[regions.ramp]
initial = "RaidRank1"
background = true

[regions.boss]
background = true

[regions.player]
initial = "PlayerBoot"
background = true

# --- Cave ---

# The cave scrolls a column a tick at first: only whole columns a tick step evenly.
# It is jagged: ceiling and floor each reach in by four octaves of noise from 64
# columns down, smoothed past any bump of two columns, so the gap runs from 9 rows
# to all but the walls' two each, as the map allows, mostly two or three times the
# narrowest on a map of 40 rows. A wall reaches 27 rows in at most, so a taller map,
# a phone held upright, keeps that much rock and opens every row it adds, narrowing
# the less the taller it is; max_gap 2000, the tallest map, caps no band. With no
# rough rock the walls stay smooth. A mouth of open map as wide as the view, no rock
# at all, comes first, then the cave closes in over 96 columns (the Cave macro). The
# rock blocks the ship, raiders and spawns but not particles, which pass through it
# hidden, and each step carries those no anchor holds a column left with it, so
# blossom rises, decay falls and dust wanders in the cave's frame. It wears one of
# four stone arts; every rock cell draws a glyph, so it reads on a text console's
# sixteen colours too. The glyphs drift past faster than the rock, at 20, 40 and 80
# cells a second by layer, fast enough for each layer to read as moving and the
# depths to come apart; a layer steps whole cells a tick, which the renderer spreads
# over the frames between. They are scenery: rock and raiders pass them by and the
# rock hides them, while particles and the gun act on them. The seed is drawn from
# the run's, so each new game flies a new cave and a run's seed replays its caves in
# order. The first cave's art is its seed modulo four; each cave after a boss wears
# one of the other three and scrolls faster (BossDown).
[states.CaveStart]
parent = "Root"
on_enter = [
    { action = "RandomVar", payload = { name = "cave_seed", min = 1, max = 2147483647, index_var = "cave_index" } },
    { action = "CopyVar", payload = { name = "cave_art", source_var = "cave_seed" } },
    { action = "ModuloVar", payload = { name = "cave_art", delta = 4 } },
    { action = "SetVar", payload = { name = "cave_speed", value = 20 } },
    { macro = "Cave" },
    { action = "EmitEvent", event = "EventDriftStart", payload = { direction = 3.141592653589793, speed = 80.0, duration_ms = 0, scenery = true } },
]

# --- Raiders ---

# A raider materializes at the right edge every two seconds while fewer than three
# fly or materialize, every data species being a raider, on a row drawn inside the
# two rows a wall keeps at its thinnest. The request names the map's width, a column
# past its right edge, and the materialize stands each footprint flush against that
# edge whatever its size; it searches the whole map from there, so rock on that row
# sends it to the nearest open rows, and the raider lands as it ends, beside any
# rock that came over it meanwhile. The type is drawn between the two of the ramp's
# rank in the cave's eight: eight times the cave's stone art, as the Cave macro's
# pick takes it, is the first of its types in the pick's list, which runs the arts
# in the macro's order, and twice the rank the first of that rank's pair. The raid
# holds while a boss stage runs (raid_boss).
[states.RaidWait]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "RaidSpawn", guard = "And", guard_args = { guards = [
        { name = "StateTimeExceeds", args = { ms = 2000 } },
        { name = "StatusIntCompare", args = { key = "behavior.count", op = "lt", value = 3 } },
        { name = "VarCompare", args = { var = "raid_boss", op = "eq", value = 0 } },
    ] } },
]

[states.RaidSpawn]
parent = "Root"
on_enter = [
    { action = "ConfigToVar", payload = { field = "map_width", name = "raid_x" } },
    { action = "ConfigToVar", payload = { field = "map_height", name = "raid_rows" } },
    { action = "DecrementVar", payload = { name = "raid_rows", delta = 4 } },
    { action = "IncrementVar", payload = { name = "raid_index" } },
    { action = "RandomVar", payload = { name = "raid_y", min = 0, max = 1048575, index_var = "raid_index" } },
    { action = "ModuloVar", payload = { name = "raid_y", source_var = "raid_rows" } },
    { action = "IncrementVar", payload = { name = "raid_y", delta = 2 } },
    { action = "SetVar", payload = { name = "raid_type_seed", value = 1 } },
    { action = "RandomVar", payload = { name = "raid_type", min = 0, max = 1048575, seed_var = "raid_type_seed", index_var = "raid_index" } },
    { action = "ModuloVar", payload = { name = "raid_type", delta = 2 } },
    { action = "CopyVar", payload = { name = "raid_cave", source_var = "cave_art" } },
    { action = "MultiplyVar", payload = { name = "raid_cave", delta = 8 } },
    { action = "IncrementVar", payload = { name = "raid_type", source_var = "raid_cave" } },
    { action = "CopyVar", payload = { name = "raid_pair", source_var = "raid_rank" } },
    { action = "MultiplyVar", payload = { name = "raid_pair", delta = 2 } },
    { action = "IncrementVar", payload = { name = "raid_type", source_var = "raid_pair" } },
]
transitions = [
    { trigger = "Tick", target = "RaidWait", actions = [
        { action = "EmitEvent", event = "EventBehaviorSpawnRequest", payload_vars = { x = "raid_x", y = "raid_y" }, pick = { field = "program", var = "raid_type", from = [
            "scarab", "crawler", "crab", "hornet", "spider", "mantis", "beetle",
            "scorpion",
            "gremlin", "chomper", "imp", "slime", "ghost", "skull", "wraith", "demon",
            "hedgehog", "mouse", "frog", "hopper", "bat", "puffer", "owl", "lynx",
            "drone", "shard", "saucer", "trooper", "jelly", "squid", "djinn", "robot",
        ] } },
    ] },
]

# --- Ramp ---

# The raid climbs its cave's tier: three of the first rank shot down bring on the
# second, and so on to the fourth, whose third kill exhausts the tier. Each rank
# names its two types in every cave, in the order RaidSpawn's pick lists them.
[states.RaidRank1]
macro = "RaidRank"
rank = 0
next = "RaidRank2"
names = ["scarab", "crawler", "gremlin", "chomper", "hedgehog", "mouse", "drone", "shard"]

[states.RaidRank2]
macro = "RaidRank"
rank = 1
next = "RaidRank3"
names = ["crab", "hornet", "imp", "slime", "frog", "hopper", "saucer", "trooper"]

[states.RaidRank3]
macro = "RaidRank"
rank = 2
next = "RaidRank4"
names = ["spider", "mantis", "ghost", "skull", "bat", "puffer", "jelly", "squid"]

[states.RaidRank4]
macro = "RaidRank"
rank = 3
next = "RaidBoss"
names = ["beetle", "scorpion", "wraith", "demon", "owl", "lynx", "djinn", "robot"]


# The tier's end: a green strobe, the raid holds, the cave opens to no rock from
# past the right edge over its ramp, and the boss region brings on the Kraken. Once
# it is down the climb starts over at the first rank in the cave that follows, and
# the raid resumes with the rank already reset, whichever region runs first.
[states.RaidBoss]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventStrobeRequest", payload = { color = { r = 0, g = 255, b = 0 }, intensity = 1.0, duration_ms = 250 } },
    { action = "SetVar", payload = { name = "raid_boss", value = 1 } },
    { action = "EmitEvent", event = "EventCaveOpen", payload = { gap = 0 } },
    { action = "SpawnRegion", region = "boss", initial_state = "BossApproach" },
]
transitions = [
    { trigger = "Tick", target = "RaidRank1", guard = "VarCompare", guard_args = { var = "boss_down", op = "eq", value = 1 }, actions = [
        { action = "SetVar", payload = { name = "boss_down", value = 0 } },
        { action = "SetVar", payload = { name = "raid_boss", value = 0 } },
    ] },
]

# --- Boss ---

# The rock and the drift run at twice their pace while the opening comes in, easing
# up over a second, so it fills a 120-column map in about six seconds at the first
# pace. Filling it halts the scroll and the drift, easing over a second, and the
# Kraken rises at the right edge on the map's middle row, the request clamping its
# body inside the map.
[states.BossApproach]
parent = "Root"
on_enter = [
    { action = "CopyVar", payload = { name = "boss_pace", source_var = "cave_speed" } },
    { action = "MultiplyVar", payload = { name = "boss_pace", delta = 2 } },
    { action = "ClampVar", payload = { name = "boss_pace", min = 20, max = 200 } },
    { action = "EmitEvent", event = "EventCavePace", payload = { ease_ms = 1000 }, payload_vars = { speed = "boss_pace" } },
    { action = "EmitEvent", event = "EventDriftStart", payload = { direction = 3.141592653589793, speed = 160.0, duration_ms = 0, scenery = true, ease_ms = 1000 } },
]
transitions = [
    { trigger = "EventCaveOpened", target = "BossHalt" },
]

[states.BossHalt]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventCaveStop", payload = { ease_ms = 1000 } },
    { action = "EmitEvent", event = "EventDriftCancel", payload = { ease_ms = 1000 } },
]
transitions = [
    { trigger = "Tick", target = "BossSpawn", guard = "StateTimeExceeds", guard_args = { ms = 1000 } },
]

# Its 120 hit points are thirty seconds of the gun on it: one tracer lands a volley,
# four a second, whatever the lanes, as a hit's immunity window holds the rest. Its
# touch is the code's, as in main.
[states.BossSpawn]
parent = "Root"
on_enter = [
    { action = "ConfigToVar", payload = { field = "map_width", name = "boss_x" } },
    { action = "ConfigToVar", payload = { field = "map_height", name = "boss_y" } },
    { action = "DivideVar", payload = { name = "boss_y", delta = 2 } },
    { action = "EmitEvent", event = "EventKrakenSpawnRequest", payload = { hp = 120 }, payload_vars = { x = "boss_x", y = "boss_y" } },
]
transitions = [
    { trigger = "EventSpeciesCreated", target = "BossFight", guard = "PayloadSpeciesIn", guard_args = { field = "species", names = ["kraken"] } },
    { trigger = "EventKrakenSpawnFailed", target = "BossSpawnRetry" },
]

[states.BossSpawnRetry]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "BossSpawn", guard = "StateTimeExceeds", guard_args = { ms = 500 } },
]

[states.BossFight]
parent = "Root"
transitions = [
    { trigger = "EventSpeciesKilled", target = "BossDown", guard = "PayloadSpeciesIn", guard_args = { field = "species", names = ["kraken"] } },
    { trigger = "EventKrakenSpawnFailed", target = "BossSpawnRetry" },
]

# The Kraken down: species damage doubles, and every energy penalty with it, and
# the next cave comes in past the right edge behind its open mouth, in a stone art
# drawn from the three it is not, scrolling a fifth faster in whole columns a
# second (20, 24, 29, 35 and on to the cap of 200), its scroll and the drift easing
# in over a second; the ramp starts the climb over and lets the raid resume
[states.BossDown]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventCycleDamageMultiplierIncrease" },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "Species Damage Up" } },
    { action = "IncrementVar", payload = { name = "cave_index" } },
    { action = "RandomVar", payload = { name = "cave_seed", min = 1, max = 2147483647, index_var = "cave_index" } },
    { action = "SetVar", payload = { name = "cave_step_seed", value = 1 } },
    { action = "RandomVar", payload = { name = "cave_step", min = 1, max = 3, seed_var = "cave_step_seed", index_var = "cave_index" } },
    { action = "IncrementVar", payload = { name = "cave_art", source_var = "cave_step" } },
    { action = "ModuloVar", payload = { name = "cave_art", delta = 4 } },
    { action = "MultiplyVar", payload = { name = "cave_speed", delta = 12 } },
    { action = "IncrementVar", payload = { name = "cave_speed", delta = 5 } },
    { action = "DivideVar", payload = { name = "cave_speed", delta = 10 } },
    { action = "ClampVar", payload = { name = "cave_speed", min = 20, max = 200 } },
    { macro = "Cave" },
    { action = "EmitEvent", event = "EventCaveStop" },
    { action = "EmitEvent", event = "EventCavePace", payload = { ease_ms = 1000 }, payload_vars = { speed = "cave_speed" } },
    { action = "EmitEvent", event = "EventDriftStart", payload = { direction = 3.141592653589793, speed = 80.0, duration_ms = 0, scenery = true, ease_ms = 1000 } },
    { action = "SetVar", payload = { name = "boss_down", value = 1 } },
    { action = "TerminateRegion", region = "boss" },
]

# --- Player ---

[states.PlayerBoot]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventCursorSpawnRequest", payload = { center = true, heat = 10, energy = 100 } },
]
transitions = [
    { trigger = "EventCursorSpawned", target = "PlayerActive", capture_vars = { entity = "player_entity" } },
    { trigger = "EventCursorSpawnFailed", target = "PlayerBootRetry" },
]

[states.PlayerBootRetry]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "PlayerBoot", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

# The gun climbs a level a U: forward is right, the way the ship flies, and back is
# left. A level names the lanes, up to three, it fires along each cardinal, and a
# gun at the last stays there. An instance installing the game mid-run puts its own
# cursor on the path, with the level it carried. A crushed cursor is defeated, so
# the crush ends the game first, with its own message, and any other defeat after.
[states.PlayerActive]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventGunAimRequest", reconcile = true, payload = { path = [
        { right = 1 },                             # one shot forward
        { right = 2 },                             # two
        { right = 3 },                             # three
        { right = 3, up = 1, down = 1 },           # and one up and one down
        { right = 3, up = 1, down = 1, left = 1 }, # and one back
        { right = 3, up = 2, down = 2, left = 1 }, # two up and two down
        { right = 3, up = 2, down = 2, left = 2 }, # two back
        { right = 3, up = 3, down = 3, left = 2 }, # three up and three down
        { right = 3, up = 3, down = 3, left = 3 }, # three back
    ] } },
]
transitions = [
    { trigger = "EventCursorCrushed", target = "PlayerCrushed" },
    { trigger = "Tick", target = "PlayerDied", guard = "StatusBoolEquals", guard_args = { key = "session.any_defeated", value = true } },
]

# A lost game freezes the rock and the drift under a red strobe as long as main's,
# then starts over; the reset clears the status bar, so the new game opens with
# what ended the last
[states.PlayerDown]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventCaveStop" },
    { action = "EmitEvent", event = "EventDriftCancel" },
    { action = "EmitEvent", event = "EventStrobeRequest", payload = { color = { r = 255, g = 0, b = 0 }, intensity = 1.0, duration_ms = 250 } },
]

[states.PlayerCrushed]
parent = "PlayerDown"
transitions = [
    { trigger = "Tick", target = "PlayerCrushedReset", guard = "StateTimeExceeds", guard_args = { ms = 250 } },
]

[states.PlayerDied]
parent = "PlayerDown"
transitions = [
    { trigger = "Tick", target = "PlayerDiedReset", guard = "StateTimeExceeds", guard_args = { ms = 250 } },
]

[states.PlayerCrushedReset]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventGameResetRequest" },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "Crushed Against The Edge!" } },
]

[states.PlayerDiedReset]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventGameResetRequest" },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "You Died!" } },
]
