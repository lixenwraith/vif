description = "An arena with one warden, a species its behavior program defines."
min_players = 1
max_players = 16

# The sample of a data species: blank's arena, and a warden from
# behavior/warden.toml that comes back after each kill or lifetime.

# The warden spawns in a corner past its twelve-cell reach of the centred cursor,
# so it opens with a wind-up
[map]
min_width = 80
min_height = 30

[behaviors]
warden = { file = "behavior/warden.toml" }

[regions.main]
initial = "WardenWait"
disabled_systems = ["glyph","nugget","gold","audio","music"]

[regions.player]
initial = "PlayerBoot"
background = true

# --- Warden ---

[states.WardenWait]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "WardenSpawn", guard = "StateTimeExceeds", guard_args = { ms = 1000 } },
]

# A spawn that finds no room for the footprint creates nothing, so it retries
[states.WardenSpawn]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventBehaviorSpawnRequest", payload = { program = "warden", x = 10, y = 5 } },
]
transitions = [
    { trigger = "EventSpeciesCreated", target = "WardenLive", guard = "PayloadIntCompare", guard_args = { field = "species", op = "eq", value = 10 } },
    { trigger = "Tick", target = "WardenWait", guard = "StateTimeExceeds", guard_args = { ms = 1000 } },
]

# A kill also empties the count, so whichever arrives first, the kill ends in WardenDown
[states.WardenLive]
parent = "Root"
transitions = [
    { trigger = "EventSpeciesKilled", target = "WardenDown", guard = "PayloadIntCompare", guard_args = { field = "species", op = "eq", value = 10 } },
    { trigger = "Tick", target = "WardenGone", guard = "StatusIntCompare", guard_args = { key = "behavior.warden.count", op = "eq", value = 0 } },
]

[states.WardenGone]
parent = "Root"
transitions = [
    { trigger = "EventSpeciesKilled", target = "WardenDown", guard = "PayloadIntCompare", guard_args = { field = "species", op = "eq", value = 10 } },
    { trigger = "Tick", target = "WardenSpawn", guard = "StateTimeExceeds", guard_args = { ms = 1000 } },
]

[states.WardenDown]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "Warden down" } },
]
transitions = [
    { trigger = "Tick", target = "WardenSpawn", guard = "StateTimeExceeds", guard_args = { ms = 3000 } },
]

# --- Player ---

[states.PlayerBoot]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventCursorSpawnRequest", payload = { center = true, heat = 10, energy = 100 } },
]
transitions = [
    { trigger = "EventCursorSpawned", target = "PlayerActive", capture_vars = { entity = "player_entity" } },
    { trigger = "EventCursorSpawnFailed", target = "PlayerBootRetry" },
]

[states.PlayerBootRetry]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "PlayerBoot", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

[states.PlayerActive]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "PlayerReset", guard = "StatusBoolEquals", guard_args = { key = "session.any_defeated", value = true } },
]

[states.PlayerReset]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventGameResetRequest" },
]
