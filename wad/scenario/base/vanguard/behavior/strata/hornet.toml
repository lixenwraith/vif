# The hornet: its wings a blur over its sting. One of the strata's second-rank
# raiders: RaiderRank2 in ../../macros.toml gives its stats and cycle and the cave
# its colours.
macro = "RaiderRank2"
theme = "Strata"
width = 4
height = 3
header = { x = 1, y = 1 }
pattern_ms = 120

# Wings 2, head 0, eyes 1, sting 3
[[frames]]
glyphs = ["\\  /", "(oo)", " \\/ "]
fg     = ["2  2", "0110", " 33 "]
attr   = ["    ", " BB ", "    "]

[[frames]]
glyphs = ["-  -", "(oo)", " \\/ "]
fg     = ["2  2", "0110", " 33 "]
attr   = ["    ", " BB ", "    "]
