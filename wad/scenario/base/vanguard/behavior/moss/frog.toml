# The frog: its throat pulsing, it kicks. One of the moss cave's second-rank
# raiders: RaiderRank2 in ../../macros.toml gives its stats and cycle and the cave
# its colours.
macro = "RaiderRank2"
theme = "Moss"
width = 4
height = 3
header = { x = 1, y = 1 }
pattern_ms = 400

# Eyes 1, mouth 0, throat 3, legs 2
[[frames]]
glyphs = ["@..@", "(--)", "/  \\"]
fg     = ["1001", "0330", "2  2"]
attr   = ["B  B", "    ", "    "]

[[frames]]
glyphs = ["@..@", "(><)", "\\  /"]
fg     = ["1001", "0330", "2  2"]
attr   = ["B  B", "    ", "    "]
