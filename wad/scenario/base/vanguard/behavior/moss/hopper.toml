# The hopper: a cricket that springs on its long legs. One of the moss cave's
# second-rank raiders: RaiderRank2 in ../../macros.toml gives its stats and cycle
# and the cave its colours.
macro = "RaiderRank2"
theme = "Moss"
width = 4
height = 3
header = { x = 1, y = 1 }
pattern_ms = 300

# Head 0, eyes 1, legs 2
[[frames]]
glyphs = ["(oo)", "/||\\", "/  \\"]
fg     = ["0110", "2002", "2  2"]
attr   = [" BB ", "    ", "    "]

[[frames]]
glyphs = ["(oo)", "\\||/", " \\/ "]
fg     = ["0110", "2002", " 22 "]
attr   = [" BB ", "    ", "    "]
