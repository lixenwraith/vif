# Event bookkeeper: internal transitions only, never changes state
# Pylons are classed by spawn column: the ST pair stands on x = 250, flank pylons
# west or east of it

# Tower retargeting exploits anchor precedence in NavigationSystem.resolveGroupTargets:
# EventTargetGroupUpdate on a group whose anchor tower still lives is overwritten
# every tick (harmless); it sticks permanently the moment the anchor dies.
# Groups: 1=T1, 2=T2, 3=Q-TL, 4=Q-TR, 5=Q-BL, 6=Q-BR

[states.CntWatch]
parent = "Root"
transitions = [
    { trigger = "EventSpeciesKilled", internal = true, guard = "PayloadSpeciesIn", guard_args = { field = "species", names = ["pylon"] }, capture_vars = { x = "dead_x" }, actions = [
        { action = "IncrementVar", payload = { name = "st_dead" }, guard = "VarCompare", guard_args = { var = "dead_x", op = "eq", value = 250 } },
        { action = "IncrementVar", payload = { name = "l_dead" }, guard = "VarCompare", guard_args = { var = "dead_x", op = "lt", value = 250 } },
        { action = "IncrementVar", payload = { name = "r_dead" }, guard = "VarCompare", guard_args = { var = "dead_x", op = "gt", value = 250 } },
    ] },

    { trigger = "EventSpeciesKilled", internal = true, guard = "PayloadSpeciesIn", guard_args = { field = "species", names = ["tower"] }, capture_vars = { entity = "dead_tower" }, actions = [
        # Central death flags first: retarget guards below read them post-update
        { macro = "MarkFallen", each = { tower = ["t1", "t2"] } },

        { action = "EmitEvent", event = "EventNavigationRegraph", delay_ms = 100 },
        # A central tower fell: its group and its quadrants' groups go to the other one
        # (updates on live-anchor groups self-correct)
        { macro = "RetargetOnLoss", lost = "t1", to = "t2", each = { group = [1, 3, 4] } },
        { macro = "RetargetOnLoss", lost = "t2", to = "t1", each = { group = [2, 5, 6] } },

        { macro = "QuadrantLoss", quad = "q1", group = 3, near = "t1", far = "t2" },
        { macro = "QuadrantLoss", quad = "q2", group = 4, near = "t1", far = "t2" },
        { macro = "QuadrantLoss", quad = "q3", group = 5, near = "t2", far = "t1" },
        { macro = "QuadrantLoss", quad = "q4", group = 6, near = "t2", far = "t1" },
    ] },
]
