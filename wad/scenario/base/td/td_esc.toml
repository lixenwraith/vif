# P2 escalation, serialized both sides; twin pylons stacked VERTICALLY:
# top twin gateway → group 1 (T1), bottom twin gateway → group 2 (T2)
# P2 room: 17x27 at (60,125) / (440,125); pylons at y=118 / y=132 (13x7 footprint each)

[states.EscWait]
parent = "Root"
transitions = [
    { macro = "FlankReady", side = "l", target = "EscLSpawnA" },
    { macro = "FlankReady", side = "r", target = "EscRSpawnA" },
]

[states]
EscLSpawnA = { macro = "Pylon", x = 60, y = 118, attach = "EscLGwA", next = "EscLSpawnB" }
EscLGwA = { macro = "FlankGateway", side = "l", group = 1, next = "EscLSpawnB" }
EscLSpawnB = { macro = "Pylon", x = 60, y = 132, attach = "EscLGwB", next = "EscLDone" }
EscLGwB = { macro = "FlankGateway", side = "l", group = 2, next = "EscLDone" }
EscLDone = { macro = "FlankDone", side = "l", message = "West Flank Reinforced", next = "EscWait" }

# Right twins mirror the left
EscRSpawnA = { macro = "Pylon", x = 440, y = 118, attach = "EscRGwA", next = "EscRSpawnB" }
EscRGwA = { macro = "FlankGateway", side = "r", group = 1, next = "EscRSpawnB" }
EscRSpawnB = { macro = "Pylon", x = 440, y = 132, attach = "EscRGwB", next = "EscRDone" }
EscRGwB = { macro = "FlankGateway", side = "r", group = 2, next = "EscRDone" }
EscRDone = { macro = "FlankDone", side = "r", message = "East Flank Reinforced", next = "EscWait" }
