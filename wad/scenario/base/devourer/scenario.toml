description = "Scratch: the Devourer creeps in from the edges; cut its guts and wear it down."
min_players = 1
max_players = 16

# A scratch arena for the Devourer: blank's scaffold with text and nuggets, gold and
# decay off. It rises a second into the game and again a few seconds after each kill.
# Nothing here arms the cursor: :god arms every weapon, :w <weapon> <charges> one.

[regions.main]
initial = "MainBoot"
disabled_systems = ["gold", "audio", "music"]

# A scaffold with no cursor is a scaffold nobody can stand in, and a session that
# switched to one would leave every participant without a player domain.
[regions.player]
initial = "PlayerBoot"
background = true

# Boot: settled before the clock starts, drawn behind the start prompt; the game
# begins at the first Tick, after the press
[states.MainBoot]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "MainStart" },
]

[states.MainStart]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "DevourerSpawn", guard = "StateTimeExceeds", guard_args = { ms = 1000 } },
]

[states.DevourerSpawn]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventDevourerSpawnRequest" },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "The Devourer Wakes" } },
]
transitions = [
    { trigger = "EventSpeciesCreated", target = "DevourerActive", guard = "PayloadSpeciesIn", guard_args = { field = "species", names = ["devourer"] } },
    { trigger = "EventDevourerSpawnFailed", target = "DevourerRest" },
]

[states.DevourerActive]
parent = "Root"
transitions = [
    { trigger = "EventSpeciesKilled", target = "DevourerRest", guard = "PayloadSpeciesIn", guard_args = { field = "species", names = ["devourer"] } },
]

# Its recede and its drops play out before the next rises
[states.DevourerRest]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "DevourerSpawn", guard = "StateTimeExceeds", guard_args = { ms = 6000 } },
]

# --- Player ---

[states.PlayerBoot]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventCursorSpawnRequest", origin = "center", payload = { heat = 10, energy = 100 } },
]
transitions = [
    { trigger = "EventCursorSpawned", target = "PlayerActive", capture_vars = { entity = "player_entity" } },
    { trigger = "EventCursorSpawnFailed", target = "PlayerBootRetry" },
]

[states.PlayerBootRetry]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "PlayerBoot", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

[states.PlayerActive]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "PlayerReset", guard = "StatusBoolEquals", guard_args = { key = "session.any_defeated", value = true } },
]

[states.PlayerReset]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventGameResetRequest" },
]
