description = "Tutorial: the game and its vi-style moving, typing and editing, a lesson at a time, with combat off."
min_players = 1
max_players = 1

# Each lesson lays its heading in the small splash face, a few lines that explain
# and a practice line or block the cursor is stood on, then waits for the result
# and clears itself; s skips a lesson and S goes back one. The keys a game reads
# its own way are vi's here, and the last lesson says what a game makes of them.
# Free practice turns the glyph spawner on, which types this scenario's corpus.

# The view an 80 by 24 terminal shows, below the top row and above the status
# rows: no lesson there scrolls, so G leaves the next heading in sight
[map]
min_width = 79
min_height = 20

# The corpus is code, laid in blocks, so % finds its pair
[content]
files = ["lessons.toml"]
blocks = true

# No particle system: Space, a game's special fire that auto fire presses too, would
# turn the practice code's dark glyphs to dust
[systems]
only_systems = ["cursor", "typing", "timer", "death", "transient", "audio", "energy", "heat", "splash", "flash", "fadeout"]

# With no gun to cycle, no clock to stop and no fight to find a column in, the keys
# a game reads its own way are vi's here, and y, which a game leaves unbound, yanks;
# the backtick stays the console's
[keymap.normal]
a = "mode_append"
p = "put_after"
P = "put_before"
o = "mode_open_below"
O = "mode_open_above"
u = "undo_change"
m = "mark_set"
y = "operator_yank"

[keymap.normal_keys]
ctrl_r = "redo_change"

[regions.tutorial]
initial = "Wait"

[regions.player]
initial = "PlayerBoot"
background = true

# Spawned by Free and by Visual: a region's systems, unlike an action's toggle, an
# install re-derives, so a player who joins or reloads there runs them
[regions.practice]
background = true
enabled_systems = ["glyph"]

[regions.reach]
background = true
enabled_systems = ["shield"]

# --- Macros ---

[macros.Say]
doc = "Status line `message`, within the line's 62 columns of an 80 column screen: what the lesson waits on, held under every other message and the start prompt till the next."
params = { message = "string" }
body = { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "${message}", kind = "goal" }, reconcile = true }

[macros.Heading]
doc = "Write `text` in the small face at the top left, in the lesson's gold."
params = { text = "string" }
body = { action = "EmitEvent", event = "EventSplashTextRequest", payload = { text = "${text}", font = "small", color = { r = 255, g = 200, b = 0 }, origin_x = 4, origin_y = 1 }, reconcile = true }

[macros.Note]
doc = "Lay `text` at row `row` as scenery: part of the lesson, which nothing types or deletes, in 62 columns at most so the magnifier has the map's right. A key it names stands between two | and is laid bright."
params = { text = "string", row = "int" }
body = { action = "EmitEvent", event = "EventGlyphLineRequest", payload = { text = "${text}", x = 4, y = "${row}", type = "white", level = "normal", scenery = true, accent = "|" }, reconcile = true }

[macros.Line]
doc = "Lay the practice line `text` at row `row`, typeable; the glyphs a step asks for stand between two | and are laid bright white."
params = { text = "string", row = "int" }
body = { action = "EmitEvent", event = "EventGlyphLineRequest", payload = { text = "${text}", x = 4, y = "${row}", type = "blue", level = "bright", accent = "|" }, reconcile = true }

[macros.Label]
doc = "Lay `text` from column `x` of row `row` as scenery beside the practice lines: what a step does there."
params = { text = "string", x = "int", row = "int" }
body = { action = "EmitEvent", event = "EventGlyphLineRequest", payload = { text = "${text}", x = "${x}", y = "${row}", type = "white", level = "normal", scenery = true, accent = "|" }, reconcile = true }

[macros.Stand]
doc = "Stand the cursor on `x`, `y` in Normal mode, a tick on: after the move the key that ended the last lesson made."
params = { x = "int", y = "int" }
body = [
    { action = "EmitEvent", event = "EventCursorMoveRequest", payload = { entity = 0, x = "${x}", y = "${y}" }, payload_vars = { entity = "player_entity" }, delay_ms = 1 },
    { action = "EmitEvent", event = "EventModeRequest", payload = { mode = "normal" } },
]

[macros.Mark]
doc = "Lay a bright x at `x`, `y`, typeable, as the cell a lesson ends on: w, e and $ reach it as a word."
params = { x = "int", y = "int" }
body = { action = "EmitEvent", event = "EventGlyphLineRequest", payload = { text = "x", x = "${x}", y = "${y}", type = "white", level = "bright" }, reconcile = true }

[macros.Clear]
doc = "End the lesson: every glyph gone and the heading blanked, under a white flash."
params = {}
body = [
    { action = "EmitEvent", event = "EventGlyphClearRequest", reconcile = true },
    { action = "EmitEvent", event = "EventSplashTextRequest", payload = { text = "", origin_x = 4, origin_y = 1 }, reconcile = true },
    { action = "EmitEvent", event = "EventStrobeRequest", payload = { color = { r = 255, g = 255, b = 255 }, intensity = 0.3, duration_ms = 150 } },
]

[macros.Bottom]
doc = "Read the map's bottom row into `bottom`, each tick, so a lesson ending there follows a resize."
params = {}
body = [
    { action = "ConfigToVar", payload = { field = "map_height", name = "bottom" } },
    { action = "DecrementVar", payload = { name = "bottom" } },
]

[macros.Reached]
doc = "Go to `target` once the cursor stands on `x`, `y`."
params = { target = "string", x = "int", y = "int" }
body = { trigger = "EventCursorMoved", target = "${target}", guard = "And", guard_args = { guards = [
    { name = "PayloadIntCompare", args = { field = "x", op = "eq", value = "${x}" } },
    { name = "PayloadIntCompare", args = { field = "y", op = "eq", value = "${y}" } },
] } }

[macros.Next]
doc = "Take s, in Normal and Visual with nothing pending, as the skip to `target`."
params = { target = "string" }
body = { trigger = "EventInputPressed", target = "${target}", guard = "PayloadStringEquals", guard_args = { field = "key", value = "s" } }

[macros.Back]
doc = "Take S as the step back to `target`."
params = { target = "string" }
body = { trigger = "EventInputPressed", target = "${target}", guard = "PayloadStringEquals", guard_args = { field = "key", value = "S" } }

[macros.Deleted]
doc = "Go to `target` once a delete of `range` (0 a span, 1 a line) starts on row `y`."
params = { target = "string", range = "int", y = "int" }
body = { trigger = "EventDeleteRequest", target = "${target}", guard = "And", guard_args = { guards = [
    { name = "PayloadIntCompare", args = { field = "range_type", op = "eq", value = "${range}" } },
    { name = "PayloadIntCompare", args = { field = "start_y", op = "eq", value = "${y}" } },
] } }

[macros.Span]
doc = "Go to `target` once a delete of a span on row `y` ends on a column from `from` to `to`."
params = { target = "string", y = "int", from = "int", to = "int" }
body = { trigger = "EventDeleteRequest", target = "${target}", guard = "And", guard_args = { guards = [
    { name = "PayloadIntCompare", args = { field = "range_type", op = "eq", value = 0 } },
    { name = "PayloadIntCompare", args = { field = "start_y", op = "eq", value = "${y}" } },
    { name = "PayloadIntCompare", args = { field = "end_x", op = "gte", value = "${from}" } },
    { name = "PayloadIntCompare", args = { field = "end_x", op = "lte", value = "${to}" } },
] } }

[macros.Typed]
doc = "Go to `target` once the glyph with code `char` is typed at `x`, `y`."
params = { target = "string", char = "int", x = "int", y = "int" }
body = { trigger = "EventCharacterTyped", target = "${target}", guard = "And", guard_args = { guards = [
    { name = "PayloadIntCompare", args = { field = "char", op = "eq", value = "${char}" } },
    { name = "PayloadIntCompare", args = { field = "x", op = "eq", value = "${x}" } },
    { name = "PayloadIntCompare", args = { field = "y", op = "eq", value = "${y}" } },
] } }

[macros.Gone]
doc = "Go to `target` once a delete of any shape takes the cell at `x`, `y`: a glyph a lesson waits to see typed, gone another way."
params = { target = "string", x = "int", y = "int" }
body = { trigger = "EventDeleteRequest", target = "${target}", guard = "PayloadCovers", guard_args = { x = "${x}", y = "${y}" } }

[macros.Retyped]
doc = "Go to `target` once the glyphs of row 14 from column `x` are retyped as `text`."
params = { target = "string", x = "int", text = "string" }
body = { trigger = "EventGlyphReplaceRequest", target = "${target}", guard = "And", guard_args = { guards = [
    { name = "PayloadIntCompare", args = { field = "y", op = "eq", value = 14 } },
    { name = "PayloadIntCompare", args = { field = "x", op = "eq", value = "${x}" } },
    { name = "PayloadStringEquals", args = { field = "text", value = "${text}" } },
] } }

[macros.Normal]
doc = "Go to `target` once the mode is normal again."
params = { target = "string" }
body = { trigger = "EventModeChanged", target = "${target}", guard = "PayloadIntCompare", guard_args = { field = "mode", op = "eq", value = 0 } }

# --- Tutorial ---

# The lessons wait for the cursor; the glyph spawner stays off until free practice,
# so no corpus line lands on a lesson
[states.Wait]
parent = "Root"
transitions = [
    { trigger = "EventCursorSpawned", target = "Move" },
]

# s skips any lesson and S goes back one. Each lesson clears itself as it exits: a
# parent's exit runs only once the last lesson leaves.
[states.Lesson]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventKeyCaptureRequest", payload = { keys = "sS", modes = ["normal", "visual"], idle = true }, reconcile = true },
]
on_exit = [
    { action = "EmitEvent", event = "EventKeyCaptureRequest", payload = { keys = "" }, reconcile = true },
]

[states.Move]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "h j k l" },
    { macro = "Note", text = "|h| moves the cursor left and |l| right; |j| down and |k| up.", row = 8 },
    { macro = "Note", text = "The arrow keys move the same way; page up and page down", row = 9 },
    { macro = "Note", text = "leap half a screen.", row = 10 },
    { macro = "Note", text = "A lesson ends at its goal; |s| skips one and |S| goes back.", row = 11 },
    { macro = "Note", text = "Stand on the bright x at the end of the third line.", row = 12 },
    { macro = "Line", text = "start on this line", row = 14 },
    { macro = "Line", text = "move down two rows", row = 15 },
    { macro = "Line", text = "and right to the", row = 16 },
    { macro = "Mark", x = 21, y = 16 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 1 of 22: move onto the x with h j k l" },
]
transitions = [
    { macro = "Reached", target = "Words", x = 21, y = 16 },
    { macro = "Next", target = "Words" },
]

[states.Words]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "w b e" },
    { macro = "Note", text = "|w| jumps to the start of the next word, |b| of the one before.", row = 8 },
    { macro = "Note", text = "|e| lands on a word's last glyph. Punctuation is a word too;", row = 9 },
    { macro = "Note", text = "|W| |B| |E| take all up to a space as one word.", row = 10 },
    { macro = "Note", text = "Reach the start of dog, the last word of the line.", row = 11 },
    { macro = "Line", text = "the quick.brown fox, jumping over the lazy-|d|og!", row = 14 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 2 of 22: reach dog with w, b and e" },
]
transitions = [
    { macro = "Reached", target = "Line", x = 47, y = 14 },
    { macro = "Next", target = "Line" },
    { macro = "Back", target = "Move" },
]

[states.Line]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "0 ^ $" },
    { macro = "Note", text = "|0| jumps to the first cell of the line, |$| to its last glyph.", row = 8 },
    { macro = "Note", text = "|^| finds the first glyph after the indent.", row = 9 },
    { macro = "Note", text = "Home and end work like |0| and |$|.", row = 10 },
    { macro = "Note", text = "Go to the period at the line's end, then back to its start.", row = 11 },
    { macro = "Line", text = "    |a|n indented line ends with a period|.|", row = 14 },
    { macro = "Stand", x = 8, y = 14 },
    { macro = "Say", message = "Lesson 3 of 22: $ to the period, then ^ to the first glyph" },
]
transitions = [
    { macro = "Reached", target = "LineBack", x = 43, y = 14 },
    { macro = "Next", target = "Find" },
    { macro = "Back", target = "Words" },
]

[states.LineBack]
parent = "Line"
on_enter = [
    { macro = "Say", message = "Now ^ to the first glyph" },
]
transitions = [
    { macro = "Reached", target = "Find", x = 8, y = 14 },
]

[states.Find]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "f t ; ," },
    { macro = "Note", text = "|f| and a glyph jump to its next one on the line;", row = 8 },
    { macro = "Note", text = "|t| stops just before it. |F| and |T| look backward.", row = 9 },
    { macro = "Note", text = "|;| repeats the last find and |,| reverses it.", row = 10 },
    { macro = "Note", text = "Hop from x to x: |fx| finds the first, |;| each one after.", row = 11 },
    { macro = "Line", text = "hop x from x here x to x the last |x|", row = 14 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 4 of 22: reach the last x with fx and ;" },
]
transitions = [
    { macro = "Reached", target = "Count", x = 38, y = 14 },
    { macro = "Next", target = "Count" },
    { macro = "Back", target = "Line" },
]

[states.Count]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "3w 2j" },
    { macro = "Note", text = "A count before a motion repeats it: |3w| is three words,", row = 8 },
    { macro = "Note", text = "|2j| two rows down. Counts work with every motion,", row = 9 },
    { macro = "Note", text = "|5l| |4h| |2k|, and with |x| and |dd| as well.", row = 10 },
    { macro = "Note", text = "Reach five in as few keys as you can.", row = 11 },
    { macro = "Line", text = "one two three four", row = 14 },
    { macro = "Line", text = "nine ten |f|ive six", row = 15 },
    { macro = "Line", text = "seven eight twelve", row = 16 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 5 of 22: j then 2w lands on five" },
]
transitions = [
    { macro = "Reached", target = "DeleteChar", x = 13, y = 15 },
    { macro = "Next", target = "DeleteChar" },
    { macro = "Back", target = "Find" },
]

[states.DeleteChar]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "x dd" },
    { macro = "Note", text = "|x| deletes the glyph under the cursor, |X| the one left of it.", row = 8 },
    { macro = "Note", text = "A count deletes that many: |3x|.", row = 9 },
    { macro = "Note", text = "|dd| deletes the whole line, |2dd| two of them.", row = 10 },
    { macro = "Note", text = "First |x| on the bright x, then |dd| on the third line.", row = 11 },
    { macro = "Line", text = "|x| marks this glyph", row = 14 },
    { macro = "Line", text = "keep this line", row = 15 },
    { macro = "Line", text = "|delete this whole line|", row = 16 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 6 of 22: x on the x, then dd on the third line" },
]
transitions = [
    { macro = "Deleted", target = "DeleteLine", range = 0, y = 14 },
    { macro = "Next", target = "DeleteMotion" },
    { macro = "Back", target = "Count" },
]

[states.DeleteLine]
parent = "DeleteChar"
on_enter = [
    { macro = "Say", message = "Now move down two rows and delete that line with dd" },
]
transitions = [
    { macro = "Deleted", target = "DeleteMotion", range = 1, y = 16 },
]

[states.DeleteMotion]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "dw D" },
    { macro = "Note", text = "|d| waits for a motion and deletes as far as it goes:", row = 8 },
    { macro = "Note", text = "|dw| a word, |de| to its end, |d3w| three words, |dfx| to the", row = 9 },
    { macro = "Note", text = "next x, |dj| this row and the next. |D| cuts to the line's end.", row = 10 },
    { macro = "Note", text = "Delete the first word with |dw|, then |D| from the x on.", row = 11 },
    { macro = "Line", text = "|remove| this word, then cut from the |x| on", row = 14 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 7 of 22: dw on the first word, then D on the x" },
]
transitions = [
    { macro = "Span", target = "DeleteRest", y = 14, from = 9, to = 15 },
    { macro = "Next", target = "Insert" },
    { macro = "Back", target = "DeleteChar" },
]

[states.DeleteRest]
parent = "DeleteMotion"
on_enter = [
    { macro = "Say", message = "Now fx to the x, and D cuts the rest" },
]
transitions = [
    { macro = "Span", target = "Insert", y = 14, from = 43, to = 43 },
]

[states.Insert]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "i esc" },
    { macro = "Note", text = "|i| enters insert mode at the cursor; |esc| returns to normal.", row = 8 },
    { macro = "Note", text = "In insert mode, type the glyph under the cursor to clear it.", row = 9 },
    { macro = "Note", text = "A match feeds the heat and the boost; a miss burns ten heat.", row = 10 },
    { macro = "Note", text = "Type both lines: |esc|, |j|, |^| and |i| reach the second one.", row = 11 },
    { macro = "Note", text = "In normal mode |esc| opens the menu; |esc| again closes it.", row = 12 },
    { macro = "Line", text = "type me", row = 14 },
    { macro = "Line", text = "then me", row = 15 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 8 of 22: i, then type both lines" },
]
transitions = [
    { macro = "Typed", target = "InsertEsc", char = 101, x = 10, y = 15 },
    { macro = "Gone", target = "Append", x = 10, y = 15 },
    { macro = "Next", target = "Append" },
    { macro = "Back", target = "DeleteMotion" },
]

# A lesson that ends on a typed glyph waits for the esc that ends typing, which would
# open the menu over the next lesson
[states.InsertEsc]
parent = "Insert"
on_enter = [
    { macro = "Say", message = "Both lines typed: esc returns to normal mode to go on" },
]
transitions = [
    { macro = "Normal", target = "Append" },
]

[states.Append]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "A I a" },
    { macro = "Note", text = "|A| jumps to the line's last glyph and enters insert mode.", row = 8 },
    { macro = "Note", text = "|I| does the same at its first glyph.", row = 9 },
    { macro = "Note", text = "|a| steps one cell right, then inserts; |i| inserts in place.", row = 10 },
    { macro = "Note", text = "In a game |a| cycles auto fire: here it is vi's again.", row = 11 },
    { macro = "Note", text = "Type the bright glyph each key lands on, then |esc|.", row = 12 },
    { macro = "Line", text = "jump to the en|d|", row = 14 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 9 of 22: A, then type the bright d" },
]
transitions = [
    { macro = "Typed", target = "AppendEnd", char = 100, x = 18, y = 14 },
    { macro = "Gone", target = "AppendFirst", x = 18, y = 14 },
    { macro = "Next", target = "Open" },
    { macro = "Back", target = "Insert" },
]

# A step that ends on a typed glyph waits for the esc that ends typing, which would
# open the menu over the step after it; each step lays its own line and stands the
# cursor, so none is done before its turn
[states.AppendEnd]
parent = "Append"
on_enter = [
    { macro = "Say", message = "esc returns to normal mode" },
]
transitions = [
    { macro = "Normal", target = "AppendFirst" },
]

[states.AppendFirst]
parent = "Append"
on_enter = [
    { macro = "Line", text = "|f|irst glyph of the line", row = 15 },
    { macro = "Stand", x = 16, y = 15 },
    { macro = "Say", message = "Now I, then type the bright f" },
]
transitions = [
    { macro = "Typed", target = "AppendFirstEnd", char = 102, x = 4, y = 15 },
    { macro = "Gone", target = "AppendStep", x = 4, y = 15 },
]

[states.AppendFirstEnd]
parent = "Append"
on_enter = [
    { macro = "Say", message = "esc returns to normal mode" },
]
transitions = [
    { macro = "Normal", target = "AppendStep" },
]

[states.AppendStep]
parent = "Append"
on_enter = [
    { macro = "Line", text = "g|o| on", row = 16 },
    { macro = "Stand", x = 4, y = 16 },
    { macro = "Say", message = "Now a, then type the bright o" },
]
transitions = [
    { macro = "Typed", target = "AppendEsc", char = 111, x = 5, y = 16 },
    { macro = "Gone", target = "Open", x = 5, y = 16 },
]

[states.AppendEsc]
parent = "Append"
on_enter = [
    { macro = "Say", message = "esc returns to normal mode" },
]
transitions = [
    { macro = "Normal", target = "Open" },
]

[states.Open]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "o O" },
    { macro = "Note", text = "|o| moves to the first glyph of the row below and inserts.", row = 8 },
    { macro = "Note", text = "|O| does the same on the row above.", row = 9 },
    { macro = "Note", text = "vi opens a new line there; vif types what the row holds.", row = 10 },
    { macro = "Note", text = "In a game |o| and |O| find the next glyph in the column.", row = 11 },
    { macro = "Note", text = "Type the bright glyph each key lands on, then |esc|.", row = 12 },
    { macro = "Label", text = "start here: |o| goes a row down and |O| a row up", x = 4, row = 15 },
    { macro = "Line", text = "|b|elow", row = 16 },
    { macro = "Stand", x = 4, y = 15 },
    { macro = "Say", message = "Lesson 10 of 22: o, then type the bright b" },
]
transitions = [
    { macro = "Typed", target = "OpenEnd", char = 98, x = 4, y = 16 },
    { macro = "Gone", target = "OpenAbove", x = 4, y = 16 },
    { macro = "Next", target = "Change" },
    { macro = "Back", target = "Append" },
]

[states.OpenEnd]
parent = "Open"
on_enter = [
    { macro = "Say", message = "esc returns to normal mode" },
]
transitions = [
    { macro = "Normal", target = "OpenAbove" },
]

[states.OpenAbove]
parent = "Open"
on_enter = [
    { macro = "Line", text = "|a|bove", row = 14 },
    { macro = "Stand", x = 4, y = 15 },
    { macro = "Say", message = "Now O, then type the bright a" },
]
transitions = [
    { macro = "Typed", target = "OpenEsc", char = 97, x = 4, y = 14 },
    { macro = "Gone", target = "Change", x = 4, y = 14 },
]

[states.OpenEsc]
parent = "Open"
on_enter = [
    { macro = "Say", message = "esc returns to normal mode" },
]
transitions = [
    { macro = "Normal", target = "Change" },
]

[states.Change]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "c cc C" },
    { macro = "Note", text = "|c| deletes as |d| does and leaves you in insert mode:", row = 8 },
    { macro = "Note", text = "|cw| a word, |c$| the rest. |cc| clears the line, |C| its rest.", row = 9 },
    { macro = "Note", text = "In a game |s| is |cl| and |S| is |cc|; here they skip and go back.", row = 10 },
    { macro = "Note", text = "Change the first word with |cw|, |esc|, then |cc| on line two.", row = 11 },
    { macro = "Line", text = "|wrong| word here", row = 14 },
    { macro = "Line", text = "|clear this whole line|", row = 15 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 11 of 22: cw on the first word" },
]
transitions = [
    { macro = "Span", target = "ChangeLine", y = 14, from = 8, to = 9 },
    { macro = "Next", target = "Replace" },
    { macro = "Back", target = "Open" },
]

# The deletes go on whether c or d made them: d leaves normal mode, where esc opens
# the menu, so no step here waits for esc
[states.ChangeLine]
parent = "Change"
on_enter = [
    { macro = "Say", message = "Esc if c left you in insert mode; then j and cc on line two" },
]
transitions = [
    { macro = "Deleted", target = "Replace", range = 1, y = 15 },
]

[states.Replace]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "r ~" },
    { macro = "Note", text = "|r| and a glyph retype the one under the cursor:", row = 8 },
    { macro = "Note", text = "no insert mode, no score. A count retypes that many: |3rx|.", row = 9 },
    { macro = "Note", text = "|~| flips a letter's case and moves on.", row = 10 },
    { macro = "Note", text = "Fix the z with |rs|, then quieten SHOUT with |5~|.", row = 11 },
    { macro = "Line", text = "thi|z| line has a |SHOUT| in it", row = 14 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 12 of 22: fz to the z, then rs" },
]
transitions = [
    { macro = "Retyped", target = "ReplaceCase", x = 7, text = "s" },
    { macro = "Next", target = "Repeat" },
    { macro = "Back", target = "Change" },
]

[states.ReplaceCase]
parent = "Replace"
on_enter = [
    { macro = "Say", message = "Now fS to SHOUT, and 5~ flips its case" },
]
transitions = [
    { macro = "Retyped", target = "Repeat", x = 20, text = "shout" },
    { macro = "Retyped", target = "Repeat", x = 24, text = "t" },
]

[states.Repeat]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "." },
    { macro = "Note", text = "|.| repeats the last change: a delete, a change, a retype,", row = 8 },
    { macro = "Note", text = "a put, or what insert mode typed after |i| |I| |a| |A| |o| |O| |c|.", row = 9 },
    { macro = "Note", text = "A count before it replaces the change's own: |2.| after |dw|.", row = 10 },
    { macro = "Note", text = "Delete the bright word with |dw|; |j| and |.| then does it again.", row = 11 },
    { macro = "Line", text = "|junk| keep this", row = 14 },
    { macro = "Line", text = "|junk| and this", row = 15 },
    { macro = "Line", text = "|junk| and this too", row = 16 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 13 of 22: dw deletes the bright word" },
]
transitions = [
    { macro = "Gone", target = "Yank", x = 4, y = 16 },
    { macro = "Gone", target = "RepeatDot", x = 4, y = 14 },
    { macro = "Next", target = "Yank" },
    { macro = "Back", target = "Replace" },
]

[states.RepeatDot]
parent = "Repeat"
on_enter = [
    { macro = "Say", message = "Now j and . repeats the delete, on each line below" },
]
transitions = [
    { macro = "Gone", target = "Yank", x = 4, y = 16 },
]

[states.Yank]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "y p P" },
    { macro = "Note", text = "|y| and a motion yank into the register: |yw| a word, |yy| a line.", row = 8 },
    { macro = "Note", text = "|p| puts it after the cursor and |P| before it;", row = 9 },
    { macro = "Note", text = "a line goes on the row below or above.", row = 10 },
    { macro = "Note", text = "A put passes over a cell that holds a glyph, and every delete", row = 11 },
    { macro = "Note", text = "yanks too. In a game |p| pauses and |y| does nothing.", row = 12 },
    { macro = "Line", text = "copy this line", row = 14 },
    { macro = "Label", text = "<- |p| puts the copy on this row", x = 24, row = 15 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 14 of 22: yy yanks this line, then p puts it below" },
]
transitions = [
    { trigger = "EventGlyphPutRequest", target = "YankDelete" },
    { macro = "Next", target = "Undo" },
    { macro = "Back", target = "Repeat" },
]

[states.YankDelete]
parent = "Yank"
on_enter = [
    { macro = "Say", message = "A delete yanks too: dd on the line you stand on" },
]
transitions = [
    { trigger = "EventDeleteRequest", target = "YankPut", guard = "PayloadIntCompare", guard_args = { field = "range_type", op = "eq", value = 1 } },
]

[states.YankPut]
parent = "Yank"
on_enter = [
    { macro = "Say", message = "Now p puts it back on the row below, or P on the row above" },
]
transitions = [
    { trigger = "EventGlyphPutRequest", target = "Undo" },
]

[states.Undo]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "u ctrl-r" },
    { macro = "Note", text = "|u| takes back the last change: a delete, a retype or a put.", row = 8 },
    { macro = "Note", text = "|ctrl-r| makes it again.", row = 9 },
    { macro = "Note", text = "A change is forgotten once its cells change.", row = 10 },
    { macro = "Note", text = "In a game |u| undoes a cursor move: here it is vi's again.", row = 11 },
    { macro = "Note", text = "Delete the line with |dd|, bring it back with |u|, then |ctrl-r|.", row = 12 },
    { macro = "Line", text = "delete me, then undo", row = 14 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 15 of 22: dd, then u" },
]
transitions = [
    { macro = "Deleted", target = "UndoBack", range = 1, y = 14 },
    { macro = "Next", target = "Bracket" },
    { macro = "Back", target = "Yank" },
]

[states.UndoBack]
parent = "Undo"
on_enter = [
    { macro = "Say", message = "u brings the line back" },
]
transitions = [
    { trigger = "EventGlyphPutRequest", target = "UndoAgain" },
]

[states.UndoAgain]
parent = "Undo"
on_enter = [
    { macro = "Say", message = "ctrl-r makes the delete again, or . repeats it" },
]
transitions = [
    { trigger = "EventDeleteRequest", target = "Bracket" },
]

[states.Bracket]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "% { }" },
    { macro = "Note", text = "|%| jumps between a bracket and its pair,", row = 8 },
    { macro = "Note", text = "( ) [ ] or { }, across lines too.", row = 9 },
    { macro = "Note", text = "|{| and |}| hop to the empty row before and after a block.", row = 10 },
    { macro = "Note", text = "From the opening brace, jump to the closing one.", row = 11 },
    { macro = "Line", text = "func main() {", row = 14 },
    { macro = "Line", text = "    run()", row = 15 },
    { macro = "Line", text = "|}|", row = 16 },
    { macro = "Stand", x = 16, y = 14 },
    { macro = "Say", message = "Lesson 16 of 22: % from the opening brace" },
]
transitions = [
    { macro = "Reached", target = "Search", x = 4, y = 16 },
    { macro = "Next", target = "Search" },
    { macro = "Back", target = "Undo" },
]

[states.Search]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "/ n N" },
    { macro = "Note", text = "|/| opens a search: type a word and press enter", row = 8 },
    { macro = "Note", text = "to jump to its first match.", row = 9 },
    { macro = "Note", text = "|n| walks to the next match and |N| back; the search wraps.", row = 10 },
    { macro = "Note", text = "Search for needle, then |n| to the second one.", row = 11 },
    { macro = "Line", text = "a haystack hides a needle", row = 14 },
    { macro = "Line", text = "and another |n|eedle here", row = 15 },
    { macro = "Line", text = "the search wraps around", row = 16 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 17 of 22: /needle, enter, then n" },
]
transitions = [
    { macro = "Reached", target = "Star", x = 16, y = 15 },
    { macro = "Next", target = "Star" },
    { macro = "Back", target = "Bracket" },
]

[states.Star]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "* #" },
    { macro = "Note", text = "|*| searches forward for the word under the cursor, |#| back.", row = 8 },
    { macro = "Note", text = "Only whole words match, so the in of within is passed over.", row = 9 },
    { macro = "Note", text = "|n| and |N| repeat it; |2*| is the second match on.", row = 10 },
    { macro = "Note", text = "From the first in, |*| twice for the last one, then |#| back.", row = 11 },
    { macro = "Line", text = "in the room", row = 14 },
    { macro = "Line", text = "within reach, not |i|n sight", row = 15 },
    { macro = "Line", text = "an inn is |i|n town", row = 16 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 18 of 22: * twice, to the last in" },
]
transitions = [
    { macro = "Reached", target = "StarBack", x = 14, y = 16 },
    { macro = "Next", target = "Marks" },
    { macro = "Back", target = "Search" },
]

[states.StarBack]
parent = "Star"
on_enter = [
    { macro = "Say", message = "Now # steps back to the one before" },
]
transitions = [
    { macro = "Reached", target = "Marks", x = 22, y = 15 },
]

[states.Marks]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_update = [{ macro = "Bottom" }]
on_enter = [
    { macro = "Heading", text = "m '" },
    { macro = "Note", text = "|m| and a letter mark the cursor's cell;", row = 8 },
    { macro = "Note", text = "|'| and the letter return to the first glyph of its row.", row = 9 },
    { macro = "Note", text = "|d'a| deletes every row to it. In vim ` returns to the cell", row = 10 },
    { macro = "Note", text = "itself; here ` is the console's key, and |m| is vi's again.", row = 11 },
    { macro = "Note", text = "Press |ma| here, |G| for the bottom row, then |'a| to come back.", row = 12 },
    { macro = "Line", text = "mark this line with ma", row = 14 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 19 of 22: ma, then G to the bottom row" },
]
transitions = [
    { trigger = "EventCursorMoved", target = "MarksBack", guard = "PayloadIntCompareVar", guard_args = { field = "y", op = "eq", var = "bottom" } },
    { macro = "Next", target = "Map" },
    { macro = "Back", target = "Star" },
]

[states.MarksBack]
parent = "Marks"
on_enter = [
    { macro = "Say", message = "Now 'a returns to the marked row" },
]
transitions = [
    { macro = "Reached", target = "Map", x = 4, y = 14 },
]

[states.Map]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_update = [{ macro = "Bottom" }]
on_enter = [
    { macro = "Heading", text = "gg G M" },
    { macro = "Note", text = "|gg| jumps to the top row of the map and |G| to its bottom row.", row = 8 },
    { macro = "Note", text = "|M| finds the map's middle row.", row = 9 },
    { macro = "Note", text = "|go| is the top left corner and |g$| the bottom right.", row = 10 },
    { macro = "Note", text = "Press |G| for the bottom row, then |gg| back to the top.", row = 11 },
    { macro = "Line", text = "G and gg move along this column", row = 14 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 20 of 22: G to the bottom row, then gg to the top" },
]
transitions = [
    { trigger = "EventCursorMoved", target = "MapTop", guard = "PayloadIntCompareVar", guard_args = { field = "y", op = "eq", var = "bottom" } },
    { macro = "Next", target = "Visual" },
    { macro = "Back", target = "Marks" },
]

[states.MapTop]
parent = "Map"
on_enter = [
    { macro = "Say", message = "Now gg to the top row" },
]
transitions = [
    { trigger = "EventCursorMoved", target = "Visual", guard = "PayloadIntCompare", guard_args = { field = "y", op = "eq", value = 0 } },
]

# The shield is up for this lesson alone, so Visual has a reach to show; it drains
# a hundredth of the energy a second, so the lesson sets plenty to last a slow learner
[states.Visual]
parent = "Lesson"
on_exit = [
    { macro = "Clear" },
    { action = "EmitEvent", event = "EventShieldDeactivate", payload = { entity = 0 }, payload_vars = { entity = "player_entity" } },
    { action = "TerminateRegion", region = "reach" },
]
on_enter = [
    { action = "SpawnRegion", region = "reach", initial_state = "Reach" },
    { action = "EmitEvent", event = "EventEnergySetRequest", payload = { entity = 0, value = 10000 }, payload_vars = { entity = "player_entity" } },
    { macro = "Heading", text = "v" },
    { macro = "Note", text = "|v| enters visual mode: the cross through the cursor widens", row = 8 },
    { macro = "Note", text = "to a block. Motions step by it, and |d| |c| |y| |r| |~| act on all", row = 9 },
    { macro = "Note", text = "its glyphs. It is half the size of a game's shield.", row = 10 },
    { macro = "Note", text = "Press |v|, then |d| takes the block around the cursor.", row = 11 },
    { macro = "Line", text = "visual mode reaches as far as", row = 13 },
    { macro = "Line", text = "the block around the cursor:", row = 14 },
    { macro = "Line", text = "every glyph inside that block is", row = 15 },
    { macro = "Line", text = "taken by d, changed by c, yanked", row = 16 },
    { macro = "Line", text = "by y and retyped by r, at once", row = 17 },
    { macro = "Stand", x = 18, y = 15 },
    { macro = "Say", message = "Lesson 21 of 22: v, then d" },
]
transitions = [
    { trigger = "EventDeleteRequest", target = "VisualLeave", guard = "PayloadIntCompare", guard_args = { field = "range_type", op = "eq", value = 2 } },
    { macro = "Next", target = "Keys" },
    { macro = "Back", target = "Map" },
]

[states.VisualLeave]
parent = "Visual"
on_enter = [
    { macro = "Say", message = "esc or v returns to normal mode" },
]
transitions = [
    { macro = "Normal", target = "Keys" },
]

# The keys a game reads its own way, which this tutorial's keymap gave back to vi
[states.Keys]
parent = "Lesson"
on_exit = [{ macro = "Clear" }]
on_enter = [
    { macro = "Heading", text = "in a game" },
    { macro = "Note", text = "vif plays a subset of vi, and a game reads some keys its way:", row = 8 },
    { macro = "Note", text = "|a| cycles auto fire, |p| pauses, |o| |O| find a glyph in the column,", row = 9 },
    { macro = "Note", text = "|u| undoes a cursor move, |m| is the middle column, |s| is |cl|,", row = 10 },
    { macro = "Note", text = "|S| is |cc| and |y| does nothing. A keymap gives a key back by", row = 11 },
    { macro = "Note", text = "its action; the vim keymap gives them all back: |-k vim|.", row = 12 },
    { macro = "Line", text = "this tutorial played them as vi does: s goes on", row = 14 },
    { macro = "Stand", x = 4, y = 14 },
    { macro = "Say", message = "Lesson 22 of 22: what a game makes of these keys; s goes on" },
]
transitions = [
    { macro = "Next", target = "Free" },
    { macro = "Back", target = "Visual" },
]

# Free practice: the spawner lays this scenario's code in blocks, so % finds a
# bracket's pair across rows and { } hop between blocks
[states.Free]
parent = "Root"
on_enter = [
    { action = "SpawnRegion", region = "practice", initial_state = "Practice" },
    { action = "EmitEvent", event = "EventModeRequest", payload = { mode = "normal" } },
    { macro = "Say", message = "That is the tutorial: move through, type and edit this code" },
]

# The regions Free and Visual spawn stand here while they run
[states.Practice]
parent = "Root"

[states.Reach]
parent = "Root"

# --- Player: one cursor at the practice line; with no weapon or particle system, Enter and Space do nothing ---

[states.PlayerBoot]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventCursorSpawnRequest", payload = { x = 4, y = 14, heat = 100, energy = 100 } },
]
transitions = [
    { trigger = "EventCursorSpawned", target = "PlayerActive", capture_vars = { entity = "player_entity" } },
    { trigger = "EventCursorSpawnFailed", target = "PlayerBootRetry" },
]

[states.PlayerBootRetry]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "PlayerBoot", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

# The cursor last spawned is the one Stand places: a rejoin after the wraith went
# brings a new one
[states.PlayerActive]
parent = "Root"
transitions = [
    { trigger = "EventCursorSpawned", internal = true, capture_vars = { entity = "player_entity" } },
]
