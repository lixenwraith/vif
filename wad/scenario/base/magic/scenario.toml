description = "Magic: turn the rows and columns of a magic square under its shield; three attacks along an edge strike what nears the side it faces, and three whirls or defenses along any row or column turn a wind round the shield or boost it."
min_players = 1
max_players = 1

# The Lo Shu square, 6 7 2 over 1 5 9 over 8 3 4, its digits in three kinds: 2 1 3
# attack, 6 5 4 whirl and 8 7 9 defense, one of each along every row and column. It
# stands under the shield of a cursor fixed at its middle; a touch costs the shield
# one of the energy it starts with, which nothing gives back, the blocks heat once
# it is down, and the game the last of both. Four gateways on the corners trickle
# strays, and one sends a wave, one more each round. The attack on an edge strikes
# each 2 s, ending what nears the side it faces whatever its rank; a whirl or a
# defense fires from the middle row and column too.

# The least map that holds the square on blocks a row tall with its cursor's orbs
# circling on it, 39 by 19, and a gateway's pylon in each corner a cell clear of
# their orbit; the outer orbit flattens to the map, and a smaller screen scrolls
[map]
min_width = 41
min_height = 19
cursors = "fixed"

[systems]
only_systems = ["square", "behavior", "cursor", "camera", "energy", "heat", "shield", "boost", "weapon", "loot", "composite", "combat", "death", "timer", "gateway", "navigation", "pylon", "lightning", "missile", "bullet", "pulse", "explosion", "flash", "fadeout", "spirit", "soft_collision", "environment", "particle", "transient", "audio", "music"]

[regions.magic]
initial = "Setup"

[regions.player]
initial = "PlayerBoot"
background = true

[regions.flood]
background = true

[regions.ramp]
background = true

[regions.reward]
background = true

# --- The bodies ---

# A body homes on the cursor at the square's middle and nothing else: no lock, no
# charge, no teleport. Its mass has it flock and scatter with its kind. Every weapon
# of the cursor's wears it, a pulse without its stun, which would hold a crowd for
# good; a strike ends it, and a strike's, a bolt's or a death wave's kill flashes,
# any other scatters it.
[macros.Body]
doc = "A body of the gateways: it homes on the square under a look, with the hit points, mass, touch and flight of its rank."
params = { width = "int", height = "int", header = "table", pattern_ms = "int", frames = "array", fg = "array", fg256 = "int", hp = "int", mass = "float", contact = "table", physics = "table" }

[macros.Body.body]
initial = "Seek"
states = { Seek = { on_update = [{ action = "Home" }] } }

[macros.Body.body.prototype]
combat = "swarm"
death = "scatter"
attacks = { pulse = { stun = false }, strike = { death = "flash" }, lightning = { death = "flash" }, death_wave = { death = "flash" } }
width = "${width}"
height = "${height}"
header = "${header}"
hp = "${hp}"
mass = "${mass}"
contact = "${contact}"
physics = "${physics}"
pattern_ms = "${pattern_ms}"
frames = "${frames}"
fg = "${fg}"
fg256 = "${fg256}"
bg256 = 0

# Eight ranks, a stray and a wave's body to each. A rank up flies faster and holds
# more hit points, so the weapons take longer over it, and from the fifth on they
# cannot stop it alone: the strikes must. The masses stand close, so
# a wind carries every rank about alike. A touch costs the same at every rank, 1
# energy off the shield or 10 heat off the blocks, so the shield's energy counts the
# touches left, 200 a color.
[macros.Touch]
doc = "What a body's touch costs: energy off the shield, heat off the blocks under none."
body = { energy = 1, heat = 10 }

[macros.Rank]
doc = "A body of a rank: its hit points, mass and speed."
base = "Body"
params = { hp = "int", mass = "float", speed = "float" }
with = { hp = "${hp}", mass = "${mass}", contact = { macro = "Touch" }, physics = { speed = "${speed}", accel = 9.0, drag = 1.6, restitution = 0.0 } }

[macros.Rank1]
doc = "A first-rank body: light and slow."
base = "Rank"
with = { hp = 6, mass = 1.6, speed = 2.4 }

[macros.Rank2]
doc = "A second-rank body."
base = "Rank"
with = { hp = 12, mass = 1.8, speed = 2.6 }

[macros.Rank3]
doc = "A third-rank body."
base = "Rank"
with = { hp = 20, mass = 2.0, speed = 2.8 }

[macros.Rank4]
doc = "A fourth-rank body: the last the weapons alone hold off."
base = "Rank"
with = { hp = 30, mass = 2.4, speed = 3.0 }

[macros.Rank5]
doc = "A fifth-rank body: quick, and past a full loadout now and then."
base = "Rank"
with = { hp = 80, mass = 2.0, speed = 3.4 }

[macros.Rank6]
doc = "A sixth-rank body."
base = "Rank"
with = { hp = 160, mass = 2.2, speed = 3.8 }

[macros.Rank7]
doc = "A seventh-rank body."
base = "Rank"
with = { hp = 320, mass = 2.4, speed = 4.2 }

[macros.Rank8]
doc = "An eighth-rank body: the quickest and the hardest to wear."
base = "Rank"
with = { hp = 640, mass = 2.6, speed = 4.6 }

# The strays, a hue to a rank: green motes, violet wisps, orange imps, bone golems,
# then azure fiends, rose ogres, lime drakes and pale gold colossi
[behaviors.mote]
macro = "Rank1"
width = 3
height = 1
header = { x = 1, y = 0 }
pattern_ms = 400
fg = [{ r = 120, g = 230, b = 120 }, { r = 230, g = 255, b = 230 }]
fg256 = 10
frames = [{ glyphs = ["(o)"], fg = ["010"] }, { glyphs = ["<o>"], fg = ["010"] }]

[behaviors.wisp]
macro = "Rank2"
width = 3
height = 2
header = { x = 1, y = 0 }
pattern_ms = 400
fg = [{ r = 170, g = 90, b = 230 }, { r = 235, g = 208, b = 255 }]
fg256 = 13
frames = [{ glyphs = ["(o)", " v "], fg = ["010", " 0 "] }, { glyphs = ["(o)", " ' "], fg = ["010", " 0 "] }]

[behaviors.imp]
macro = "Rank3"
width = 4
height = 2
header = { x = 1, y = 0 }
pattern_ms = 350
fg = [{ r = 255, g = 140, b = 40 }, { r = 255, g = 215, b = 140 }]
fg256 = 3
frames = [{ glyphs = ["{oo}", "/\\/\\"], fg = ["0110", "0000"] }, { glyphs = ["{oo}", "\\/\\/"], fg = ["0110", "0000"] }]

[behaviors.golem]
macro = "Rank4"
width = 5
height = 3
header = { x = 2, y = 1 }
pattern_ms = 500
fg = [{ r = 228, g = 228, b = 238 }, { r = 150, g = 152, b = 170 }]
fg256 = 15
frames = [
    { glyphs = [" [=] ", "[o o]", " /_\\ "], fg = [" 010 ", "01010", " 010 "] },
    { glyphs = [" [=] ", "[- -]", " /_\\ "], fg = [" 010 ", "01010", " 010 "] },
]

[behaviors.fiend]
macro = "Rank5"
width = 3
height = 2
header = { x = 1, y = 0 }
pattern_ms = 250
fg = [{ r = 90, g = 170, b = 255 }, { r = 225, g = 240, b = 255 }]
fg256 = 12
frames = [{ glyphs = ["}o{", " V "], fg = ["010", " 0 "] }, { glyphs = [">o<", " v "], fg = ["010", " 0 "] }]

[behaviors.ogre]
macro = "Rank6"
width = 4
height = 2
header = { x = 1, y = 0 }
pattern_ms = 300
fg = [{ r = 255, g = 105, b = 180 }, { r = 255, g = 225, b = 240 }]
fg256 = 5
frames = [{ glyphs = ["(@@)", "{__}"], fg = ["0110", "0000"] }, { glyphs = ["(@@)", "{--}"], fg = ["0110", "0000"] }]

[behaviors.drake]
macro = "Rank7"
width = 4
height = 2
header = { x = 1, y = 0 }
pattern_ms = 200
fg = [{ r = 190, g = 255, b = 60 }, { r = 245, g = 255, b = 210 }]
fg256 = 14
frames = [{ glyphs = ["<%%>", "\\/\\/"], fg = ["0110", "0000"] }, { glyphs = ["<%%>", "/\\/\\"], fg = ["0110", "0000"] }]

[behaviors.colossus]
macro = "Rank8"
width = 5
height = 3
header = { x = 2, y = 1 }
pattern_ms = 350
fg = [{ r = 255, g = 240, b = 180 }, { r = 255, g = 255, b = 255 }]
fg256 = 7
frames = [
    { glyphs = [" /#\\ ", "<#O#>", " \\#/ "], fg = [" 000 ", "00100", " 000 "] },
    { glyphs = [" /#\\ ", "<#o#>", " \\#/ "], fg = [" 000 ", "00100", " 000 "] },
]

# A wave's bodies, each in its rank's hue and marked in the attack's red, which
# ends what of a wave nears at a stroke: sparks, shades, hexes, titans, then flares,
# specters, curses and behemoths
[behaviors.spark]
macro = "Rank1"
width = 3
height = 1
header = { x = 1, y = 0 }
pattern_ms = 300
fg = [{ r = 120, g = 230, b = 120 }, { r = 255, g = 80, b = 80 }]
fg256 = 9
frames = [{ glyphs = ["[*]"], fg = ["010"], attr = [" B "] }, { glyphs = ["[+]"], fg = ["010"], attr = [" B "] }]

[behaviors.shade]
macro = "Rank2"
width = 3
height = 2
header = { x = 1, y = 0 }
pattern_ms = 500
fg = [{ r = 170, g = 90, b = 230 }, { r = 255, g = 80, b = 80 }]
fg256 = 9
frames = [{ glyphs = ["[^]", "\\_/"], fg = ["010", "000"], attr = [" B ", "   "] }, { glyphs = ["[-]", "\\_/"], fg = ["010", "000"], attr = [" B ", "   "] }]

[behaviors.hex]
macro = "Rank3"
width = 4
height = 2
header = { x = 1, y = 0 }
pattern_ms = 450
fg = [{ r = 255, g = 140, b = 40 }, { r = 255, g = 80, b = 80 }]
fg256 = 9
frames = [{ glyphs = ["[##]", "[##]"], fg = ["0110", "0110"], attr = [" BB ", " BB "] }, { glyphs = ["[++]", "[++]"], fg = ["0110", "0110"], attr = [" BB ", " BB "] }]

[behaviors.titan]
macro = "Rank4"
width = 5
height = 3
header = { x = 2, y = 1 }
pattern_ms = 600
fg = [{ r = 228, g = 228, b = 238 }, { r = 255, g = 80, b = 80 }]
fg256 = 9
frames = [
    { glyphs = ["[===]", "[o_o]", "[|||]"], fg = ["00000", "01010", "00000"], attr = ["     ", " B B ", "     "] },
    { glyphs = ["[===]", "[o_o]", "[/|\\]"], fg = ["00000", "01010", "00000"], attr = ["     ", " B B ", "     "] },
]

[behaviors.flare]
macro = "Rank5"
width = 3
height = 2
header = { x = 1, y = 0 }
pattern_ms = 250
fg = [{ r = 90, g = 170, b = 255 }, { r = 255, g = 80, b = 80 }]
fg256 = 9
frames = [{ glyphs = ["[!]", "/V\\"], fg = ["010", "000"], attr = [" B ", "   "] }, { glyphs = ["[|]", "/V\\"], fg = ["010", "000"], attr = [" B ", "   "] }]

[behaviors.specter]
macro = "Rank6"
width = 4
height = 2
header = { x = 1, y = 0 }
pattern_ms = 300
fg = [{ r = 255, g = 105, b = 180 }, { r = 255, g = 80, b = 80 }]
fg256 = 9
frames = [{ glyphs = ["[@@]", "{VV}"], fg = ["0110", "0000"], attr = [" BB ", "    "] }, { glyphs = ["[@@]", "{vv}"], fg = ["0110", "0000"], attr = [" BB ", "    "] }]

[behaviors.curse]
macro = "Rank7"
width = 4
height = 2
header = { x = 1, y = 0 }
pattern_ms = 200
fg = [{ r = 190, g = 255, b = 60 }, { r = 255, g = 80, b = 80 }]
fg256 = 9
frames = [{ glyphs = ["[%%]", "<^^>"], fg = ["0110", "0000"], attr = [" BB ", "    "] }, { glyphs = ["[%%]", ">^^<"], fg = ["0110", "0000"], attr = [" BB ", "    "] }]

[behaviors.behemoth]
macro = "Rank8"
width = 5
height = 3
header = { x = 2, y = 1 }
pattern_ms = 350
fg = [{ r = 255, g = 240, b = 180 }, { r = 255, g = 80, b = 80 }]
fg256 = 9
frames = [
    { glyphs = ["[#^#]", "[<O>]", "[#v#]"], fg = ["00000", "00100", "00000"], attr = ["     ", "  B  ", "     "] },
    { glyphs = ["[#^#]", "[>O<]", "[#v#]"], fg = ["00000", "00100", "00000"], attr = ["     ", "  B  ", "     "] },
]

# The carrier a level sends: a heavy body in gold that the weapons wear slowly, and
# where a player's kill ends it the ramp lays the next weapon
[behaviors.carrier]
macro = "Body"
hp = 40
mass = 2.4
contact = { macro = "Touch" }
physics = { speed = 2.2, accel = 9.0, drag = 1.6, restitution = 0.0 }
width = 5
height = 3
header = { x = 2, y = 1 }
pattern_ms = 450
fg = [{ r = 255, g = 200, b = 60 }, { r = 255, g = 255, b = 255 }]
fg256 = 11
frames = [
    { glyphs = ["/===\\", "[ $ ]", "\\===/"], fg = ["00000", "00100", "00000"], attr = ["     ", "  B  ", "     "] },
    { glyphs = ["/---\\", "[ $ ]", "\\---/"], fg = ["00000", "00100", "00000"], attr = ["     ", "  B  ", "     "] },
]

# --- Macros ---

[macros.Say]
doc = "Status message; each {} in it reads variable `var`."
params = { message = "string", var = "string" }
defaults = { var = "level" }
body = { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "${message}" }, payload_vars = { message = "${var}" } }

# The strays in rank order, then the flood's bodies: a gateway's is the one its
# variable counts to
[macros.Arm]
doc = "Arm the gateway on the pylon in `anchor` with the body `body` counts to, one each `pace` ms, as a wave or not, once the round sends `least` waves; a gateway already there is re-armed."
params = { anchor = "string", body = "string", pace = "string", wave = "bool", least = "int" }
defaults = { wave = false, least = 0 }
body = { action = "EmitEvent", event = "EventGatewaySpawnRequest", guard = "VarCompare", guard_args = { var = "waves", op = "gte", value = "${least}" }, payload = { anchor_entity = 0, base_interval_ms = 0, rate_multiplier = 1.0, wave = "${wave}" }, payload_vars = { anchor_entity = "${anchor}", base_interval_ms = "${pace}" }, pick = { field = "species", var = "${body}", from = ["mote", "wisp", "imp", "golem", "fiend", "ogre", "drake", "colossus", "spark", "shade", "hex", "titan", "flare", "specter", "curse", "behemoth"] } }

[macros.Waves]
doc = "Arm the round's wave gateways, the first always and each next once the round sends that many, with the wave's body at the wave's pace."
body = [{ macro = "Arm", each = { anchor = ["anchor_wave1", "anchor_wave2", "anchor_wave3", "anchor_wave4"], least = [1, 2, 3, 4] }, body = "tide", pace = "flood_ms", wave = true }]

# A gateway's pylon is small, stands on the edge and is inert: no weapon aims at it
# or wears it
[macros.Gate]
doc = "Stand pylon `n` at (x, y) counted from `at` with a gateway of the rank's stray at the trickle's pace, then go to `next`, the pylon standing or not."
params = { n = "int", at = "string", x = "int", y = "int", next = "string" }
body = { parent = "Root", on_enter = [
    { action = "EmitEvent", event = "EventPylonSpawnRequest", origin = "${at}", payload = { x = "${x}", y = "${y}", radius_x = 2, radius_y = 1, inert = true } },
], transitions = [
    { trigger = "EventSpeciesCreated", target = "${next}", guard = "PayloadSpeciesIn", guard_args = { field = "species", names = ["pylon"] }, capture_vars = { entity = "anchor${n}" }, actions = [
        { macro = "Arm", anchor = "anchor${n}", body = "stray", pace = "trickle_ms" },
    ] },
    { trigger = "EventPylonSpawnFailed", target = "${next}" },
    { trigger = "Tick", target = "${next}", guard = "StateTimeExceeds", guard_args = { ms = 500 } },
] }

[macros.FloodTo]
doc = "The waves' move to the gateways clockwise from `g1`, the one flood counts `at`: their pylons kept in that order for the waves' requests, a level's carrier coming from the third, opposite the first."
params = { at = "int", g1 = "int", g2 = "int", g3 = "int", g4 = "int" }
body = { trigger = "Tick", target = "FloodRun", guard = "VarEquals", guard_args = { var = "flood", value = "${at}" }, actions = [
    { action = "CopyVar", payload = { name = "anchor_wave1", source_var = "anchor${g1}" } },
    { action = "CopyVar", payload = { name = "anchor_wave2", source_var = "anchor${g2}" } },
    { action = "CopyVar", payload = { name = "anchor_wave3", source_var = "anchor${g3}" } },
    { action = "CopyVar", payload = { name = "anchor_wave4", source_var = "anchor${g4}" } },
] }

# --- The square ---

# Boot: the square stands behind the start prompt, and the gateways open after the
# press at the first level's paces, a stray a gateway every 4.5 s and a wave's body
# every 1.6 s from one gateway, which each round of the ranks starts a step quicker
# (the `_base` variables) and with a wave more. The shield steps its color every
# 200 energy. The map follows the screen, and its pylons, square and cursor keep
# their places on it, the blocks as tall as its rows leave room for.
[states.Setup]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventSquareSpawnRequest", origin = "center", payload = { layout = "672159834", groups = ["213", "654", "879"], shield_step = 200 } },
    { action = "SetVar", payload = { name = "stray", value = 0 } },
    { action = "SetVar", payload = { name = "tide", value = 8 } },
    { action = "SetVar", payload = { name = "waves", value = 1 } },
    { action = "SetVar", payload = { name = "trickle_ms", value = 4500 } },
    { action = "SetVar", payload = { name = "trickle_base", value = 4500 } },
    { action = "SetVar", payload = { name = "flood_ms", value = 1600 } },
    { action = "SetVar", payload = { name = "flood_base", value = 1600 } },
    { action = "SetVar", payload = { name = "need", value = 30 } },
    { action = "SetVar", payload = { name = "need_base", value = 30 } },
]
transitions = [{ trigger = "Tick", target = "Gate1" }]

# The corners, clockwise from the top left, each pylon flush in its corner so
# that no body is held behind it
[states]
Gate1 = { macro = "Gate", n = 1, at = "top_left", x = 2, y = 1, next = "Gate2" }
Gate2 = { macro = "Gate", n = 2, at = "top_right", x = -2, y = 1, next = "Gate3" }
Gate3 = { macro = "Gate", n = 3, at = "bottom_right", x = -2, y = -1, next = "Gate4" }
Gate4 = { macro = "Gate", n = 4, at = "bottom_left", x = 2, y = -1, next = "Play" }

# Keys are the square's while it stands, Enter with them for the burst. The keys are
# told a while in, so what ended the last game reads first, then what the shield's
# energy is spent and earned by, what a line does, what the weapons do, what dust
# is and what fills the burst.
[states.Play]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventKeyCaptureRequest", payload = { keys = "123456789hjklasdf\r" }, reconcile = true },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "1-9 select a block; h l or a f turn its row, k j or s d its column" }, delay_ms = 2000 },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "A touch costs the shield 1 of its 1,400, which nothing gives back; a wave you end pays 10 heat" }, delay_ms = 12000 },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "An attack on an edge strikes what nears its side; a whirl or a defense fires along any row or column" }, delay_ms = 22000 },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "Weapons wear every body down and fall with the shield; a defense stands it a moment" }, delay_ms = 32000 },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "Dust fills with time and kills, a magic square at once: a defense sheds it, as the shield's fall does" }, delay_ms = 42000 },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "Each touch on the shield and each heat gained fill the burst a hundredth" }, delay_ms = 52000 },
    { action = "SpawnRegion", region = "flood", initial_state = "FloodPick" },
    { action = "SpawnRegion", region = "ramp", initial_state = "Level" },
    { action = "SpawnRegion", region = "reward", initial_state = "Pay" },
]
on_exit = [
    { action = "EmitEvent", event = "EventKeyCaptureRequest", payload = { keys = "" }, reconcile = true },
]
# A crowd nobody strikes stops growing: every gateway holds while 300 bodies stand,
# more than any game played brings
transitions = [
    { trigger = "Tick", internal = true, guard = "StatusIntCompare", guard_args = { key = "behavior.count", op = "gte", value = 300 }, actions = [
        { action = "EmitEvent", event = "EventGatewayHoldRequest", payload = { anchor_entity = 0, duration_ms = 500 } },
    ] },
]

# --- The wave ---

# A gateway sends a wave: the rank's wave body at the wave's pace in place of its
# stray. A round sends one more wave than the last, from the gateways clockwise of
# the first, up to all four. The waves move one to three gateways on round the
# corners, drawn anew each move, after 12 s, 9 s at the third rank and 6 s at the
# fourth.
[states.FloodPick]
parent = "Root"
on_enter = [
    { action = "IncrementVar", payload = { name = "flood_index" } },
    { action = "RandomVar", payload = { name = "flood_step", min = 1, max = 3, index_var = "flood_index" } },
    { action = "IncrementVar", payload = { name = "flood", source_var = "flood_step" } },
    { action = "ModuloVar", payload = { name = "flood", delta = 4 } },
]
transitions = [
    { macro = "FloodTo", each = { at = [0, 1, 2, 3], g1 = [1, 2, 3, 4], g2 = [2, 3, 4, 1], g3 = [3, 4, 1, 2], g4 = [4, 1, 2, 3] } },
]

[states.FloodRun]
parent = "Root"
on_enter = [{ macro = "Waves" }]
on_exit = [
    { macro = "Arm", each = { anchor = ["anchor_wave1", "anchor_wave2", "anchor_wave3", "anchor_wave4"] }, body = "stray", pace = "trickle_ms" },
]
transitions = [
    { trigger = "Tick", target = "FloodPick", guard = "And", guard_args = { guards = [
        { name = "StateTimeExceeds", args = { ms = 6000 } },
        { name = "VarCompare", args = { var = "rank", op = "gte", value = 3 } },
    ] } },
    { trigger = "Tick", target = "FloodPick", guard = "And", guard_args = { guards = [
        { name = "StateTimeExceeds", args = { ms = 9000 } },
        { name = "VarCompare", args = { var = "rank", op = "gte", value = 2 } },
    ] } },
    { trigger = "Tick", target = "FloodPick", guard = "StateTimeExceeds", guard_args = { ms = 12000 } },
]

# A wave defeated, its gateway sending its stray again and the last of its bodies
# dead, pays a heat drop from that gateway
[states.Pay]
parent = "Root"
transitions = [
    { trigger = "EventGatewayWaveDefeated", internal = true, capture_vars = { x = "pay_x", y = "pay_y" }, actions = [
        { action = "EmitEvent", event = "EventLootSpawnRequest", payload = { type = "heat", x = 0, y = 0 }, payload_vars = { x = "pay_x", y = "pay_y" } },
    ] },
]

# --- The ramp ---

# A level holds until players' kills of its bodies reach its count, 30 at first, or
# 90 s. Where a player's kill ends the carrier a level sent, the next weapon of the
# round launcher, turret, emitter, disruptor, rod drops.
[states.Level]
parent = "Root"
transitions = [
    { trigger = "EventSpeciesKilled", internal = true, guard = "And", guard_args = { guards = [
        { name = "PayloadSpeciesIn", args = { field = "species", names = ["mote", "wisp", "imp", "golem", "fiend", "ogre", "drake", "colossus", "spark", "shade", "hex", "titan", "flare", "specter", "curse", "behemoth"] } },
        { name = "PayloadIntCompare", args = { field = "killer_entity", op = "neq", value = 0 } },
    ] }, actions = [{ action = "IncrementVar", payload = { name = "kills" } }] },
    { trigger = "EventSpeciesKilled", internal = true, guard = "And", guard_args = { guards = [
        { name = "PayloadSpeciesIn", args = { field = "species", names = ["carrier"] } },
        { name = "PayloadIntCompare", args = { field = "killer_entity", op = "neq", value = 0 } },
    ] }, capture_vars = { x = "drop_x", y = "drop_y" }, actions = [
        { action = "EmitEvent", event = "EventLootSpawnRequest", payload = { x = 0, y = 0 }, payload_vars = { x = "drop_x", y = "drop_y" }, pick = { field = "type", var = "weapon", from = ["launcher", "turret", "emitter", "disruptor", "rod"] } },
        { action = "IncrementVar", payload = { name = "weapon" } },
    ] },
    { trigger = "Tick", target = "LevelUp", guard = "VarCompareVar", guard_args = { var_a = "kills", op = "gte", var_b = "need" } },
    { trigger = "Tick", target = "LevelUp", guard = "StateTimeExceeds", guard_args = { ms = 90000 } },
]

# A level up takes the bodies a rank on, four levels to a round, and each round
# starts a rank above the last: the first runs the first rank to the fourth, the
# fifth and every one after it the fifth to the eighth
[states.LevelUp]
parent = "Root"
on_enter = [
    { action = "IncrementVar", payload = { name = "level" } },
    { action = "SetVar", payload = { name = "kills", value = 0 } },
    { action = "CopyVar", payload = { name = "rank", source_var = "level" } },
    { action = "ModuloVar", payload = { name = "rank", delta = 4 } },
    { action = "CopyVar", payload = { name = "round", source_var = "level" } },
    { action = "DivideVar", payload = { name = "round", delta = 4 } },
    { action = "CopyVar", payload = { name = "stray", source_var = "rank" } },
    { action = "IncrementVar", payload = { name = "stray", source_var = "round", max = 7 } },
    { action = "CopyVar", payload = { name = "tide", source_var = "stray" } },
    { action = "IncrementVar", payload = { name = "tide", delta = 8 } },
]
transitions = [
    { trigger = "Tick", target = "RoundUp", guard = "VarEquals", guard_args = { var = "rank", value = 0 } },
    { trigger = "Tick", target = "RankUp" },
]

# Within a round each rank comes quicker and asks more kills: the trickle a fifth
# quicker down to a stray a gateway every 2 s, a wave two fifths quicker down to
# a body every 600 ms, as fast as the largest leave a gateway without a jam, the
# level's kills half as many again
[states.RankUp]
parent = "Root"
on_enter = [
    { action = "MultiplyVar", payload = { name = "trickle_ms", delta = 4 } },
    { action = "DivideVar", payload = { name = "trickle_ms", delta = 5, min = 2000 } },
    { action = "MultiplyVar", payload = { name = "flood_ms", delta = 3 } },
    { action = "DivideVar", payload = { name = "flood_ms", delta = 5, min = 600 } },
    { action = "MultiplyVar", payload = { name = "need", delta = 3 } },
    { action = "DivideVar", payload = { name = "need", delta = 2 } },
]
transitions = [{ trigger = "Tick", target = "Rearm" }]

# A new round eases back to the first rank at a step up from where the last round
# started, which is what its second rank ran at, and sends a wave more
[states.RoundUp]
parent = "Root"
on_enter = [
    { action = "IncrementVar", payload = { name = "waves", max = 4 } },
    { action = "MultiplyVar", payload = { name = "trickle_base", delta = 4 } },
    { action = "DivideVar", payload = { name = "trickle_base", delta = 5, min = 2000 } },
    { action = "MultiplyVar", payload = { name = "flood_base", delta = 3 } },
    { action = "DivideVar", payload = { name = "flood_base", delta = 5, min = 600 } },
    { action = "MultiplyVar", payload = { name = "need_base", delta = 3 } },
    { action = "DivideVar", payload = { name = "need_base", delta = 2 } },
    { action = "CopyVar", payload = { name = "trickle_ms", source_var = "trickle_base" } },
    { action = "CopyVar", payload = { name = "flood_ms", source_var = "flood_base" } },
    { action = "CopyVar", payload = { name = "need", source_var = "need_base" } },
]
transitions = [{ trigger = "Tick", target = "Rearm" }]

# The gateways take the level's bodies and paces, those sending a wave their
# wave's, and a carrier comes out of the gateway opposite the first of them
[states.Rearm]
parent = "Root"
on_enter = [
    { macro = "Arm", each = { anchor = ["anchor1", "anchor2", "anchor3", "anchor4"] }, body = "stray", pace = "trickle_ms" },
    { macro = "Waves" },
    { action = "EmitEvent", event = "EventGatewaySendRequest", payload = { anchor_entity = 0, species = "carrier" }, payload_vars = { anchor_entity = "anchor_wave3" } },
    { macro = "Say", message = "Level {}" },
]
transitions = [{ trigger = "Tick", target = "Level" }]

# --- Player: a cursor fixed at the square's middle, the shield its own ---

# The shield starts with its 1,400 touches of energy, over a full meter of heat
[states.PlayerBoot]
parent = "Root"
on_enter = [{ action = "EmitEvent", event = "EventCursorSpawnRequest", origin = "center", payload = { heat = 100, energy = 1400 } }]
transitions = [
    { trigger = "EventCursorSpawned", target = "PlayerActive", capture_vars = { entity = "player_entity" } },
    { trigger = "EventCursorSpawnFailed", target = "PlayerBootRetry" },
]

[states.PlayerBootRetry]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "PlayerBoot", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

# The cursor's own gun stays off the map: its weapons are what the carriers drop.
# Its burst meter fills a hundredth for each heat it gains and each hit its shield
# takes, and Enter, or a press on the meter, spends a full one on a death wave out
# from the square. Overheat bursts with no ember here: a lit one would spare the
# shield its touches and burn the blocks' heat.
[states.PlayerActive]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventWeaponRemoveRequest", payload = { weapon = "gun" }, payload_vars = { entity = "player_entity" } },
    { action = "SetVar", payload = { name = "armed", value = 0 } },
]
transitions = [
    { trigger = "EventSquareHit", target = "Fallen", guard = "StatusBoolEquals", guard_args = { key = "session.any_defeated", value = true } },
    { trigger = "EventHeatBurst", internal = true, actions = [
        { action = "EmitEvent", event = "EventHeatEmberRequest", payload = { lit = false }, payload_vars = { entity = "player_entity" } },
    ] },
    { trigger = "Tick", internal = true, guard = "And", guard_args = { guards = [
        { name = "StatusIntCompare", args = { key = "player.0.heat.burst", op = "gte", value = 100 } },
        { name = "VarEquals", args = { var = "armed", value = 0 } },
    ] }, actions = [
        { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "Burst ready: Enter, or a press on its meter, runs a death wave" } },
        { action = "SetVar", payload = { name = "armed", value = 1 } },
    ] },
    { trigger = "EventInputPressed", internal = true, guard = "And", guard_args = { guards = [
        { name = "PayloadStringEquals", args = { field = "key", value = "\r" } },
        { name = "StatusIntCompare", args = { key = "player.0.heat.burst", op = "gte", value = 100 } },
    ] }, actions = [
        { action = "EmitEvent", event = "EventDeathWaveRequest", payload_vars = { entity = "player_entity" } },
        { action = "EmitEvent", event = "EventBurstSpendRequest", payload_vars = { entity = "player_entity" } },
        { action = "SetVar", payload = { name = "armed", value = 0 } },
    ] },
]

# The game is lost to a touch on the blocks with no energy and no heat left. It
# flashes red as long as fighter's, then starts over; the reset clears the status bar,
# so the new game opens with what ended the last
[states.Fallen]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventStrobeRequest", payload = { color = { r = 255, g = 0, b = 0 }, intensity = 1.0, duration_ms = 250 } },
]
transitions = [
    { trigger = "Tick", target = "Reset", guard = "StateTimeExceeds", guard_args = { ms = 250 } },
]

[states.Reset]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventGameResetRequest" },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "The square has fallen" } },
]
