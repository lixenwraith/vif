description = "Magic: turn the rows and columns of a magic square under a swarm; three of a kind in a line strike, hold or shield."
min_players = 1
max_players = 16

# The Lo Shu square, 2 7 6 over 9 5 1 over 4 3 8, its digits in three kinds: 2 1 3
# attack, 6 5 4 hold and 8 7 9 defense, one of each along every row and column. A
# digit selects its block; h and l turn the block's row a place, k and j its column.
# A line that comes to hold three of a kind fires it: attack strikes every swarm
# dead, hold stuns them and stops the gateways, defense shields the blocks and
# pushes the swarms off. Each recharges once it ends, as the legend under the square
# counts. Swarms pour from eight gateways round the edge and wear the blocks they
# cover; a fallen block still turns and aligns, but no swarm seeks it. The game is
# lost with the last block.

# The square, its legend, and the gateways' pylons clear of both
[map]
min_width = 64
min_height = 22
cursors = false

[systems]
only_systems = ["square", "composite", "combat", "death", "timer", "swarm", "gateway", "navigation", "pylon", "lightning", "flash", "fadeout", "spirit", "soft_collision", "cursor", "transient", "audio"]

[regions.magic]
initial = "Setup"

[regions.player]
initial = "PlayerBoot"
background = true

# --- Macros ---

[macros.Say]
doc = "Status message; each {} in it reads variable `var`."
params = { message = "string", var = "string" }
defaults = { var = "fallen" }
body = { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "${message}" }, payload_vars = { message = "${var}" } }

[macros.Announce]
doc = "Flash the screen in `color` and show a status message."
params = { color = "table", message = "string" }
body = [
    { action = "EmitEvent", event = "EventStrobeRequest", payload = { color = "${color}", intensity = 0.6, duration_ms = 300 } },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "${message}" } },
]

# A gateway's pylon is small and stands on the edge; nothing on the map wears it.
# Each gateway spawns on an interval of its own, so the swarms come on in a stream
# rather than in waves, faster by a tenth every 20 seconds down to one in 3.
[macros.Gate]
doc = "Stand a pylon at (x, y) counted from `at` with a gateway spawning a swarm homing on the square each `interval_ms`, then go to `next`, the pylon standing or not."
params = { at = "string", x = "int", y = "int", interval_ms = "int", next = "string" }
body = { parent = "Root", on_enter = [
    { action = "EmitEvent", event = "EventPylonSpawnRequest", origin = "${at}", payload = { x = "${x}", y = "${y}", radius_x = 2, radius_y = 1 } },
], transitions = [
    { trigger = "EventSpeciesCreated", target = "${next}", guard = "PayloadSpeciesIn", guard_args = { field = "species", names = ["pylon"] }, capture_vars = { entity = "anchor" }, actions = [
        { action = "EmitEvent", event = "EventGatewaySpawnRequest", payload = { anchor_entity = 0, species = "swarm", group_id = 1, base_interval_ms = "${interval_ms}", rate_multiplier = 0.9, rate_accel_interval_ms = 20000, min_interval_ms = 3000 }, payload_vars = { anchor_entity = "anchor" } },
    ] },
    { trigger = "EventPylonSpawnFailed", target = "${next}" },
    { trigger = "Tick", target = "${next}", guard = "StateTimeExceeds", guard_args = { ms = 500 } },
] }

[macros.Fired]
doc = "Announce the effect a line of `kind` fired."
params = { kind = "int", color = "table", message = "string" }
body = { trigger = "EventSquareAligned", internal = true, guard = "PayloadIntCompare", guard_args = { field = "kind", op = "eq", value = "${kind}" }, actions = [
    { macro = "Announce", color = "${color}", message = "${message}" },
] }

# --- The square ---

# Boot: the square stands behind the start prompt; the gateways open from the first
# tick, after the press. Its blocks anchor target group 1, which the swarms seek.
[states.Setup]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventSquareSpawnRequest", origin = "center", payload = { layout = "276951438", groups = ["213", "654", "879"], target_group_id = 1 } },
]
transitions = [{ trigger = "Tick", target = "Gate1" }]

# The corners and the middles of the edges, clockwise from the top left
[states]
Gate1 = { macro = "Gate", at = "top_left", x = 4, y = 1, interval_ms = 7600, next = "Gate2" }
Gate2 = { macro = "Gate", at = "top", x = 0, y = 1, interval_ms = 9200, next = "Gate3" }
Gate3 = { macro = "Gate", at = "top_right", x = -4, y = 1, interval_ms = 8400, next = "Gate4" }
Gate4 = { macro = "Gate", at = "right", x = -4, y = 0, interval_ms = 10000, next = "Gate5" }
Gate5 = { macro = "Gate", at = "bottom_right", x = -4, y = -1, interval_ms = 8000, next = "Gate6" }
Gate6 = { macro = "Gate", at = "bottom", x = 0, y = -1, interval_ms = 9600, next = "Gate7" }
Gate7 = { macro = "Gate", at = "bottom_left", x = 4, y = -1, interval_ms = 8800, next = "Gate8" }
Gate8 = { macro = "Gate", at = "left", x = 4, y = 0, interval_ms = 10400, next = "Play" }

# Keys are the square's while it stands; a block's fall is told, the last one's ends the game
[states.Play]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventKeyCaptureRequest", payload = { keys = "123456789hjkl" }, reconcile = true },
    { macro = "Say", message = "1-9 select a block, h l turn its row and k j its column" },
]
on_exit = [
    { action = "EmitEvent", event = "EventKeyCaptureRequest", payload = { keys = "" }, reconcile = true },
]
transitions = [
    { macro = "Fired", each = { kind = [0, 1, 2], message = ["Strike", "Hold", "Shield"], color = [
        { r = 255, g = 70, b = 40 }, { r = 255, g = 200, b = 0 }, { r = 0, g = 220, b = 255 },
    ] } },
    { trigger = "EventSquareBlockFallen", target = "Fallen", guard = "PayloadIntCompare", guard_args = { field = "remaining", op = "eq", value = 0 } },
    { trigger = "EventSquareBlockFallen", internal = true, capture_vars = { digit = "fallen" }, actions = [
        { macro = "Say", message = "Block {} fell" },
    ] },
]

[states.Fallen]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventGrayoutStart", reconcile = true },
    { macro = "Announce", color = { r = 255, g = 0, b = 0 }, message = "The square has fallen" },
]
on_exit = [
    { action = "EmitEvent", event = "EventGrayoutEnd", reconcile = true },
]
transitions = [
    { trigger = "Tick", target = "Reset", guard = "StateTimeExceeds", guard_args = { ms = 4000 } },
]

[states.Reset]
parent = "Root"
on_enter = [{ action = "EmitEvent", event = "EventGameResetRequest" }]

# --- Player: a slot with no cursor, whose keys are its only input ---

[states.PlayerBoot]
parent = "Root"
on_enter = [{ action = "EmitEvent", event = "EventCursorSpawnRequest" }]
transitions = [
    { trigger = "EventCursorSpawned", target = "PlayerActive" },
    { trigger = "EventCursorSpawnFailed", target = "PlayerBootRetry" },
]

[states.PlayerBootRetry]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "PlayerBoot", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

[states.PlayerActive]
parent = "Root"
