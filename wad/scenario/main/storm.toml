# Storm region: escalation to the Kraken maze

[states.StormHold]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventDrainPause", reconcile = true },
]
on_exit = [
    { action = "EmitEvent", event = "EventDrainResume", reconcile = true },
]

[states.StormSetup]
parent = "StormHold"
on_enter = [
    { action = "EmitEvent", event = "EventStormSpawnRequest" },
]
transitions = [
    { trigger = "EventSpeciesCreated", target = "StormActive", guard = "PayloadIntCompare", guard_args = { field = "species", op = "eq", value = 4 } },
    # An installed state never runs the on_enter above, so liveness rather than the
    # creation event admits a receiver whose FSM was corrected into this region.
    { trigger = "Tick", target = "StormActive", guard = "And", guard_args = { guards = [
        { name = "StateTimeExceeds", args = { ms = 500 } },
        { name = "StatusBoolEquals", args = { key = "storm.active", value = true } },
    ] } },
    # The request was refused: ask again instead of falling through StormActive's
    # defensive timeout, which retires the region as if the storm had been fought.
    { trigger = "Tick", target = "StormSetupRetry", guard = "StateTimeExceeds", guard_args = { ms = 500 } },
]

[states.StormSetupRetry]
parent = "StormHold"
transitions = [
    { trigger = "Tick", target = "StormSetup", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

[states.StormActive]
parent = "StormHold"
transitions = [
    { trigger = "EventSpeciesKilled", target = "StormDecision", guard = "PayloadIntCompare", guard_args = { field = "species", op = "eq", value = 4 } },
    # Defensive: storm died OOB without emitting a species kill event
    { trigger = "Tick", target = "StormVictory", guard = "And", guard_args = { guards = [
        { name = "StateTimeExceeds", args = { ms = 2000 } },
        { name = "StatusBoolEquals", args = { key = "storm.active", value = false } },
    ] } },
]

[states.StormDecision]
parent = "StormHold"
on_enter = [
    { action = "EmitEvent", event = "EventCycleDamageMultiplierIncrease" },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "SPECIES DAMAGE INCREASED" } },
]
transitions = [
    { trigger = "Tick", target = "StormEscalateKrakenOne", guard = "StatusIntCompare", guard_args = { key = "kills.swarm", op = "gte", value = 20 } },
    { trigger = "Tick", target = "StormEscalateKrakenTwo", guard = "StatusIntCompare", guard_args = { key = "kills.storm", op = "gte", value = 3 } },
    { trigger = "Tick", target = "StormVictory" },
]

[states.StormEscalateKrakenOne]
parent = "Root"
on_enter = [
    { action = "ResetStatusInt", payload = { key = "kills.swarm" } },
    { action = "EmitEvent", event = "EventStormCancelRequest" },
    { action = "SpawnRegion", region = "kraken", initial_state = "KrakenSetup" },
    { action = "TerminateRegion", region = "storm" },
]

[states.StormEscalateKrakenTwo]
parent = "Root"
on_enter = [
    { action = "ResetStatusInt", payload = { key = "kills.storm" } },
    { action = "EmitEvent", event = "EventStormCancelRequest" },
    { action = "SpawnRegion", region = "kraken", initial_state = "KrakenSetup" },
    { action = "TerminateRegion", region = "storm" },
]

[states.StormVictory]
parent = "Root"
on_enter = [
    { action = "ResumeRegion", region = "main" },
    { action = "TerminateRegion", region = "storm" },
]
