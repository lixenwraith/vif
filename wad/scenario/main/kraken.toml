# Kraken maze: use charges to clear passages, then defeat two Krakens to reach Tower.

[states.KrakenHold]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventDrainPause", reconcile = true },
]
on_exit = [
    { action = "EmitEvent", event = "EventKrakenCancelRequest" },
    { action = "EmitEvent", event = "EventDrainResume", reconcile = true },
]

[states.KrakenSetup]
parent = "KrakenHold"
on_enter = [
    { action = "EmitEvent", event = "EventGoldCancel" },
    { action = "EmitEvent", event = "EventWallDespawnAll" },
    { action = "ConfigToVar", payload = { field = "viewport_width", name = "vw" } },
    { action = "ConfigToVar", payload = { field = "viewport_height", name = "vh" } },
    { action = "EmitEvent", event = "EventLevelSetup", payload = { width = 0, height = 0, clear_entities = true, crop_on_resize = false }, payload_vars = { Width = "vw", Height = "vh" } },
    { action = "EmitEvent", event = "EventMazeSpawnRequest", payload = { cell_width = 5, cell_height = 3, braiding = 0.5, room_count = 0, block_mask = 255, visual = { box_style = 1, fg_color = { r = 200, g = 200, b = 200 }, render_fg = true, bg_color = { r = 40, g = 40, b = 45 }, render_bg = true } } },
    { action = "EmitEvent", event = "EventWallPushCheckRequest" },
    { action = "ResetStatusInt", payload = { key = "kills.kraken" } },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "LURE KRAKEN THROUGH THE MAZE" } },
]
transitions = [
    # Let level setup and maze construction settle before placing Kraken at map center.
    { trigger = "Tick", target = "KrakenSpawn" },
]

[states.KrakenSpawn]
parent = "KrakenHold"
on_enter = [
    { action = "EmitEvent", event = "EventKrakenSpawnRequest" },
]
transitions = [
    { trigger = "EventSpeciesCreated", target = "KrakenActive", guard = "PayloadIntCompare", guard_args = { field = "species", op = "eq", value = 9 } },
    { trigger = "EventKrakenSpawnFailed", target = "KrakenWait" },
]

[states.KrakenActive]
parent = "KrakenHold"
transitions = [
    { trigger = "EventSpeciesKilled", target = "KrakenDecision", guard = "PayloadIntCompare", guard_args = { field = "species", op = "eq", value = 9 } },
]

[states.KrakenDecision]
parent = "KrakenHold"
transitions = [
    { trigger = "Tick", target = "KrakenEscalateTower", guard = "StatusIntCompare", guard_args = { key = "kills.kraken", op = "gte", value = 2 } },
    { trigger = "Tick", target = "KrakenWait" },
]

[states.KrakenWait]
parent = "KrakenHold"
transitions = [
    { trigger = "Tick", target = "KrakenSpawn", guard = "StateTimeExceeds", guard_args = { ms = 3000 } },
]

[states.KrakenEscalateTower]
parent = "Root"
on_enter = [
    { action = "ResetStatusInt", payload = { key = "kills.kraken" } },
    { action = "SpawnRegion", region = "tower", initial_state = "TowerSetup" },
    { action = "TerminateRegion", region = "kraken" },
]
