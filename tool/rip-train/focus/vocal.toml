# Voices a corpus draws from when the music has vocals: a voice is a line like
# any other to the rip, pitch and onsets per frame, never words. A sung line
# is a slightly chorused saw through the formants of a vowel with a vibrato
# that comes in after the onset; a choir pad is wider, slower and on another
# vowel; both beside the shipped lead and bass. Edit, add, or make your own
# with soundlab's `new voice` and `set`, then `apply`; the vowel is a, e, i, o
# or u and the vibrato a rate, a depth in cents and a delay.

[[voice]]
name = "vocal"
desc = "a sung line: a chorused saw through an 'a' with a vibrato coming in, held"
wave = "saw"
unison = 2
detune = 1.004
vowel = "a"
vibrato_hz = 5.5
vibrato_cents = 35
vibrato_delay = 0.25
cutoff = 2400
key_track = 4
q = 0.4
attack = 0.03
decay = 0.2
sustain = 0.85
release = 0.15
level = 0.7

[[voice]]
name = "choir"
desc = "voices in unison: a wide chorused saw on an 'o', slower still, as a pad behind a lead"
wave = "saw"
unison = 3
detune = 1.007
vowel = "o"
vibrato_hz = 4.5
vibrato_cents = 25
vibrato_delay = 0.4
cutoff = 2000
key_track = 3
q = 0.3
attack = 0.08
decay = 0.3
sustain = 0.9
release = 0.3
level = 0.6
