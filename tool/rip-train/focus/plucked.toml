# Voices for plucked and struck instruments: the shipped piano is modal; these
# add a nylon string, a steel one and a plucked bass, so a corpus leans toward
# guitars and keys. Edit or add with soundlab's `new voice` and `set`.

[[voice]]
name = "nylon"
desc = "a nylon string: dull, dying in a second"
wave = "string"
bright = 0.25
ring = 1.1
cutoff = 2200
q = 0.4
attack = 0.002
sustain = 1
release = 0.12
level = 0.8

[[voice]]
