name: Release

# The schedule moves the nightly prerelease; a v* tag drafts a stable release that
# a person publishes. Both build the same archives and the Android APK.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Each job asks for what it writes; the token can do nothing else.
permissions: {}

jobs:
  artifacts:
    name: Build downloadable artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Refresh generated registries
        shell: bash
        run: |
          go generate ./internal/manifest
          # A release's binaries must be what its source archive builds.
          if [ "$GITHUB_REF_TYPE" = tag ]; then git diff --exit-code; fi

      # A build that fails its tests publishes nothing: the test workflow ran on a
      # push, and the schedule builds whatever main holds by night.
      - name: Vet and test
        run: go vet ./... && go test ./...

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          label=nightly
          if [ "$GITHUB_REF_TYPE" = tag ]; then label=${GITHUB_REF_NAME#v}; fi
          p="vif-$label"
          targets="linux-amd64 linux-arm64 linux-amd64-headless freebsd-amd64 windows-amd64 web"
          for target in $targets; do mkdir -p "stage/$p-$target"; done
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags='-s -w' -o "stage/$p-linux-amd64/vif" ./cmd/vif
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags='-s -w' -o "stage/$p-linux-arm64/vif" ./cmd/vif
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -tags=vif_headless -ldflags='-s -w' \
            -o "stage/$p-linux-amd64-headless/vif" ./cmd/vif
          # purego's fakecgo builds as std on FreeBSD to link without cgo (make GUI_GCFLAGS).
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
            go build -trimpath -gcflags=github.com/ebitengine/purego/internal/fakecgo=-std \
            -ldflags='-s -w' -o "stage/$p-freebsd-amd64/vif" ./cmd/vif
          # Experimental, with make windows's tags; doc/multi-platform.md §4 has its known issues.
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -tags='novlog vif_noaudio' -ldflags='-s -w' \
            -o "stage/$p-windows-amd64/vif.exe" ./cmd/vif
          GOOS=js GOARCH=wasm \
            go build -trimpath -ldflags='-s -w' \
            -o "stage/$p-web/vif.wasm" ./cmd/vif

          # Each archive's README is written for its platform, not the repository's.
          for target in $targets; do
            make -s release-readme RELEASE_TARGET="$target" RELEASE_LABEL="$label" >"stage/$p-$target/README.md"
            cp LICENSE "stage/$p-$target/"
          done
          # The client binaries link purego for the desktop window.
          for target in linux-amd64 linux-arm64 freebsd-amd64; do
            cp deploy/package/LICENSE.purego "stage/$p-$target/"
          done
          cp -R web/. "stage/$p-web/"
          # The loader of the Go that built vif.wasm above, not the committed copy.
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" "stage/$p-web/"

          # Each archive unpacks into one directory named for it, and root extracting
          # one gets root's files rather than the runner's uid.
          for target in linux-amd64 linux-arm64 linux-amd64-headless freebsd-amd64 web; do
            tar -C stage --owner=0 --group=0 --numeric-owner \
              -czf "dist/$p-$target.tar.gz" "$p-$target"
          done
          (cd stage && zip -qrX "../dist/$p-windows-amd64.zip" "$p-windows-amd64")

          # One archive rather than a copy in each target's: the wad is the same
          # bytes on every platform. The Makefile owns what is in it, so the
          # release and make install-config cannot drift; it unpacks as vif/.
          make wad-archive WAD_ARCHIVE="dist/$p-wad.tar.gz"

          # The source archive distributions build from. It is uploaded once, so
          # its bytes and checksum never change the way GitHub's generated ones may.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git archive --format=tar.gz --prefix="vif-$label/" \
              -o "dist/vif-$label.tar.gz" "$GITHUB_REF_NAME"
          fi

      - name: Upload release payload
        uses: actions/upload-artifact@v6
        with:
          name: release-payload
          path: dist/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build the Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            android/go.sum

      # gomobile compiles the binding with the javac on PATH; Gradle builds on a
      # JDK 21 it fetches itself.
      - name: Set up the JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The runner's SDK has a sdkmanager and its licences accepted; the platform
      # and NDK the build names are installed as make android-toolchain installs them.
      - name: Install the SDK platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          platform=$(sed -n 's/^ *compileSdkVersion("\(.*\)")$/\1/p' android/app/build.gradle.kts)
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"$/\1/p' android/app/build.gradle.kts)
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes dies of SIGPIPE once sdkmanager stops reading, which pipefail would count
          { yes || true; } | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" "platforms;$platform" "ndk;$ndk"

      # The keystore secrets sign a release; without them the repository's debug key
      # does, which a local make android shares, so either installs over the other.
      - name: Build the APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VIF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VIF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          label=nightly
          if [ "$GITHUB_REF_TYPE" = tag ]; then label=${GITHUB_REF_NAME#v}; fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export VIF_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          # The run number climbs across nightlies and tags alike, so a device takes
          # each build as an update of the one before it.
          android/toolchain.sh gradlew assembleRelease \
            -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="$label+${GITHUB_SHA::7}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/vif-$label-android.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: release-payload-android
          path: dist/
          if-no-files-found: error
          retention-days: 14

  image:
    name: Publish headless container
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push headless image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=nightly
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      # Every version but the newest, which this run pushed, through the REST
      # packages API (GraphQL has no container packages); a cleanup that fails costs
      # nothing but registry space, never the nightly.
      - name: Clean up old container images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          owner=$GITHUB_REPOSITORY_OWNER
          base=/users/$owner
          if [ "$(gh api "/users/$owner" --jq .type)" = Organization ]; then base=/orgs/$owner; fi
          gh api --paginate --slurp "$base/packages/container/vif/versions?per_page=100" \
            --jq 'add | sort_by(.created_at) | reverse | .[1:][] | .id' |
            while read -r id; do
              gh api -X DELETE "$base/packages/container/vif/versions/$id" && echo "deleted $id"
            done

  release:
    name: Publish release assets
    needs: [artifacts, android, image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release payload
        uses: actions/download-artifact@v7
        with:
          pattern: release-payload*
          merge-multiple: true
          path: dist

      # Over every asset, the APK included, so one file vouches for the release.
      - name: Sum the assets
        run: cd dist && sha256sum vif-* > SHA256SUMS

      # A version with a suffix (v0.1.0-rc.1) is a pre-release and says so; only a
      # plain vX.Y.Z drafts a final release.
      - name: Draft the tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          flags=(--draft --verify-tag)
          notes="Built from ${GITHUB_SHA}. vif-$version.tar.gz is the source archive; SHA256SUMS covers every asset. The Linux and FreeBSD binaries play in a terminal or, with -g, a desktop window; the Linux ones need glibc, and each archive's README.md says how to start it. The Android APK installs over a nightly or a local debug build (android/README.md). The windows-amd64 zip is experimental: it plays in a terminal, without mouse or sound."
          case $version in
          *-*)
            flags+=(--prerelease)
            notes="Pre-release, not a final release. $notes"
            ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            --title "vif $GITHUB_REF_NAME" --notes "$notes"

      - name: Move nightly tag and publish assets
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --force nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

          title='Nightly development build (not a release)'
          notes="Not a release: an automated development build of ${GITHUB_SHA}, replaced every night. Flags, files and formats may change without notice. The Linux and FreeBSD binaries play in a terminal or, with -g, a desktop window, the Linux ones on glibc, and each archive's README.md says how to start it; the Linux server archive and GHCR image use the vif_headless profile. The Android APK (Android 11 and newer, arm64 and x86_64) is signed with the repository's debug key and installs over the night before; the windows-amd64 zip is experimental: it plays in a terminal, without mouse or sound."
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            # The release carries exactly this build, not a renamed or dropped asset.
            gh release view nightly --json assets --jq '.assets[].name' |
              while read -r asset; do
                [ -e "dist/$asset" ] || gh release delete-asset nightly "$asset" --yes
              done
            gh release edit nightly --title "$title" --notes "$notes" --prerelease
          else
            gh release create nightly dist/* --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" --prerelease
          fi
