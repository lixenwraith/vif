name: Test with Race Detection

on:
  push:
    branches: [ main, master, develop, 'claude/*' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Build and Test on Go 1.27.2
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.2'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Vet code
      run: go vet ./...

    - name: Build code
      run: go build ./...

    - name: Test the desktop window package
      run: CGO_ENABLED=0 go test ./pkg/window

    - name: Vet and test the Android host module
      working-directory: android
      run: go vet ./... && go test ./...

    - name: Run tests with race detector
      run: go test -race -v ./...
      env:
        # Halt immediately on race condition and output logs to files prefixed with "race"
        GORACE: "halt_on_error=1 log_path=race"

    - name: Upload race detector logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: race-detector-logs
        path: race.*
        retention-days: 7
