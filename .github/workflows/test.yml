name: Test with Race Detection

on:
  push:
    branches: [ main, master, develop, 'claude/*' ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # pipefail: a test step filtered to its failures keeps go test's status

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          android/go.sum

    - name: Download dependencies
      run: go mod download

    - name: Vet code
      run: go vet ./...

    - name: Build code
      run: go build ./...

    # The profiles and targets the release builds, so a tag breaks here and not
    # by night; purego's fakecgo builds as std on FreeBSD (make GUI_GCFLAGS).
    - name: Build the other profiles
      run: |
        go build -tags novlog ./...
        go build -tags vif_noaudio ./...
        go build -tags vif_headless ./...
        go build -tags vif_nogui ./...
        CGO_ENABLED=0 go build -o /dev/null ./cmd/vif
        CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -gcflags=github.com/ebitengine/purego/internal/fakecgo=-std -o /dev/null ./cmd/vif
        GOOS=js GOARCH=wasm go build ./...
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags 'novlog vif_noaudio' ./...

    # A passing package says nothing: the log keeps a failure's output, what a step
    # prints on its own and the race detector's reports.
    - name: Test the desktop window package
      run: CGO_ENABLED=0 go test ./pkg/window 2>&1 | { grep -Ev '^(ok|\?) ' || true; }

    # js/wasm caps a program's argv and environment together at 8 KiB, which a
    # runner's environment passes, so these run under Node with almost none of it.
    - name: Test the browser build
      run: |
        wasm_exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec"
        env -i PATH="$PATH" HOME="$HOME" GOOS=js GOARCH=wasm go test -exec="$wasm_exec" ./pkg/browser 2>&1 | { grep -Ev '^(ok|\?) ' || true; }
        env -i PATH="$PATH" HOME="$HOME" GOOS=js GOARCH=wasm go test -exec="$wasm_exec" -run Browser ./pkg/network 2>&1 | { grep -Ev '^(ok|\?) ' || true; }

    - name: Vet and test the Android host module
      working-directory: android
      run: go vet ./... && go test ./... 2>&1 | { grep -Ev '^(ok|\?) ' || true; }

    - name: Run tests with race detector
      run: go test -race ./... 2>&1 | { grep -Ev '^(ok|\?) ' || true; }
      env:
        # Halt immediately on race condition and output logs to files prefixed with "race"
        GORACE: "halt_on_error=1 log_path=race"

    - name: Upload race detector logs on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: race-detector-logs
        path: race.*
        retention-days: 7
