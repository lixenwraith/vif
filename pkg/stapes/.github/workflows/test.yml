name: Test

on:
  push:
    branches: [ main, 'claude/*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Vet, test and build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Vet code
      run: go vet ./...

    - name: gofmt -l
      run: out=$(gofmt -l .); [ -z "$out" ] || { echo "$out"; exit 1; }

    - name: Run tests with race detector
      # The suite renders and hears music; under the detector on a busy runner it
      # nears go test's ten-minute default.
      run: go test -race -timeout 20m ./...
      env:
        # Halt on the first race; its report prints beside the failing package.
        GORACE: "halt_on_error=1"

    - name: Build for FreeBSD and Android
      run: |
        CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build ./...
        CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./...
