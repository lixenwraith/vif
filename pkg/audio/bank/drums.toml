length = 0.35
source = { kind = "sweep", wave = "sine", freq = 150, freq_end = 140, curve = "exp", curve_k = 26.25 }
chain = [{ kind = "decay", tau = 0.05, vel_track = 0.65 }]
[[sound.layer]]
gain = 0.8
stroke = -0.08
source = { kind = "sweep", wave = "sine", freq = 228, freq_end = 215, curve = "exp", curve_k = 30, vel_track = 0.1 }
chain = [{ kind = "decay", tau = 0.065, vel_track = 0.65 }]
# (1,1), (2,1) and (0,2), louder off the centre
[[sound.layer]]
gain = 0.4
stroke = 0.25
length = 0.35
source = { kind = "osc", wave = "sine", freq = 352 }
chain = [{ kind = "decay", tau = 0.05, vel_track = 0.4 }]
[[sound.layer]]
gain = 0.28
stroke = 0.3
length = 0.25
source = { kind = "osc", wave = "sine", freq = 462 }
chain = [{ kind = "decay", tau = 0.035, vel_track = 0.4 }]
[[sound.layer]]
gain = 0.2
stroke = 0.2
length = 0.21
source = { kind = "osc", wave = "sine", freq = 540 }
chain = [{ kind = "decay", tau = 0.03, vel_track = 0.4 }]
# the stick's crack, brighter the harder it lands
[[sound.layer]]
gain = 0.45
vel_gain = 0.8
length = 0.008
source = { kind = "noise" }
chain = [{ kind = "decay", tau = 0.0012 }, { kind = "bp", freq = 4000, q = 0.7, vel_track = 0.7 }]
# the wires: a buzz blooming a few ms after the stick, then their sizzle
[[sound.layer]]
gain = 0.45
offset = 0.002
stroke = 0.08
source = { kind = "noise" }
chain = [
  { kind = "decay", attack = 0.004, tau = 0.06, vel_track = 0.3 },
  { kind = "hp", freq = 1800, q = 0.707 },
  { kind = "lp", freq = 6000, q = 0.707, vel_track = 0.3, stroke = 0.1 }
