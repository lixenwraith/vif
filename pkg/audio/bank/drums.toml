# Percussion. Names bind to InstrumentType in kit.go; overriding "kick" in user
# TOML replaces the kit piece. Each piece is rendered once per velocity layer
# (velocities), six strokes a layer: a hit plays the stroke of the layer nearest
# its velocity at its velocity's level, so a harder hit is brighter as well as
# louder. vel_gain, vel_track and stroke say how a part follows the velocity and
# where on the head a stroke lands. Figures against recordings: doc/audio.md §7.

[[sound]]
name = "kick"
desc = "a damped kick: the head's fundamental falling as its tension settles, its upper modes, the beater's felt"
duration = 0.5
norm = 0.95
variants = 6
velocities = [0.35, 0.65, 1.0]
pitch_walk = 0.02
length_walk = 0.06
chain = [{ kind = "shape", drive = 1.2, vel_track = 0.8 }]
# the (0,1) mode: a fast fall, then the shell's longer ring; a harder stroke starts higher
[[sound.layer]]
length = 0.22
source = { kind = "sweep", wave = "sine", freq = 92, freq_end = 52, curve = "exp", curve_k = 13.2, vel_track = 0.4 }
chain = [{ kind = "decay", attack = 0.0015, tau = 0.028 }]
[[sound.layer]]
gain = 0.14
source = { kind = "sweep", wave = "sine", freq = 92, freq_end = 52, curve = "exp", curve_k = 30, vel_track = 0.4 }
chain = [{ kind = "decay", attack = 0.0015, tau = 0.11 }]
# the upper modes, louder for a harder stroke or one off the centre
[[sound.layer]]
gain = 0.5
vel_gain = 0.6
stroke = 0.08
length = 0.32
source = { kind = "sweep", wave = "sine", freq = 190, freq_end = 142, curve = "exp", curve_k = 19.2, vel_track = 0.3 }
chain = [{ kind = "decay", attack = 0.001, tau = 0.045 }]
[[sound.layer]]
gain = 0.4
vel_gain = 0.9
stroke = 0.1
length = 0.25
source = { kind = "sweep", wave = "sine", freq = 300, freq_end = 228, curve = "exp", curve_k = 15, vel_track = 0.3 }
chain = [{ kind = "decay", attack = 0.001, tau = 0.035 }]
# the beater: a pulse that shortens, so brightens, as it lands harder, and the felt's slap
[[sound.layer]]
gain = 2.0
vel_gain = 0.6
length = 0.012
source = { kind = "osc", wave = "sine", freq = 2000, vel_track = 0.8 }
chain = [{ kind = "decay", attack = 0.0002, tau = 0.0009, vel_track = 0.4 }]
[[sound.layer]]
gain = 4.0
vel_gain = 1.0
length = 0.012
source = { kind = "noise" }
chain = [
  { kind = "decay", tau = 0.002 },
  { kind = "lp", freq = 9000, q = 0.707, vel_track = 1.0 },
  { kind = "hp", freq = 2000, q = 0.707 }
]

[[sound]]
name = "snare"
desc = "a wood snare: the heads' modes under the stick and the wires; a soft stroke rings shorter"
duration = 0.4
norm = 0.74
