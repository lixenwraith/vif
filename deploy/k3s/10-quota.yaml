# The fleet ceiling.
#
# Twelve concurrent sessions, the router's two standing ones among them, is the
# deployment's stated maximum, and it is enforced here rather than in the router
# alone. A router holds the ceiling as a number it believes; a quota holds it as a
# number the API server refuses to exceed, which is what survives a router that
# crashed mid-loop, restarted with stale state, or was asked for a thirteenth
# session by a website nobody rate-limited.
#
# The compute totals are ten sessions' envelopes without bots and the two standing
# sessions' with theirs, rounded up (doc/kubernetes-fleet.md §6): the game
# container, since the config-check init container counts only against its own
# peak. They are a second ceiling on the same fact: the fleet cannot exceed the
# memory the node was sized for, whatever a mis-rendered manifest asks for.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vif-fleet-ceiling
  namespace: vif
spec:
  hard:
    count/pods: "12"
    count/jobs.batch: "12"
    # One Service per session, plus headroom for a fixed one an operator adds.
    count/services: "14"
    requests.cpu: 1500m
    requests.memory: 1280Mi
    limits.cpu: 6500m
    limits.memory: 6144Mi
    # Two shared local claims: the volatile log tmpfs every session writes through,
    # and the read-only scenario volume they all mount. Neither is per-session
    # persistence; the node's own tmpfs and directory are the hard capacity.
    persistentvolumeclaims: "2"
    requests.storage: 264Mi
---
# The default a session inherits if its manifest omits one. A pod with no request
# is scheduled as if it were free and counts nothing against the quota above, which
# is the one way ten sessions can still overcommit the node.
apiVersion: v1
kind: LimitRange
metadata:
  name: vif-session-defaults
  namespace: vif
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 480Mi
      defaultRequest:
        cpu: 100m
        memory: 96Mi
      max:
        cpu: "1"
        memory: 672Mi
