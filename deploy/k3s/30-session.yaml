# One allocated session: one Job, one pod, one Service.
#
# This is a template, not an object to apply as it stands. The allocator renders
# the placeholders below and creates the result; deploy/k3s/render-session.sh does
# the same thing from a shell for a manual test.
#
#   ${SESSION_ID}      a short, unique, DNS-safe session name (e.g. 7f3c1a)
#   ${IMAGE}           the image, pinned by digest in anything but a lab
#   ${GAME_NODEPORT}   the node port this session is directly reachable on (31700-31709)
#   ${JOB_UID}         the created Job UID used to own the Service
#   ${PLAYERS}         the guest ceiling for this session (1-16)
#   ${MAP_SIZE}        the shared map geometry, WxH (e.g. 120x40)
#   ${SCENARIO}        the installed scenario name to serve (e.g. main)
#   ${LOG_LEVEL}       the session log level (trace..error; the allocator picks it)
#   ${FIRST_JOIN}      the first-guest deadline (normally 90s)
#   ${EMPTY_GRACE}     the empty-roster grace (normally 90s)
#
# Why a Job rather than a Deployment: an allocated session is a thing that ends.
# It ends when nobody claimed it, when everybody left, or when it was asked to go,
# and in every case the process exits zero and the match is over — the world was in
# memory and no replacement pod inherits it. A Deployment would restart it into a
# session nobody is in; a Job records that it completed and lets the TTL controller
# remove the object.
apiVersion: batch/v1
kind: Job
metadata:
  name: vif-session-${SESSION_ID}
  namespace: vif
  labels: &labels
    app.kubernetes.io/name: vif
    app.kubernetes.io/component: session
    app.kubernetes.io/part-of: vif-fleet
    vif.lixenwraith.dev/session: "${SESSION_ID}"
spec:
  # A session is not retryable. Its world is gone with the process, and a second
  # attempt would be an empty session holding a port players were told to dial.
  backoffLimit: 0
  completions: 1
  parallelism: 1
  # The absolute ceiling, well above any real match. The application's own bounds
  # (-first-join, -empty) end an idle session in ninety seconds; this ends one that
  # is somehow neither idle nor finished, which is the shape a wedged or abused
  # session takes.
  activeDeadlineSeconds: 14400
  # Long enough for an allocator or an operator to read why the session ended,
  # short enough that finished objects do not accumulate against count/jobs.
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels: *labels
    spec:
      restartPolicy: Never
      serviceAccountName: vif-session
      automountServiceAccountToken: false
      # No Service environment variables: the process is told everything it needs
      # on its command line, and injecting the address of every Service in the
      # namespace tells a session about its neighbours for no reason.
      enableServiceLinks: false
      # Above the -drain value below, so the drain decides when the session ends
      # and the kubelet's SIGKILL is the backstop it never reaches.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The same binary validating the same configuration it is about to serve,
        # before anything binds a port. A scenario that does not load is a session
        # that would have accepted players and then failed; this turns it into a
        # pod that never became ready.
        - name: config-check
          image: "${IMAGE}"
          imagePullPolicy: IfNotPresent
          # The configuration this session will actually serve, not the embedded
          # one it used to prove instead. A scenario missing from the node volume,
          # or one naming a system this build does not have, is now a pod that
          # never became ready rather than a session that accepted players first.
          args: ["-check", "-config-dir", "/wad", "-s", "${SCENARIO}"]
          volumeMounts:
            # The categories the fleet serves, by subPath. content/ is not one:
            # glyphs are player domain, read on each player's own machine.
            - name: fleet-wad
              mountPath: /wad/scenario
              subPath: scenario
              readOnly: true
            - name: fleet-wad
              mountPath: /wad/image
              subPath: image
              readOnly: true
          securityContext: &container_security
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
      containers:
        - name: session
          image: "${IMAGE}"
          imagePullPolicy: IfNotPresent
          args:
            - "-serve"
            - ":7777"
            - "-probe"
            - ":7778"
            # The name every route carries: the allocator's front door places a
            # player by it, and this session refuses a link that named another, so
            # a reused NodePort or a stale link is a refusal rather than a seat in a
            # stranger's match. See doc/kubernetes-fleet.md §9.
            - "-name"
            - "${SESSION_ID}"
            # Stated rather than inherited from the -serve default: losing this pod
            # ends the match. The Job never replaces its in-memory world, and guests
            # must not elect a private continuation that looks like the old session.
            - "-authority"
            - "host"
            # The local PVC is backed by the node's capped tmpfs. The session ID
            # selects this process's filename and tags every application record.
            - "-l=/var/log/vif-fleet"
            - "-log-session-id=${SESSION_ID}"
            - "-lv"
            - "${LOG_LEVEL}"
            - "-ls"
            - "all+dispatch"
            # The scenario comes off the node's read-only volume; the corpus is
            # embedded and unused, because a dedicated host spawns no glyphs and
            # each player reads their own text. -config-dir is explicit rather than
            # relying on the XDG default: a scratch image has no /etc/xdg and no
            # reason to acquire one.
            - "-config-dir"
            - "/wad"
            - "-s"
            - "${SCENARIO}"
            - "-size"
            - "${MAP_SIZE}"
            - "-players"
            - "${PLAYERS}"
            # The allocated lifetime. The first is the window the player who
            # triggered this container has to arrive; the second is how long the
            # session survives after the last of them leaves, which is also the
            # window a player who dropped has to dial back into their own slot.
            - "-first-join"
            - "${FIRST_JOIN}"
            - "-empty"
            - "${EMPTY_GRACE}"
            # A termination signal stops admitting and waits this long for the
            # roster to empty before exiting anyway. Kept under the grace period
            # above so the process, not the kubelet, decides when the match ends.
            - "-drain"
            - "20s"
          ports:
            - name: game
              containerPort: 7777
              protocol: TCP
            - name: probe
              containerPort: 7778
              protocol: TCP
          # Deployment state, never request state. A caller chooses from what the
          # allocator advertises and nothing else; this is where an operator puts a
          # GODEBUG or a locale for the whole fleet. Optional, so an absent map is
          # not a pod that will not start.
          envFrom:
            - configMapRef:
                name: vif-session-env
                optional: true
          env:
            # An earlier collection target than the memory limit, so the runtime
            # collects instead of the kernel killing. GOMAXPROCS is deliberately
            # unset: the Go runtime derives it from the cgroup CPU limit.
            #
            # After envFrom, so it wins: the fleet's own envelope is not something
            # a ConfigMap should be able to move out from under the memory limit.
            - name: GOMEMLIMIT
              value: "160MiB"
          securityContext: *container_security
          volumeMounts:
            - name: fleet-logs
              mountPath: /var/log/vif-fleet
            - name: fleet-wad
              mountPath: /wad/scenario
              subPath: scenario
              readOnly: true
            - name: fleet-wad
              mountPath: /wad/image
              subPath: image
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
          # There is one health path, and its code answers one question: should
          # this process still be running. Startup suppresses liveness while the
          # world is being built, so a slow start is not a restart loop.
          startupProbe:
            httpGet: {path: /health, port: probe}
            periodSeconds: 2
            failureThreshold: 30
          # The health status is liveness. A vacant session deliberately has a
          # stopped tick and still answers 200 while its empty grace runs.
          livenessProbe:
            httpGet: {path: /health, port: probe}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # No readiness probe, deliberately. Readiness would take the pod out of a
          # Service, and this Service has exactly one backend that the allocator
          # chose on purpose — removing it would break the session rather than
          # reroute it. The application refuses a dial at the handshake; the
          # allocator reads the same answer from the health body's `ready` and
          # `phase` fields when choosing where to send the next player.
      volumes:
        # This claim exposes only the node-affine, tmpfs-backed local PV. The pod
        # remains Restricted and never mounts a direct hostPath.
        - name: fleet-logs
          persistentVolumeClaim:
            claimName: vif-fleet-logs
        # Read-only here as well as at each mount: the claim is ReadOnlyMany and a
        # session has no business writing what every other session is reading.
        - name: fleet-wad
          persistentVolumeClaim:
            claimName: vif-fleet-wad
            readOnly: true
---
# The session's endpoint.
#
# One Service per session, not one Service in front of many: players joining the
# same match must reach the same process, and an ordinary load-balanced Service
# over several session pods would scatter them across unrelated worlds.
#
# The probe and WebSocket ports are deliberately absent. Both stay reachable inside
# the cluster through the pod IP — the kubelet and Prometheus find the first, the
# node's allocator finds the second — and nothing outside the node can route to
# either. The browser path publishes no second NodePort by design.
apiVersion: v1
kind: Service
metadata:
  name: vif-session-${SESSION_ID}
  namespace: vif
  # Repeated rather than aliased: a YAML anchor does not cross a document
  # boundary, and an alias that resolves to nothing is a Service with no labels.
  labels:
    app.kubernetes.io/name: vif
    app.kubernetes.io/component: session
    app.kubernetes.io/part-of: vif-fleet
    vif.lixenwraith.dev/session: "${SESSION_ID}"
  # Set by the allocator to the Job's UID, so deleting the Job removes this with
  # it. A Service that outlived its session would hold a node port against the
  # quota and advertise a match that no longer exists.
  ownerReferences:
    - apiVersion: batch/v1
      kind: Job
      name: vif-session-${SESSION_ID}
      uid: "${JOB_UID}"
      controller: true
      blockOwnerDeletion: true
spec:
  type: NodePort
  selector:
    vif.lixenwraith.dev/session: "${SESSION_ID}"
  # No SNAT on the way in, so the pod sees the player's address rather than the
  # node's. That is what the per-address admission limiter is keyed on, and with
  # one pod behind this Service it is the whole of what the setting buys.
  externalTrafficPolicy: Local
  ports:
    - name: game
      port: 7777
      targetPort: game
      nodePort: ${GAME_NODEPORT}
      protocol: TCP
