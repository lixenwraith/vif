# What a session pod may talk to, and what may talk to it. K3s enforces these through
# its bundled kube-router controller unless installed with --disable-network-policy;
# verify that, because an unenforced policy is a comment and this one is load bearing:
# every connected peer can influence the shared simulation, so a session pod is
# attack surface for whoever can reach the game port.
---
# Default deny, both directions, for everything in the namespace. Every allowance
# below is additive to this; anything not named is refused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: vif
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The game port, from the node alone: every player reaches a pod through the router,
# which dials it from the node's address on the pod network, flannel's cni0, the
# first address of the node's pod CIDR. The repository names no machine, so
# deploy/update.sh renders ${NODE_POD_ADDRESS} from the cluster. Who may play is
# then the router's question (doc/kubernetes-fleet.md §9), and no other pod's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-game-ingress
  namespace: vif
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vif
      app.kubernetes.io/component: session
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: ${NODE_POD_ADDRESS}/32
      ports:
        - protocol: TCP
          port: game
---
# The operator ports, from the monitoring namespace only. /health and /metrics
# describe the session's roster, tick and remaining lifetime: unauthenticated
# operational data that must not be reachable from the player-facing path. The
# kubelet's own probes bypass the pod network and are unaffected by this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-ports
  namespace: vif
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vif
      app.kubernetes.io/component: session
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: probe
# No egress allowance is defined, deliberately. A session binds two listeners and
# accepts; it resolves no name, dials nothing, and reads no external resource, so
# the default deny above costs it nothing. If a future feature does need to dial
# out, DNS to kube-system is the first rule to add — and adding it should be a
# decision somebody made, not a rule that was already there.
