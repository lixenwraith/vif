# What the website's router (tool/vif-router) may do: the verbs it needs to create,
# observe and remove a session, in one namespace. Read it as a limit: no Secret, no
# exec into a session, no other namespace, and no workload shape but the one the
# quota and Pod Security admission constrain. Compromised, it can churn ten sessions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vif-router
  namespace: vif
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vif-router
  namespace: vif
rules:
  # Create a session and delete it; list to reconcile after a restart.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "delete"]
  # Portable admission of a Service with blockOwnerDeletion requires permission
  # to protect its Job owner while foreground garbage collection is in progress.
  - apiGroups: ["batch"]
    resources: ["jobs/finalizers"]
    verbs: ["update"]
  # The endpoint players are given. Create and delete only — a Service that is
  # updated in place is a session whose address changed under its players.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "list", "delete"]
  # Read-only, by list: the router needs the pod's phase and readiness to answer
  # "is this session live", and needs nothing else about it. Notably absent:
  # pods/exec, pods/portforward, pods/attach, and any write verb.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # The Service is ready only when discovery publishes a ready endpoint.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
  # What the namespace's quota has left, so a session it has no room for is
  # refused as the fleet full, where its Job would be taken and never run.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vif-router
  namespace: vif
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vif-router
subjects:
  - kind: ServiceAccount
    name: vif-router
    namespace: vif
