# Temporary probe that binds both WaitForFirstConsumer claims on a fresh node.
# Render ${IMAGE} and ${SCENARIO}, apply it once, then delete the pod and its JSONL files.
# It mounts only the PVCs, never hostPath.
#
# One probe for both volumes because they bind for the same reason and a node with
# one of them is not commissioned: it writes a log record through the log claim and
# loads a scenario through the wad claim, which is exactly what a session does.
apiVersion: v1
kind: Pod
metadata:
  name: vif-log-volume-check
  namespace: vif
  labels:
    app.kubernetes.io/name: vif
    app.kubernetes.io/component: storage-check
    app.kubernetes.io/part-of: vif-fleet
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 30
  terminationGracePeriodSeconds: 10
  serviceAccountName: vif-session
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: writer
      image: "${IMAGE}"
      imagePullPolicy: IfNotPresent
      args:
        - "-serve"
        - ":7777"
        - "-probe"
        - ":7778"
        - "-authority"
        - "host"
        - "-l=/var/log/vif-fleet"
        - "-log-session-id=volume-check"
        - "-lv=info"
        - "-ls=all+dispatch"
        - "-config-dir=/wad"
        - "-s=${SCENARIO}"
        - "-first-join=5s"
        - "-empty=5s"
        - "-drain=5s"
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 192Mi}
      volumeMounts:
        - name: fleet-logs
          mountPath: /var/log/vif-fleet
        - name: fleet-wad
          mountPath: /wad/scenario
          subPath: scenario
          readOnly: true
        - name: fleet-wad
          mountPath: /wad/image
          subPath: image
          readOnly: true
  volumes:
    - name: fleet-logs
      persistentVolumeClaim:
        claimName: vif-fleet-logs
    - name: fleet-wad
      persistentVolumeClaim:
        claimName: vif-fleet-wad
        readOnly: true
