# What the website's allocator is allowed to do.
#
# The allocator is tool/vif-allocator: the component the website calls when a
# player asks for a game. These are exactly the verbs it needs to create, observe
# and remove a session, in one namespace, and nothing else.
#
# Read it as a limit rather than a grant. An allocator with this Role cannot read a
# Secret, cannot exec into a session, cannot touch another namespace, and cannot
# create a workload shape other than the one the quota and Pod Security admission
# already constrain. If the allocator is compromised, the worst it can do is churn
# ten sessions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vif-allocator
  namespace: vif
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vif-allocator
  namespace: vif
rules:
  # Create a session and delete it; list to reconcile after a restart.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "delete"]
  # Portable admission of a Service with blockOwnerDeletion requires permission
  # to protect its Job owner while foreground garbage collection is in progress.
  - apiGroups: ["batch"]
    resources: ["jobs/finalizers"]
    verbs: ["update"]
  # The endpoint players are given. Create and delete only — a Service that is
  # updated in place is a session whose address changed under its players.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "list", "delete"]
  # Read-only, by list: the allocator needs the pod's phase and readiness to answer
  # "is this session live", and needs nothing else about it. Notably absent:
  # pods/exec, pods/portforward, pods/attach, and any write verb.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # The Service is ready only when discovery publishes a ready endpoint.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vif-allocator
  namespace: vif
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vif-allocator
subjects:
  - kind: ServiceAccount
    name: vif-allocator
    namespace: vif
