#!/usr/bin/nft -f
# Guest filter for the K3s node: owns table inet vif only and never flushes the ruleset (doc/kube-docker-deploy.md §6).
# `deploy/update.sh filter` installs and loads it; the unit is a oneshot, and an ExecStop added to it runs right after every load.
include "/etc/nftables.d/vif-operator.nft"

# Create-then-delete makes every load, including the first, a replacement of this table alone.
table inet vif
delete table inet vif

table inet vif {
    chain input {
        # Run after kube-proxy's filter hook so an endpoint-less NodePort always
        # returns its REJECT instead of changing between refusal and timeout when
        # either ruleset is reloaded.
        type filter hook input priority filter + 10; policy drop;

        ct state { established, related } accept
        ct state invalid drop
        iif lo accept

        # Pods, flannel and the Docker build bridge reach node services.
        iifname { "cni0", "flannel.1", "docker0" } accept
        ip saddr { 10.42.0.0/16, 10.43.0.0/16 } accept

        ip protocol icmp accept

        # The allocator's front door, for players anywhere: the host forwards it
        # with their address intact, and the NodePort range needs no rule here.
        tcp dport 7777 accept

        # Operator access from the FreeBSD host; values come from the include.
        ip saddr $operator_addr tcp dport $operator_ports accept
    }

    chain forward {
        # NodePort traffic is DNATed before routing, so it is admitted here and never in input.
        type filter hook forward priority filter; policy accept;
    }
}
