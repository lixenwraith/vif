# Standalone node-local fleet reader. Session Jobs write complete, self-tagged
# JSONL records to the tmpfs-backed PVC; LogWisp relays those lines unchanged.
quiet = false
status_reporter = false
auto_reload = false

# LogWisp's own diagnostics stay in the host journal and never enter the public
# application stream.
[logging]
output = "stderr"
level = "warn"

[[pipelines]]
name = "fleet"

# With a raw file source, the entry message is the complete source line. The raw
# formatter preserves it for the HTTP sink instead of parsing or reserializing it.
[pipelines.flow.format]
type = "raw"
sanitizer_policy = "raw"

# Bound both entry size and aggregate rate. Log loss is preferable to allowing a
# log burst to consume resources needed by a running game.
[pipelines.flow.rate_limit]
entries_per_second = 400.0
burst_entries = 800.0
policy = "drop"
max_entry_size_bytes = 65536

# What the public operational feed does not carry: TRACE records, and the `admit`
# sub, whose records name the accepted socket's address. Both stay in the node-local
# files. The filter examines the unparsed message; every emitted line stays whole.
[[pipelines.flow.filters]]
type = "exclude"
logic = "or"
patterns = ["\"level\":\"TRACE\"", "\"sub\":\"admit\""]

[[pipelines.plugin_sources]]
id = "fleet"
type = "file"
[pipelines.plugin_sources.config]
directory = "/var/log/vif-fleet"
pattern = "*.jsonl"
check_interval_ms = 100
raw = true
from = "start"

# The unauthenticated stream is reachable only on loopback. The allocator exposes
# it as a byte proxy; no browser or remote host connects here.
#
# client_buffer_size clears the burst above. The sink queues a whole release per
# client while its reader writes one frame at a time, so a shorter queue loses the
# tail of every burst the rate limit allows, to a reader that would have drained
# it. One mechanism decides what this stream loses, and it is the rate limit; a
# reader that truly cannot keep up is disconnected at write_timeout_ms instead.
[[pipelines.plugin_sinks]]
id = "stream"
type = "http"
[pipelines.plugin_sinks.config]
host = "127.0.0.1"
port = 8081
stream_path = "/stream"
status_path = "/status"
buffer_size = 4096
max_connections = 32
client_buffer_size = 1024
write_timeout_ms = 5000
