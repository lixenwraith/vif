# vif's complete built-in keymap. The runtime embeds this file, while
# `make install-config` installs the same document as a user-editable override.

[normal_keys]
ctrl_q = "quit"
ctrl_c = "quit"
ctrl_s = "toggle_audio_cycle"
ctrl_g = "config_menu"
escape = "escape"
up = "motion_up"
down = "motion_down"
left = "motion_left"
right = "motion_right"
home = "motion_line_start"
end = "motion_line_end"
tab = "nugget_jump"
backtab = "gold_jump"
enter = "fire_main"
backspace = "fire_special"
page_up = "motion_half_page_up"
page_down = "motion_half_page_down"

[normal]
h = "motion_left"
j = "motion_down"
k = "motion_up"
l = "motion_right"
H = "motion_half_page_left"
J = "motion_half_page_down"
K = "motion_half_page_up"
L = "motion_half_page_right"
a = "toggle_auto_fire"
w = "motion_word_forward"
W = "motion_word_forward_big"
b = "motion_word_back"
B = "motion_word_back_big"
e = "motion_word_end"
E = "motion_word_end_big"
zero = "motion_line_start"
"^" = "motion_first_non_ws"
"$" = "motion_line_end"
"[" = "motion_column_up"
"]" = "motion_column_down"
O = "motion_column_up"
o = "motion_column_down"
u = "undo"
M = "motion_screen_vertical_mid"
m = "motion_screen_horizontal_mid"
G = "motion_screen_bottom"
"{" = "motion_para_back"
"}" = "motion_para_forward"
"%" = "motion_match_bracket"
f = "char_find_forward"
F = "char_find_back"
t = "char_till_forward"
T = "char_till_back"
d = "operator_delete"
g = "prefix_g"
space = "fire_special"
i = "mode_insert"
v = "mode_visual"
"/" = "mode_search"
":" = "mode_command"
x = "special_delete_char"
D = "special_delete_to_end"
n = "special_search_next"
N = "special_search_prev"
";" = "special_repeat_find"
"," = "special_repeat_find_rev"
q = "macro_record_toggle"
"@" = "prefix_macro_play"

[operator]
w = "motion_word_forward"
W = "motion_word_forward_big"
b = "motion_word_back"
B = "motion_word_back_big"
e = "motion_word_end"
E = "motion_word_end_big"
zero = "motion_line_start"
"^" = "motion_first_non_ws"
"$" = "motion_line_end"
G = "motion_screen_bottom"
"{" = "motion_para_back"
"}" = "motion_para_forward"
"%" = "motion_match_bracket"
h = "motion_left"
j = "motion_down"
k = "motion_up"
l = "motion_right"
H = "motion_half_page_left"
J = "motion_half_page_down"
K = "motion_half_page_up"
L = "motion_half_page_right"
space = "motion_right"
f = "char_find_forward"
F = "char_find_back"
t = "char_till_forward"
T = "char_till_back"
g = "prefix_g"

[prefix_g]
g = "motion_screen_top"
o = "motion_origin"
"$" = "motion_end"
m = "motion_center"
h = "marker_glyph_left"
j = "marker_glyph_down"
k = "marker_glyph_up"
l = "marker_glyph_right"

[overlay]
h = "motion_left"
j = "motion_down"
k = "motion_up"
l = "motion_right"
g = "motion_screen_top"
G = "motion_screen_bottom"
space = "overlay_activate"
q = "overlay_close"
"/" = "overlay_filter"

[overlay_keys]
ctrl_g = "config_menu"
up = "motion_up"
down = "motion_down"
left = "motion_left"
right = "motion_right"
home = "motion_screen_top"
end = "motion_screen_bottom"
escape = "overlay_close"
enter = "overlay_activate"
page_up = "overlay_page_up"
page_down = "overlay_page_down"

[text_keys]
ctrl_g = "config_menu"
up = "motion_up"
down = "motion_down"
left = "motion_left"
right = "motion_right"
home = "motion_line_start"
end = "motion_line_end"
backspace = "text_backspace"
delete = "text_delete_current"
page_up = "motion_half_page_up"
page_down = "motion_half_page_down"
enter = "text_confirm"
escape = "escape"
ctrl_q = "quit"
ctrl_c = "quit"
ctrl_s = "toggle_audio_cycle"
