# patrol: a wanderer. It walks a random direction for a random count, now and then
# leaps along the text or clicks a random cell it can see, and makes for a nugget
# when one shows. Every choice draws from the bot's own stream, so one seed walks
# one way. Auto-fire, on by default, does its shooting.
[bot]
actions_per_second = 8

[regions.play]
initial = "Walk"

[states.Walk]
on_update = [
    { action = "Intent", payload = { name = ["motion_left", "motion_right", "motion_up", "motion_down"], count = [2, 10] },
      guard = "Chance", guard_args = { percent = 12 } },
    { action = "Intent", payload = { name = ["motion_word_forward", "motion_word_back", "motion_para_forward", "motion_para_back"] },
      guard = "Chance", guard_args = { percent = 3 } },
]
transitions = [
    { trigger = "Tick", target = "Leap", guard = "Chance", guard_args = { percent = 1 } },
    { trigger = "Tick", target = "Fetch", guard = "HasTarget", guard_args = { target = "nugget", within = 20 } },
]

# A leap clicks a random visible cell, then catches its breath.
[states.Leap]
on_enter = [{ action = "PointAt", payload = { target = "random", fire = true } }]
transitions = [{ trigger = "Tick", target = "Walk", guard = "StateTimeExceeds", guard_args = { ms = 400 } }]

# Tab jumps to the nugget; a walk resumes once it is taken or out of reach.
[states.Fetch]
on_enter = [{ action = "Intent", payload = { name = "nugget_jump" } }]
transitions = [
    { trigger = "Tick", target = "Walk", guard = "Not", guard_args = { guard = { name = "HasTarget", args = { target = "nugget", within = 20 } } } },
    { trigger = "Tick", target = "Walk", guard = "StateTimeExceeds", guard_args = { ms = 2000 } },
]
