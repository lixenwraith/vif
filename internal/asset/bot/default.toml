# Type runs left to right; when text is absent, collect nuggets between patrols.
[bot]
actions_per_second = 12

[regions.play]
initial = "Seek"

[states.Seek]
on_update = [{ action = "PointAt", payload = { target = "glyph" } }]
transitions = [
    { trigger = "Tick", target = "Gold", guard = "HasTarget", guard_args = { target = "gold" } },
    { trigger = "Tick", target = "Nugget", guard = "HasTarget", guard_args = { target = "nugget", within = 12 } },
    { trigger = "Tick", target = "Type", guard = "OnTarget", guard_args = { target = "glyph" } },
    { trigger = "Tick", target = "Walk", guard = "Not", guard_args = { guard = { name = "HasTarget", args = { target = "glyph" } } } },
]

[states.Type]
on_update = [{ action = "TypeGlyph" }]
transitions = [
    { trigger = "Tick", internal = true, guard = "OnTarget", guard_args = { target = "glyph" } },
    { trigger = "Tick", target = "Seek" },
]

[states.Gold]
on_enter = [{ action = "Intent", payload = { name = "gold_jump" } }]
on_update = [{ action = "TypeGlyph", guard = "OnTarget", guard_args = { target = "gold" } }]
transitions = [
    { trigger = "Tick", internal = true, guard = "OnTarget", guard_args = { target = "gold" } },
    { trigger = "Tick", target = "Seek", guard = "StateTimeExceeds", guard_args = { ms = 1500 } },
]

# Recheck all nuggets between movements, including ones outside the viewport.
[states.Walk]
on_update = [
    { action = "Intent", payload = { name = ["motion_left", "motion_right", "motion_up", "motion_down"], count = [2, 10] },
      guard = "Chance", guard_args = { percent = 12 } },
]
transitions = [
    { trigger = "Tick", target = "Seek", guard = "HasTarget", guard_args = { target = "glyph" } },
    { trigger = "Tick", target = "Gold", guard = "HasTarget", guard_args = { target = "gold" } },
    { trigger = "Tick", target = "Nugget", guard = "HasTarget", guard_args = { target = "nugget" } },
    { trigger = "Tick", target = "Leap", guard = "Chance", guard_args = { percent = 1 } },
]

[states.Leap]
on_enter = [{ action = "PointAt", payload = { target = "random", fire = true } }]
transitions = [{ trigger = "Tick", target = "Walk", guard = "StateTimeExceeds", guard_args = { ms = 400 } }]

[states.Nugget]
on_enter = [{ action = "Intent", payload = { name = "nugget_jump" } }]
transitions = [{ trigger = "Tick", target = "Seek", guard = "StateTimeExceeds", guard_args = { ms = 300 } }]
