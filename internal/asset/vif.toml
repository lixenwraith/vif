# vif.toml: what a flag would otherwise say on every run. A flag given on the
# command line wins. The first configuration root holding this file supplies it
# (-config-dir, the user root, a checkout's wad, then the system roots); a key it
# leaves out keeps the default written here. A relative path is relative to this file, and
# "~/" is the home directory; an empty path is the platform default.

[paths]
# A configuration root searched before the user root, as -config-dir names one.
# The vif.toml inside it is not read.
root = ""
# Where -l writes session logs, -j replay journals and -mw the music as WAV; the
# flags still turn each on. Default $XDG_STATE_HOME/vif/log, .../journal, .../music.
log = ""
journal = ""
music = ""
# What -s, -f and -k name: a scenario name or path, a content directory or
# file, a keymap file.
scenario = ""
content = ""
keymap = ""
# Where [session] save_downloads saves the scenarios sessions' hosts send.
# Default scenario/downloads in the user root, where -s and the menu find them.
downloads = ""

[audio]
# Mixer period and output latency, in milliseconds: a multiple of 10 from 10
# to 200. Shorter reacts sooner and underruns more easily on a loaded machine.
buffer_ms = 50

[presentation]
# Where the game is drawn when no flag says: the terminal, or with window = true
# the desktop window -g opens (Linux and FreeBSD; a build without one refuses).
# -g, -g=false and -cli win for that run. The window opens maximized or full
# screen when asked, as -maximized and -fullscreen ask; a terminal run ignores both.
window = false
maximized = false
fullscreen = false
# A cell's height in dp, a CSS pixel in a browser, as a pinch on Android or a zoom
# in a browser left it, from 4 to 40, written back like [play]; 0 is the screen's
# own size. The terminal and the desktop window ignore it.
cell = 0
# Inside tmux or screen, draw at most 24 frames a second: past that they drop the
# output and repaint about 10 a second. false draws at full rate; max_fps wins.
tmux_frame_cap = true

# What the configuration menu changes in a run, written back so the next starts
# as this one was left: the two audio channels, sound effects (sfx) and music, the
# sfx volume (0 to 1), auto-fire (off, main or on), mouse input, the cursor
# following the pointer, the telemetry HUD, relaying for players who reach this run
# and not their host, taking over a session whose host chose migrate when that host
# goes (takeover: this run then listens on a port in such a session, which shares
# its address with the other players), announcing the games this run hosts to its
# local network (lan), each game started or restarted waiting for a key, click or
# tap, the most frames drawn a second (max_fps, 10 to 120, never under one a tick;
# 0 is three a tick, 60 at the default, and 24 inside tmux or screen, which drop
# what a terminal sends them faster), and whether a game that may pause (solo, or
# hosting only your own bots) pauses while the menu or another window is open
# (pause_menu) and while the command line is open (pause_command), and the camera's
# edge (camera_edge, below).
# A run writes this file when it is in the user root or the
# -config-dir root, and otherwise the user root's, made from this one at the first
# change. A flag naming one of these, -mute for both channels or -nw for the wait,
# sets it for that run alone; only what the player changes in the run is written.
[play]
sfx = true
music = true
sfx_volume = 0.5
auto_fire = "on"
mouse = true
follow_mouse = true
hud = false
relay = false
takeover = false
lan = false
wait = true
max_fps = 0
pause_menu = true
pause_command = true
# How near the view's sides the cursor comes before the view follows it, whatever
# moved it: a percent of the screen's size, 0 to 50, as far from every side. 0
# follows once the cursor is on the edge row or column, 50 on every move.
camera_edge = 15

# Whether a run keeps the places it holds in its sessions past the process, so a
# restart, a crash or a reboot comes back to the place its Wraith kept for it: the
# key each place is held under, in $XDG_STATE_HOME/vif/places.json, readable by
# you alone. false keeps them for the run; a page keeps them for its tab either way.
[session]
resume_after_restart = true
# Whether a scenario a session's host sends, because no root here holds its exact
# bytes, is saved in [paths] downloads as <name>-<digest>: a later join reads it
# there instead of downloading it again, and -s, :n and the menu's list offer it
# by that name. Its contents are the host's, not yours; false keeps it for the
# run alone. A browser saves none.
save_downloads = false
