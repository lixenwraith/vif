# The tonal voices: an oscillator stack through a resonant low-pass under a filter
# envelope into an ADSR, or a string, as a delay line ("string") or as its partials
# ("modal"). A name patterns use binds to that instrument; a later file overrides
# one by name, and a new name adds an instrument. Times are seconds, frequencies Hz,
# sustain and levels linear; an omitted key is the neutral default.

[[voice]]
name = "bass"
desc = "a pizzicato double bass: a finger-plucked string whose body sounds its lowest fundamentals weakly, falling away within a second and fading over a few; the note-off a 45 ms damper"
