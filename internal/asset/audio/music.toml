# Built-in music patterns. A step is a sixteenth, sixteen to a bar; a 64-step
# pattern is four, the length of the chord progression (i i VI VII in E Phrygian).
# vel, prob and humanize are 0..1; deg is a scale degree and oct an octave above the
# harmony root; a chord-following track reads deg from the bar's chord root, so 0 2 4
# are its chord tones and 7 its octave. role, groups and tiers place a pattern in the
# drawn music: a group's bass is its anchor and holds through every tier it covers,
# while its rhythms and melodies change with the tier. A pattern without tiers plays
# only when placed. Macros (doc/toml-macros.md) write a lane once: Drum and Drums
# are hit lanes, Line and LineV note lines, Chord a stack of notes at one step.

[macros.Hit]
doc = "One drum hit at pos; prob under 1 makes it a chance hit"
params = { pos = "int", vel = "float", prob = "float" }
defaults = { prob = 0 }
body = { pos = "${pos}", vel = "${vel}", prob = "${prob}" }

[macros.Drum]
doc = "A drum lane: instr at every pos, all at vel"
params = { instr = "string", pos = "array", vel = "float", humanize = "float", prob = "float" }
defaults = { humanize = 0.4, prob = 0 }
body = { instr = "${instr}", humanize = "${humanize}", event = [
  { macro = "Hit", each = { pos = "${pos}" }, vel = "${vel}", prob = "${prob}" },
] }

[macros.Drums]
doc = "A drum lane with a velocity per hit"
params = { instr = "string", pos = "array", vel = "array", humanize = "float", prob = "float" }
defaults = { humanize = 0.4, prob = 0 }
body = { instr = "${instr}", humanize = "${humanize}", event = [
  { macro = "Hit", each = { pos = "${pos}", vel = "${vel}" }, prob = "${prob}" },
] }

[macros.Kick4]
doc = "Four-on-the-floor kick"
params = { vel = "float" }
defaults = { vel = 1.0 }
body = { macro = "Drum", instr = "kick", pos = [0, 4, 8, 12], vel = "${vel}", humanize = 0 }

[macros.Hats16]
doc = "Sixteenth hats: acc on the eighths, ghost between them"
params = { acc = "float", ghost = "float", humanize = "float" }
defaults = { humanize = 0.6 }
body = { instr = "hihat", humanize = "${humanize}", event = [
  { macro = "Hit", each = { pos = [0, 2, 4, 6, 8, 10, 12, 14] }, vel = "${acc}" },
  { macro = "Hit", each = { pos = [1, 3, 5, 7, 9, 11, 13, 15] }, vel = "${ghost}" },
] }

[macros.Note]
doc = "One note: pos, deg, dur in steps, vel, oct above the root"
params = { pos = "int", deg = "int", dur = "int", vel = "float", oct = "int" }
defaults = { deg = 0, dur = 1, vel = 0.5, oct = 2 }
body = { pos = "${pos}", deg = "${deg}", dur = "${dur}", vel = "${vel}", oct = "${oct}" }

[macros.Line]
doc = "A line on instr: a note per pos, deg and dur at one vel; follow reads deg from the chord"
params = { instr = "string", pos = "array", deg = "array", dur = "array", vel = "float", oct = "int", follow = "bool", humanize = "float" }
defaults = { vel = 0.5, oct = 2, follow = true, humanize = 0.25 }
body = { instr = "${instr}", follow_chord = "${follow}", humanize = "${humanize}", event = [
  { macro = "Note", each = { pos = "${pos}", deg = "${deg}", dur = "${dur}" }, vel = "${vel}", oct = "${oct}" },
] }

[macros.LineV]
doc = "A line with a velocity per note"
params = { instr = "string", pos = "array", deg = "array", dur = "array", vel = "array", oct = "int", follow = "bool", humanize = "float" }
defaults = { oct = 2, follow = true, humanize = 0.25 }
body = { instr = "${instr}", follow_chord = "${follow}", humanize = "${humanize}", event = [
  { macro = "Note", each = { pos = "${pos}", deg = "${deg}", dur = "${dur}", vel = "${vel}" }, oct = "${oct}" },
] }

[macros.Chord]
doc = "A chord of degs at one pos"
params = { pos = "int", deg = "array", dur = "int", vel = "float", oct = "int" }
defaults = { dur = 1, vel = 0.4, oct = 2 }
body = [{ macro = "Note", each = { deg = "${deg}" }, pos = "${pos}", dur = "${dur}", vel = "${vel}", oct = "${oct}" }]

[macros.PadTriad]
doc = "A pad triad held a bar at each pos"
params = { pos = "array", vel = "float" }
defaults = { vel = 0.2 }
body = { instr = "pad", follow_chord = true, event = [
  { macro = "Chord", each = { pos = "${pos}" }, deg = [0, 2, 4], dur = 16, vel = "${vel}", oct = 1 },
] }

[macros.PadFifth]
doc = "A pad root and fifth held a bar at each pos"
params = { pos = "array", vel = "float" }
defaults = { vel = 0.2 }
body = { instr = "pad", follow_chord = true, event = [
  { macro = "Chord", each = { pos = "${pos}" }, deg = [0, 4], dur = 16, vel = "${vel}", oct = 1 },
] }

