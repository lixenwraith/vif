# Percussion. Names bind to InstrumentType in drumkit.go; overriding "kick" in
# user TOML replaces the kit piece. Six variants with a tighter walk than SFX.

[[sound]]
name = "kick"
duration = 0.16
raw = true          # the master tanh sets the level under unity; no peak normalization
variants = 6
pitch_walk = 0.08
length_walk = 0.20
chain = [{ kind = "shape", drive = 1.8 }]
[[sound.layer]]
source = { kind = "sweep", wave = "sine", freq = 160, freq_end = 42, curve = "exp", curve_k = 8 }
chain = [{ kind = "decay", tau = 0.034 }]
[[sound.layer]]
gain = 0.15
length = 0.006
source = { kind = "noise" }
chain = [
  { kind = "decay", tau = 0.0015 },
  { kind = "hp", freq = 1500, q = 0.707 }
]

[[sound]]
name = "hihat"
duration = 0.08
norm = 0.9
variants = 6
pitch_walk = 0.08
length_walk = 0.20
[[sound.layer]]
source = { kind = "noise" }
chain = [
  { kind = "decay", tau = 0.0053333 },
  { kind = "hp", freq = 7000, q = 0.707 }
]

[[sound]]
name = "snare"
desc = "wood shell: two head modes under wires that bloom a few ms after the stick"
duration = 0.26
norm = 0.74
variants = 6
pitch_walk = 0.06
length_walk = 0.20
chain = [{ kind = "hp", freq = 130, q = 0.707 }]
[[sound.layer]]
gain = 0.75
source = { kind = "sweep", wave = "sine", freq = 196, freq_end = 176, curve = "exp", curve_k = 6 }
chain = [{ kind = "decay", tau = 0.07 }]
[[sound.layer]]
gain = 0.35
source = { kind = "osc", wave = "sine", freq = 334 }
chain = [{ kind = "decay", tau = 0.04 }]
[[sound.layer]]
gain = 0.4
length = 0.005
source = { kind = "noise" }
chain = [{ kind = "decay", tau = 0.0012 }, { kind = "bp", freq = 4000, q = 0.7 }]
[[sound.layer]]
gain = 0.6
offset = 0.002
source = { kind = "noise" }
chain = [
  { kind = "decay", attack = 0.004, tau = 0.12 },
  { kind = "hp", freq = 1000, q = 0.707 },
  { kind = "lp", freq = 7000, q = 0.707 }
]
[[sound.layer]]
gain = 0.3
offset = 0.002
source = { kind = "noise" }
chain = [{ kind = "decay", attack = 0.003, tau = 0.08 }, { kind = "bp", freq = 1700, q = 1.0, track_pitch = true }]
[[sound]]
name = "clap"
duration = 0.10
norm = 0.9
variants = 6
pitch_walk = 0.08
length_walk = 0.20
chain = [{ kind = "bp", freq = 1500, q = 2.0 }]
[[sound.layer]]
length = 0.06
source = { kind = "burst", burst = { count = 4, len = 0.01, gap = 0.005, tau = 0.002, decay = 0.15 } }
[[sound.layer]]
gain = 0.3
offset = 0.06
length = 0.04
source = { kind = "noise" }
chain = [{ kind = "decay", tau = 0.005 }]

