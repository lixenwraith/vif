# Parallel region for player lifecycle, global state and reset

# Boot: the world starts with no cursor, so spawning one is a deliberate step
[states.MonitorBoot]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventCursorSpawnRequest", payload = { center = true, heat = 10, energy = 100 } },
]
transitions = [
    { trigger = "EventCursorSpawned", target = "MonitorArm", capture_vars = { entity = "player_entity" } },
    { trigger = "EventCursorSpawnFailed", target = "MonitorBootRetry" },
]

[states.MonitorBootRetry]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "MonitorBoot", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

# Arm the spawned cursor and open gameplay; the reset gate needs a non-zero start
[states.MonitorArm]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventCursorArmRequest", payload = { heat = 10, energy = 100 } },
    { action = "SpawnRegion", region = "main", initial_state = "MainSpawnGold" },
]
transitions = [
    { trigger = "Tick", target = "MonitorActive" },
]

[states.MonitorCycle]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "MonitorGlobalReset", guard = "VarEquals", guard_args = { var = "level_failed", value = 1 } },
]

[states.MonitorActive]
parent = "MonitorCycle"
transitions = [
    { trigger = "Tick", target = "MonitorGlobalReset", guard = "StatusBoolEquals", guard_args = { key = "session.any_defeated", value = true } },
]

# HeatSystem owns local burst effects; shared regions cannot transition on them (D-20).

[states.MonitorGlobalReset]
parent = "Root"
# A defeat starts a new game, the same reset :n requests, so every tally restarts
# with the run. The reset re-initializes systems before it exits this state, so the
# flash lands on the new game instead of being cleared with the old one.
on_enter = [
    { action = "EmitEvent", event = "EventGameResetRequest" },
]
on_exit = [
    { action = "EmitEvent", event = "EventStrobeRequest", payload = { color = { r = 255, g = 0, b = 0 }, intensity = 1.0, duration_ms = 250 } },
]
