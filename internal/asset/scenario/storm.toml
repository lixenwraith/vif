# Storm region: every third storm kill opens the next boss, the Kraken, the
# Devourer and then the tower

[states.StormHold]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventDrainPause", reconcile = true },
]
on_exit = [
    { action = "EmitEvent", event = "EventDrainResume", reconcile = true },
]

[states.StormSetup]
parent = "StormHold"
on_enter = [
    # Storm, Kraken, Devourer and tower have no gold of their own; each setup ends a carried one
    { action = "EmitEvent", event = "EventGoldCancel" },
    { action = "EmitEvent", event = "EventStormSpawnRequest" },
]
transitions = [
    { trigger = "EventSpeciesCreated", target = "StormActive", guard = "PayloadSpeciesIn", guard_args = { field = "species", names = ["storm"] } },
    # The request was refused: ask again instead of falling through StormActive's
    # defensive timeout, which retires the region as if the storm had been fought.
    { trigger = "Tick", target = "StormSetupRetry", guard = "StateTimeExceeds", guard_args = { ms = 500 } },
]

[states.StormSetupRetry]
parent = "StormHold"
transitions = [
    { trigger = "Tick", target = "StormSetup", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

[states.StormActive]
parent = "StormHold"
transitions = [
    { trigger = "EventSpeciesKilled", target = "StormDecision", guard = "PayloadSpeciesIn", guard_args = { field = "species", names = ["storm"] } },
    { macro = "LeftMap", active = "storm.active", target = "StormVictory" },
]

[states.StormDecision]
parent = "StormHold"
on_enter = [
    { action = "EmitEvent", event = "EventCycleDamageMultiplierIncrease" },
    { action = "EmitEvent", event = "EventMetaStatusMessageRequest", payload = { message = "Species Damage Up" } },
]
transitions = [
    { trigger = "Tick", target = "StormEscalate", guard = "StatusIntCompare", guard_args = { key = "kills.storm", since = "storm_mark", op = "gte", value = 3 } },
    { trigger = "Tick", target = "StormVictory" },
]

# next_boss, unset in a new game, names the boss this escalation opens: the Kraken,
# the Devourer, then the tower, after which the cycle starts over
[states.StormEscalate]
parent = "Root"
on_enter = [
    { action = "StatusToVar", payload = { key = "kills.storm", name = "storm_mark" } },
    { action = "EmitEvent", event = "EventStormCancelRequest" },
    { action = "SpawnRegion", region = "kraken", initial_state = "KrakenSetup", guard = "VarEquals", guard_args = { var = "next_boss", value = 0 } },
    { action = "SpawnRegion", region = "devourer", initial_state = "DevourerSetup", guard = "VarEquals", guard_args = { var = "next_boss", value = 1 } },
    { action = "SpawnRegion", region = "tower", initial_state = "TowerSetup", guard = "VarEquals", guard_args = { var = "next_boss", value = 2 } },
    { action = "IncrementVar", payload = { name = "next_boss" } },
    { action = "ModuloVar", payload = { name = "next_boss", delta = 3 } },
    { action = "TerminateRegion", region = "storm" },
]

[states.StormVictory]
parent = "Root"
on_enter = [
    { action = "ResumeRegion", region = "main" },
    { action = "TerminateRegion", region = "storm" },
]
