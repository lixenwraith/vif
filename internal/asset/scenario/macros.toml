# Building blocks the campaign's regions are written in; syntax in doc/toml-macros.md.

[macros.LeftMap]
doc = "Go to `target` once status `active` reports the species gone without a kill event (it left the map)."
params = { active = "string", target = "string" }
body = { trigger = "Tick", target = "${target}", guard = "And", guard_args = { guards = [
    { name = "StateTimeExceeds", args = { ms = 2000 } },
    { name = "StatusBoolEquals", args = { key = "${active}", value = false } },
] } }

# --- Tower: corner pylons, each at p_<corner>_x/y, each feeding the tower's group ---

[macros.TowerPylon]
doc = "Spawn a pylon at corner `corner` into gw_anchor and go to `attach`, or skip to `next` when it cannot spawn."
params = { corner = "string", attach = "string", next = "string" }
body = { parent = "TowerCycle", on_enter = [
    { action = "EmitEvent", event = "EventPylonSpawnRequest", payload = { x = 0, y = 0 }, payload_vars = { X = "p_${corner}_x", Y = "p_${corner}_y" } },
], transitions = [
    { trigger = "EventSpeciesCreated", target = "${attach}", guard = "PayloadIntCompare", guard_args = { field = "species", op = "eq", value = 5 }, capture_vars = { entity = "gw_anchor" } },
    { trigger = "EventPylonSpawnFailed", target = "${next}" },
    { trigger = "Tick", target = "${next}", guard = "StateTimeExceeds", guard_args = { ms = 500 } },
] }

[macros.TowerGateway]
doc = "Attach an eye gateway to the pylon in gw_anchor, count the pylon toward victory, and go to `next`."
params = { next = "string" }
body = { parent = "TowerCycle", on_enter = [
    { action = "EmitEvent", event = "EventGatewaySpawnRequest", payload = { anchor_entity = 0, species = 7, sub_type = 0, group_id = 1, base_interval_ms = 3000, rate_multiplier = 0.92, rate_accel_interval_ms = 15000, min_interval_ms = 800, use_route_graph = true }, payload_vars = { anchor_entity = "gw_anchor" } },
    { action = "IncrementVar", payload = { name = "pylons_spawned" } },
], transitions = [{ trigger = "Tick", target = "${next}" }] }
