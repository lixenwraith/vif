# Quasar region: gold cycle during quasar with escalation to storm

[states.QuasarHold]
parent = "Root"
# Persistent local effects belong to the state path that holds them. Importing an
# authoritative FSM position replays only actions marked reconcile when that path
# is entered or exited, including when the capture retires the whole region.
on_enter = [
    { action = "EmitEvent", event = "EventGrayoutStart", payload = { entity = 0 }, payload_vars = { entity = "fuse_owner" }, reconcile = true },
    { action = "EmitEvent", event = "EventDrainPause", payload = { entity = 0 }, payload_vars = { entity = "fuse_owner" }, reconcile = true },
]
on_exit = [
    { action = "EmitEvent", event = "EventGrayoutEnd", payload = { entity = 0 }, payload_vars = { entity = "fuse_owner" }, reconcile = true },
    { action = "EmitEvent", event = "EventDrainResume", payload = { entity = 0 }, payload_vars = { entity = "fuse_owner" }, reconcile = true },
]

[states.QuasarFuse]
parent = "QuasarHold"
on_enter = [
    # Persistent effects live on QuasarHold. This state keeps only one-shot fuse
    # work, which correction must not replay.
    { action = "EmitEvent", event = "EventStrobeRequest", payload = { intensity = 0.8, duration_ms = 200, cursor = 0 }, payload_vars = { cursor = "fuse_owner" } },
    { action = "EmitEvent", event = "EventFuseQuasarRequest", payload = { entity = 0 }, payload_vars = { entity = "fuse_owner" } },
]
transitions = [
    { trigger = "EventSpeciesCreated", target = "QuasarGoldSpawn", guard = "PayloadIntCompare", guard_args = { field = "species", op = "eq", value = 3 } },
    # Defensive: spawn never arrived
    { trigger = "Tick", target = "QuasarExit", guard = "StateTimeExceeds", guard_args = { ms = 5000 } },
]

# --- Gold Cycle Parent ---

[states.QuasarGoldCycle]
parent = "QuasarHold"
on_exit = [
    { action = "EmitEvent", event = "EventGoldCancel" },
]
transitions = [
    # FSM dispatch precedes kill telemetry for the same event, so two prior
    # quasar kills plus this payload reaches the three-kill escalation gate.
    { trigger = "EventSpeciesKilled", target = "QuasarEscalate", guard = "And", guard_args = { guards = [
        { name = "PayloadIntCompare", args = { field = "species", op = "eq", value = 3 } },
        { name = "StatusIntCompare", args = { key = "kills.quasar", op = "gte", value = 2 } },
    ] } },
    { trigger = "EventSpeciesKilled", target = "QuasarExit", guard = "PayloadIntCompare", guard_args = { field = "species", op = "eq", value = 3 } },
    { trigger = "Tick", target = "QuasarEscalate", guard = "StatusIntCompare", guard_args = { key = "kills.quasar", op = "gte", value = 3 } },
    { macro = "LeftMap", active = "quasar.active", target = "QuasarExit" },
]

# --- Gold Spawn ---

[states.QuasarGoldSpawn]
parent = "QuasarGoldCycle"
on_enter = [
    { action = "EmitEvent", event = "EventGoldSpawnRequest" },
]
transitions = [
    { trigger = "EventGoldSpawned", target = "QuasarGoldActive" },
    { trigger = "EventGoldSpawnFailed", target = "QuasarGoldSpawnRetry" },
    { macro = "LeftMap", active = "quasar.active", target = "QuasarExit" },
]

[states.QuasarGoldSpawnRetry]
parent = "QuasarGoldCycle"
transitions = [
    { trigger = "Tick", target = "QuasarGoldSpawn", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

# --- Gold Active ---

[states.QuasarGoldActive]
parent = "QuasarGoldCycle"
transitions = [
    { trigger = "EventGoldCompleted", target = "QuasarGoldCompleted", capture_vars = { entity = "reward_entity" } },
    { trigger = "EventGoldTimeout", target = "QuasarGoldTimeout" },
    { trigger = "EventGoldDestroyed", target = "QuasarGoldDestroyed" },
    { macro = "LeftMap", active = "quasar.active", target = "QuasarExit" },
]

[states.QuasarGoldCompleted]
parent = "QuasarGoldCycle"
on_enter = [
    { action = "EmitEvent", event = "EventHeatAddRequest", payload = { entity = 0, delta = 100 }, payload_vars = { entity = "reward_entity" } },
    { action = "EmitEvent", event = "EventEnergyAddRequest", payload = { entity = 0, delta = 1000, type = 1 }, payload_vars = { entity = "reward_entity" } },
]
transitions = [
    { trigger = "Tick", target = "QuasarDustAll" },
]

[states.QuasarGoldTimeout]
parent = "QuasarGoldCycle"
transitions = [
    { trigger = "Tick", target = "QuasarDustAll" },
]

[states.QuasarGoldDestroyed]
parent = "QuasarGoldCycle"
transitions = [
    { trigger = "Tick", target = "QuasarDustAll" },
]

# --- Dust ---

[states.QuasarDustAll]
parent = "QuasarGoldCycle"
on_enter = [
    { action = "EmitEvent", event = "EventDustAllRequest" },
]
transitions = [
    { trigger = "Tick", target = "QuasarGoldSpawn" },
]

# --- Exit Conditions ---

[states.QuasarExit]
parent = "Root"
on_enter = [
    { action = "ResumeRegion", region = "main" },
    { action = "TerminateRegion", region = "quasar" },
]

[states.QuasarEscalate]
parent = "Root"
on_enter = [
    { action = "ResetStatusInt", payload = { key = "kills.quasar" } },
    { action = "EmitEvent", event = "EventQuasarCancelRequest" },
    { action = "SpawnRegion", region = "storm", initial_state = "StormSetup" },
    { action = "TerminateRegion", region = "quasar" },
]
