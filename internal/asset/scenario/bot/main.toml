# default's graph with a walk learned in this game: type runs left to right,
# back off a threat that comes within three cells and, when text is absent,
# collect nuggets between patrols, which the network walk steers. Its weights
# are a model learned here: the member a run alone fielded. A solo run learns on
# from them, a round each half hour, and any other fields the best it kept, or these.
[bot]
# Twelve for the keys and four for the special attack walk asks for
actions_per_second = 16
# The gun fires by itself and the special attack where walk asks for it
auto_fire = "main"
learn = true
# The embedded game ends no round by itself, so one is closed each half hour
round_seconds = 1800

# walk reads where the two nearest species and the Kraken are and the bot's own
# place, energy and heat, and asks for the special attack. It has the wheel
# while no text is left and while it asks for it past a mark, so text comes first.
[network.walk]
hidden = 6
outputs = ["special", "move", "wheel"]
inputs = [
    "species_x", "species_y", "species_near_x", "species_near_y",
    "species2_x", "species2_y", "species2_near_x", "species2_near_y",
    "kraken_x", "kraken_y", "kraken_near_x", "kraken_near_y", "kraken_hp",
    "column", "row", "energy", "heat",
]

[regions.play]
initial = "Seek"

# The special attack is walk's to ask for whatever play is doing. Regions update
# in name order, so this one follows play: a key goes ahead of a special attack
# asked for in its step, whose blast would take the key's glyph
[regions.special]
initial = "Fire"

[states.Fire]
on_update = [{ action = "Steer", payload = { outputs = ["special"] } }]

[states.Seek]
on_update = [{ action = "PointAt", payload = { target = "glyph" } }]
transitions = [
    { trigger = "Tick", target = "Flee", guard = "HasTarget", guard_args = { target = "threat", within = 3 } },
    { trigger = "Tick", target = "Walk", guard = "Asks", guard_args = { output = "wheel", above = 1 } },
    { trigger = "Tick", target = "Gold", guard = "HasTarget", guard_args = { target = "gold" } },
    { trigger = "Tick", target = "Nugget", guard = "HasTarget", guard_args = { target = "nugget", within = 12 } },
    { trigger = "Tick", target = "Type", guard = "OnTarget", guard_args = { target = "glyph" } },
    { trigger = "Tick", target = "Walk", guard = "Not", guard_args = { guard = { name = "HasTarget", args = { target = "glyph" } } } },
]

[states.Type]
on_update = [{ action = "TypeGlyph" }]
transitions = [
    { trigger = "Tick", target = "Flee", guard = "HasTarget", guard_args = { target = "threat", within = 3 } },
    { trigger = "Tick", target = "Walk", guard = "Asks", guard_args = { output = "wheel", above = 1 } },
    { trigger = "Tick", internal = true, guard = "OnTarget", guard_args = { target = "glyph" } },
    { trigger = "Tick", target = "Seek" },
]

[states.Gold]
on_enter = [{ action = "Intent", payload = { name = "gold_jump" } }]
on_update = [{ action = "TypeGlyph", guard = "OnTarget", guard_args = { target = "gold" } }]
transitions = [
    { trigger = "Tick", internal = true, guard = "OnTarget", guard_args = { target = "gold" } },
    { trigger = "Tick", target = "Seek", guard = "StateTimeExceeds", guard_args = { ms = 1500 } },
]

# Recheck all nuggets between movements, including ones outside the viewport.
[states.Walk]
on_update = [
    { action = "Intent", payload = { name = ["motion_left", "motion_right", "motion_up", "motion_down"], count = [2, 10] },
      guard = "Chance", guard_args = { percent = 12 } },
    { action = "Steer", payload = { outputs = ["move"] } },
]
transitions = [
    { trigger = "Tick", internal = true, guard = "Asks", guard_args = { output = "wheel", above = 1 } },
    { trigger = "Tick", target = "Seek", guard = "HasTarget", guard_args = { target = "glyph" } },
    { trigger = "Tick", target = "Gold", guard = "HasTarget", guard_args = { target = "gold" } },
    { trigger = "Tick", target = "Nugget", guard = "HasTarget", guard_args = { target = "nugget" } },
    { trigger = "Tick", target = "Leap", guard = "Chance", guard_args = { percent = 1 } },
]

# Text waits while a threat is on it: back off until none is within five cells
[states.Flee]
on_update = [{ action = "PointAt", payload = { target = "threat", away = true } }]
transitions = [
    { trigger = "Tick", target = "Seek", guard = "Not", guard_args = { guard = { name = "HasTarget", args = { target = "threat", within = 5 } } } },
]

[states.Leap]
on_enter = [{ action = "PointAt", payload = { target = "random", fire = true } }]
transitions = [{ trigger = "Tick", target = "Walk", guard = "StateTimeExceeds", guard_args = { ms = 400 } }]

[states.Nugget]
on_enter = [{ action = "Intent", payload = { name = "nugget_jump" } }]
transitions = [{ trigger = "Tick", target = "Seek", guard = "StateTimeExceeds", guard_args = { ms = 300 } }]

