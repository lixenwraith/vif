# default's graph with a walk learned in this game: type runs left to right,
# back off a threat that comes within three cells and, when text is absent,
# collect nuggets between patrols, which the network walk steers. Its weights
# are a model learned here: the member a run alone fielded. A solo run learns on
# from them, a round each half hour, and any other fields the best it kept, or these.
[bot]
actions_per_second = 12
# The gun fires by itself and the special attack where walk asks for it
auto_fire = "main"
learn = true
# The embedded game ends no round by itself, so one is closed each half hour
round_seconds = 1800

# walk reads the rock, the blocks, every species and hostile bullet, the Kraken,
# two landings and the bot's own, and asks for the special attack. It has the
# wheel while no text is left and while it asks for it past a mark, so text
# comes first.
[network.walk]
hidden = 6
outputs = ["special", "move", "wheel"]
inputs = [
    "ceiling", "floor", "ceiling_near", "floor_near", "ceiling_far", "floor_far",
    "block_up", "block_down", "block_left", "block_right",
    "species_x", "species_y", "species_near_x", "species_near_y", "species_enraged", "species_hp", "species_size", "species_vx", "species_vy",
    "species2_x", "species2_y", "species2_near_x", "species2_near_y", "species2_enraged", "species2_hp", "species2_size", "species2_vx", "species2_vy",
    "species3_x", "species3_y", "species3_near_x", "species3_near_y", "species3_enraged", "species3_hp", "species3_size", "species3_vx", "species3_vy",
    "species4_x", "species4_y", "species4_near_x", "species4_near_y", "species4_enraged", "species4_hp", "species4_size", "species4_vx", "species4_vy",
    "species5_x", "species5_y", "species5_near_x", "species5_near_y", "species5_enraged", "species5_hp", "species5_size", "species5_vx", "species5_vy",
    "species6_x", "species6_y", "species6_near_x", "species6_near_y", "species6_enraged", "species6_hp", "species6_size", "species6_vx", "species6_vy",
    "species7_x", "species7_y", "species7_near_x", "species7_near_y", "species7_enraged", "species7_hp", "species7_size", "species7_vx", "species7_vy",
    "species8_x", "species8_y", "species8_near_x", "species8_near_y", "species8_enraged", "species8_hp", "species8_size", "species8_vx", "species8_vy",
    "kraken_x", "kraken_y", "kraken_near_x", "kraken_near_y", "kraken_reach", "kraken_hp", "kraken_health",
    "landing_x", "landing_y", "landing_near_x", "landing_near_y", "landing_soon",
    "landing2_x", "landing2_y", "landing2_near_x", "landing2_near_y", "landing2_soon",
    "bullet_x", "bullet_y", "bullet_near_x", "bullet_near_y", "bullet_vx", "bullet_vy",
    "bullet2_x", "bullet2_y", "bullet2_near_x", "bullet2_near_y", "bullet2_vx", "bullet2_vy",
    "bullet3_x", "bullet3_y", "bullet3_near_x", "bullet3_near_y", "bullet3_vx", "bullet3_vy",
    "bullet4_x", "bullet4_y", "bullet4_near_x", "bullet4_near_y", "bullet4_vx", "bullet4_vy",
    "bullet5_x", "bullet5_y", "bullet5_near_x", "bullet5_near_y", "bullet5_vx", "bullet5_vy",
    "bullet6_x", "bullet6_y", "bullet6_near_x", "bullet6_near_y", "bullet6_vx", "bullet6_vy",
    "bullet7_x", "bullet7_y", "bullet7_near_x", "bullet7_near_y", "bullet7_vx", "bullet7_vy",
    "bullet8_x", "bullet8_y", "bullet8_near_x", "bullet8_near_y", "bullet8_vx", "bullet8_vy",
    "column", "row", "energy", "heat", "overheat", "ember", "shield", "boost",
    "weapon_rod", "weapon_launcher", "weapon_disruptor", "weapon_turret", "weapon_emitter", "weapon_gun",
]

[regions.play]
initial = "Seek"

# The special attack is walk's to ask for whatever play is doing
[regions.fire]
initial = "Fire"

[states.Fire]
on_update = [{ action = "Steer", payload = { outputs = ["special"] } }]

[states.Seek]
on_update = [{ action = "PointAt", payload = { target = "glyph" } }]
transitions = [
    { trigger = "Tick", target = "Flee", guard = "HasTarget", guard_args = { target = "threat", within = 3 } },
    { trigger = "Tick", target = "Walk", guard = "Asks", guard_args = { output = "wheel", above = 1 } },
    { trigger = "Tick", target = "Gold", guard = "HasTarget", guard_args = { target = "gold" } },
    { trigger = "Tick", target = "Nugget", guard = "HasTarget", guard_args = { target = "nugget", within = 12 } },
    { trigger = "Tick", target = "Type", guard = "OnTarget", guard_args = { target = "glyph" } },
    { trigger = "Tick", target = "Walk", guard = "Not", guard_args = { guard = { name = "HasTarget", args = { target = "glyph" } } } },
]

[states.Type]
on_update = [{ action = "TypeGlyph" }]
transitions = [
    { trigger = "Tick", target = "Flee", guard = "HasTarget", guard_args = { target = "threat", within = 3 } },
    { trigger = "Tick", target = "Walk", guard = "Asks", guard_args = { output = "wheel", above = 1 } },
    { trigger = "Tick", internal = true, guard = "OnTarget", guard_args = { target = "glyph" } },
    { trigger = "Tick", target = "Seek" },
]

[states.Gold]
on_enter = [{ action = "Intent", payload = { name = "gold_jump" } }]
on_update = [{ action = "TypeGlyph", guard = "OnTarget", guard_args = { target = "gold" } }]
transitions = [
    { trigger = "Tick", internal = true, guard = "OnTarget", guard_args = { target = "gold" } },
    { trigger = "Tick", target = "Seek", guard = "StateTimeExceeds", guard_args = { ms = 1500 } },
]

# Recheck all nuggets between movements, including ones outside the viewport.
[states.Walk]
on_update = [
    { action = "Intent", payload = { name = ["motion_left", "motion_right", "motion_up", "motion_down"], count = [2, 10] },
      guard = "Chance", guard_args = { percent = 12 } },
    { action = "Steer", payload = { outputs = ["move"] } },
]
transitions = [
    { trigger = "Tick", internal = true, guard = "Asks", guard_args = { output = "wheel", above = 1 } },
    { trigger = "Tick", target = "Seek", guard = "HasTarget", guard_args = { target = "glyph" } },
    { trigger = "Tick", target = "Gold", guard = "HasTarget", guard_args = { target = "gold" } },
    { trigger = "Tick", target = "Nugget", guard = "HasTarget", guard_args = { target = "nugget" } },
    { trigger = "Tick", target = "Leap", guard = "Chance", guard_args = { percent = 1 } },
]

# Text waits while a threat is on it: back off until none is within five cells
[states.Flee]
on_update = [{ action = "PointAt", payload = { target = "threat", away = true } }]
transitions = [
    { trigger = "Tick", target = "Seek", guard = "Not", guard_args = { guard = { name = "HasTarget", args = { target = "threat", within = 5 } } } },
]

[states.Leap]
on_enter = [{ action = "PointAt", payload = { target = "random", fire = true } }]
transitions = [{ trigger = "Tick", target = "Walk", guard = "StateTimeExceeds", guard_args = { ms = 400 } }]

[states.Nugget]
on_enter = [{ action = "Intent", payload = { name = "nugget_jump" } }]
transitions = [{ trigger = "Tick", target = "Seek", guard = "StateTimeExceeds", guard_args = { ms = 300 } }]

