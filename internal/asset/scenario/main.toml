# Main region: gold cycle with escalation to quasar

# Gold outlives the handover to quasar and back: the region taking over adopts the
# running sequence through its spawn request, and the monitor pays its completion.
[states.MainCycle]
parent = "Root"
transitions = [
    # FSM sees the crossing before MetaSystem increments the shared counter, so
    # nine prior defeats plus this event selects its causal participant.
    { trigger = "EventDrainDefeated", target = "MainEscalate", guard = "StatusIntCompare", guard_args = { key = "kills.drain", since = "drain_mark", op = "gte", value = 9 }, capture_vars = { entity = "fuse_owner" } },
]

# --- Gold Spawn ---

[states.MainSpawnGold]
parent = "MainCycle"
on_enter = [
    { action = "EmitEvent", event = "EventGoldSpawnRequest" },
]
transitions = [
    { trigger = "EventGoldSpawned", target = "MainGoldActive" },
    { trigger = "EventGoldSpawnFailed", target = "MainSpawnGoldRetry" },
]

[states.MainSpawnGoldRetry]
parent = "MainCycle"
transitions = [
    { trigger = "Tick", target = "MainSpawnGold", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

# --- Gold Active ---

[states.MainGoldActive]
parent = "MainCycle"
transitions = [
    { trigger = "EventGoldCompleted", target = "MainDecayWait" },
    { trigger = "EventGoldTimeout", target = "MainDecayWait" },
    # A species breaking the sequence dusts every glyph, as in quasar: what gold is
    # worth without typing it. Only a completion pays heat and energy.
    { trigger = "EventGoldDestroyed", target = "MainDecayWait", actions = [
        { action = "EmitEvent", event = "EventDustAllRequest" },
    ] },
]

# --- Decay Cycle ---

[states.MainDecayWait]
parent = "MainCycle"
transitions = [
    { trigger = "Tick", target = "MainDecayWave", guard = "StateTimeExceeds", guard_args = { ms = 5000 } },
]

[states.MainDecayWave]
parent = "MainCycle"
# ParticleBehavior: 1 = decay, 2 = blossom.
on_enter = [
    { action = "EmitEvent", event = "EventParticleWave", payload = { behavior = 1 } },
]
transitions = [
    { trigger = "Tick", target = "MainSpawnGold", guard = "StateTimeExceeds", guard_args = { ms = 5000 } },
]

# --- Escalation ---

[states.MainEscalate]
parent = "Root"
on_exit = [
    # Mark after the triggering EventDrainDefeated has reached MetaSystem.
    { action = "StatusToVar", payload = { key = "kills.drain", name = "drain_mark" } },
]
on_enter = [
    { action = "SpawnRegion", region = "quasar", initial_state = "QuasarFuse" },
    { action = "PauseRegion", region = "main" },
]
transitions = [
    { trigger = "Tick", target = "MainSpawnGold" },
]
